[project]
name = "a2a-executor"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "langchain-azure-ai[hosting]>=1.2.4",
    "langchain",
    "python-dotenv",
    "debugpy",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]