[project]
name = "harness-scaling-capabilities-responses"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "agent-framework-core==1.13.0",
    "agent-framework-foundry==1.10.3",
    "agent-framework-foundry-hosting==1.0.0b260813",
    "agent-framework-monty==1.0.0b260721",
    "agent-framework-openai==1.12.0",
    "agent-framework-tools==1.0.0b260721",
    "mcp",
    "httpx",
    "debugpy",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]