[project]
name = "claude-agent-sdk-invocations"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.1.74",
    "azure-ai-agentserver-invocations==1.1.0",
    "httpx<1.0",
    "debugpy",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]