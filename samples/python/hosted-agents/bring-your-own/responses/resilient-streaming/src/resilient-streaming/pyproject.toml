[project]
name = "resilient-streaming"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "azure-ai-agentserver-responses==2.1.0",
    "azure-ai-agentserver-core==2.1.0",
    "debugpy",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]