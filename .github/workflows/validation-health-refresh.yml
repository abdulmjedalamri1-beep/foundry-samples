name: Validation Health Refresh

# Daily cron + manual dispatch. NOT triggered by sync; see
# docs/validation-reporting-decisions.md Q3 for rationale.
#
# Delivery: rewrites the body of the pinned dashboard issue (Q2 revised
# 2026-05-28 — switched from committed-file-on-main to GitHub issue after
# branch protection forced an auto-PR detour. Pinned issue gives one-link
# discoverability, removes daily PR/commit noise, and avoids the
# sync-gate interaction of an auto-PR landing on main).

on:
  schedule:
    - cron: '30 6 * * *'   # Independent daily health snapshot; does not trigger sync.
  workflow_dispatch: {}

permissions:
  contents: read     # Read renderer scripts.
  statuses: read     # Read the combined commit-status payload.
  issues: write      # Edit the dashboard issue body.

concurrency:
  group: validation-health-refresh
  cancel-in-progress: false

env:
  DASHBOARD_ISSUE: '396'   # microsoft-foundry/foundry-samples-pr#396

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Resolve target SHA
        id: sha
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Rendering health board for $sha"

      - name: Render Validation Health Board
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bash .github/scripts/render-validation-health.sh \
            "${{ github.repository }}" \
            "${{ steps.sha.outputs.sha }}" \
            "$RUNNER_TEMP/validation-health.md" \
            "$GITHUB_WORKSPACE"

      - name: Update dashboard issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Reopen if someone closed it (the workflow is the source of truth).
          state="$(gh issue view "$DASHBOARD_ISSUE" --repo "${{ github.repository }}" --json state --jq '.state')"
          if [[ "$state" == "CLOSED" ]]; then
            echo "Issue $DASHBOARD_ISSUE was closed; reopening."
            gh issue reopen "$DASHBOARD_ISSUE" --repo "${{ github.repository }}"
          fi
          gh issue edit "$DASHBOARD_ISSUE" \
            --repo "${{ github.repository }}" \
            --body-file "$RUNNER_TEMP/validation-health.md"
          echo "Updated issue #$DASHBOARD_ISSUE for SHA ${{ steps.sha.outputs.sha }}"
