name: Verify Sync (Post-Sync Drift Check)

on:
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  statuses: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: private-repo

      - name: Read sync config
        id: config
        run: |
          CONFIG_FILE="private-repo/.github/sync-config.json"
          echo "owner=$(jq -r '.public_repo.owner' "$CONFIG_FILE")" >> "$GITHUB_OUTPUT"
          echo "repo=$(jq -r '.public_repo.name' "$CONFIG_FILE")"   >> "$GITHUB_OUTPUT"

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          owner: ${{ steps.config.outputs.owner }}
          repositories: ${{ steps.config.outputs.repo }}

      - name: Checkout public repo
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.config.outputs.owner }}/${{ steps.config.outputs.repo }}
          token: ${{ steps.app-token.outputs.token }}
          path: public-repo

      - name: Compute validation block-list
        id: blocklist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: private-repo
        run: |
          set -euo pipefail
          PRIVATE_SHA="$(git rev-parse HEAD)"
          echo "private_sha=$PRIVATE_SHA" >> "$GITHUB_OUTPUT"

          err_log="$(mktemp)"
          if ! blocklist="$(bash .github/scripts/compute-blocklist.sh \
              "${{ github.repository }}" "$PRIVATE_SHA" 2> "$err_log")"; then
            echo "::error::compute-blocklist.sh failed in verify-sync; aborting (fail-closed)"
            cat "$err_log" >&2
            exit 1
          fi
          cat "$err_log" >&2
          {
            echo "blocklist<<EOF"
            echo "$blocklist"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run drift verification
        id: verify
        env:
          SYNC_BLOCKED_PATHS: ${{ steps.blocklist.outputs.blocklist }}
        run: |
          bash private-repo/.github/scripts/verify-sync.sh \
            private-repo public-repo private-repo/.github/sync-config.json \
            >> "$GITHUB_OUTPUT"

      - name: Ensure sync-drift label exists
        if: steps.verify.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "sync-drift" \
            --repo "${{ github.repository }}" \
            --color "d93f0b" \
            --description "Public repo has drifted from the expected sync state" \
            2>/dev/null || true   # ignore error if label already exists

      - name: Open GitHub issue if drift detected
        if: steps.verify.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRIVATE_REPO: ${{ github.repository }}
          PUBLIC_REPO: ${{ steps.config.outputs.owner }}/${{ steps.config.outputs.repo }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DRIFT_COUNT: ${{ steps.verify.outputs.drift_count }}
          SYNC_WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/workflows/sync-to-public.yml
        run: |
          DRIFT_DETAILS=$(cat /tmp/drift-files.txt)
          PRIVATE_HEAD=$(git -C private-repo rev-parse HEAD)
          PUBLIC_HEAD=$(git  -C public-repo  rev-parse HEAD)

          ISSUE_TITLE="[verify-sync] Drift detected in public repo (${DRIFT_COUNT} file(s))"

          # Write issue body to a temp file to avoid shell quoting issues.
          BODY_FILE=$(mktemp /tmp/issue-body-XXXXXX.md)
          trap 'rm -f "$BODY_FILE"' EXIT
          cat > "$BODY_FILE" <<BODY_EOF
          ## ⚠️ Public Repo Drift Detected

          The post-sync verification workflow found **${DRIFT_COUNT} file(s)** where the public repo \`${PUBLIC_REPO}\` diverges from the expected state computed from the private repo.

          ### Drifted files

          \`\`\`
          ${DRIFT_DETAILS}
          \`\`\`

          ### What this means

          - Lines prefixed with \`>f\` are files that exist in the private repo (after exclude rules are applied) but are **missing or stale** in the public repo.
          - Lines prefixed with \`*deleting\` are files present in the public repo that **should have been removed** by the sync.

          ### Next steps

          1. Review the drifted files above.
          2. Trigger a manual sync from the [Sync to Public Repo](${SYNC_WORKFLOW_URL}) workflow, or investigate why the last automated sync did not propagate these changes.
          3. Close this issue once the public repo is back in sync.

          ---
          _Detected by: [verify-sync run](${RUN_URL})_
          _Private repo HEAD: \`${PRIVATE_HEAD}\`_
          _Public repo HEAD:  \`${PUBLIC_HEAD}\`_
          BODY_EOF

          # Deduplicate: close any existing open drift issues before opening a new one.
          EXISTING=$(gh issue list \
            --repo "$PRIVATE_REPO" \
            --state open \
            --label "sync-drift" \
            --json number \
            --jq '.[].number' 2>/dev/null || true)

          for issue_num in $EXISTING; do
            gh issue close "$issue_num" \
              --repo "$PRIVATE_REPO" \
              --comment "Superseded by a newer drift report." \
              2>/dev/null || true
          done

          gh issue create \
            --repo "$PRIVATE_REPO" \
            --title "$ISSUE_TITLE" \
            --body-file "$BODY_FILE" \
            --label "sync-drift"

      - name: Log success
        if: steps.verify.outputs.drift == 'false'
        run: |
          echo "✅ Post-sync verification passed — public repo is in sync."

      - name: Close resolved sync-drift issues
        if: steps.verify.outputs.drift == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PRIVATE_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          PUBLIC_HEAD=$(git -C public-repo rev-parse HEAD)
          EXISTING=$(gh issue list \
            --repo "$PRIVATE_REPO" \
            --state open \
            --label "sync-drift" \
            --json number \
            --jq '.[].number' 2>/dev/null || true)

          for issue_num in $EXISTING; do
            gh issue close "$issue_num" \
              --repo "$PRIVATE_REPO" \
              --comment "Drift resolved by [verify-sync run #${{ github.run_number }}](${RUN_URL}). Public repo HEAD: \`${PUBLIC_HEAD}\`." \
              2>/dev/null || true
          done
