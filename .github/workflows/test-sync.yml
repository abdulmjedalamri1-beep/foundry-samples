name: Test sync pipeline
permissions:
  contents: read

on:
  pull_request:
    paths:
      - '.github/scripts/sync-core.sh'
      - '.github/scripts/wait-and-merge.sh'
      - '.github/scripts/filter-stream.py'
      - '.github/tests/test-sync.sh'
      - '.github/tests/test-sync-workflow.py'
      - '.github/sync-config.json'
      - '.github/sync-mailmap'
      - '.github/workflows/sync-to-public.yml'
      - '.github/workflows/test-sync.yml'

  workflow_dispatch: # allow manual runs

jobs:
  test-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config --global user.email "test@example.com"
          git config --global user.name "Test Runner"

      - name: Run sync pipeline tests
        run: bash .github/tests/test-sync.sh
