name: Sync to Public Repo

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: builds the sync branch and pushes it but does NOT create a PR or update marks cache.'
        required: false
        type: boolean
        default: false
      additional_paths:
        description: 'Optional colon-separated repo-relative files or trailing-slash directories to sync in addition to infrastructure/ and samples/. Public metadata is not allowed.'
        required: false
        type: string
        default: ''
      seed_from_public_sha:
        description: 'Public main commit SHA to graft from when seeding paired sync marks for recovery.'
        required: false
        type: string
        default: ''
      seed_from_private_sha:
        description: 'Private main commit SHA to graft from when seeding marks. Defaults to private HEAD when empty. Use when public main is at a state corresponding to an older private SHA than current HEAD.'
        required: false
        type: string
        default: ''
      seed_blocked_paths:
        description: 'Override SYNC_BLOCKED_PATHS for the seed-marks tree-equivalence check. Colon-separated repo-relative sample paths. Use when the public seed SHA was produced by a sync that excluded paths via a historical block-list that differs from the current one (otherwise seed-marks will fail tree-equivalence on the historically-blocked paths). Only takes effect when seed_from_public_sha is set.'
        required: false
        type: string
        default: ''
      bypass_samples:
        description: 'Per-sample bypass: colon-separated repo-relative paths to force-include even if validation blocks them. Requires bypass_reason.'
        required: false
        type: string
        default: ''
      bypass_reason:
        description: 'Required if bypass_samples is non-empty or bypass_gate is true. Free-form justification, surfaced in run summary, PR body, and bypass-log issue comment.'
        required: false
        type: string
        default: ''
      bypass_gate:
        description: 'Full bypass of the validation gate (use only when the gate itself is broken). Requires bypass_reason.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  statuses: read

concurrency:
  group: sync-to-public
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout private repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Full history needed for fast-export
          path: private-repo

      - name: Read sync config
        id: config
        run: |
          CONFIG_FILE="private-repo/.github/sync-config.json"
          echo "owner=$(jq -r '.public_repo.owner' "$CONFIG_FILE")" >> "$GITHUB_OUTPUT"
          echo "repo=$(jq -r '.public_repo.name' "$CONFIG_FILE")" >> "$GITHUB_OUTPUT"
          echo "branch_prefix=$(jq -r '.sync_branch_prefix' "$CONFIG_FILE")" >> "$GITHUB_OUTPUT"

      - name: Validate additional paths
        id: scope
        env:
          ADDITIONAL_PATHS: ${{ inputs.additional_paths }}
        run: |
          set -euo pipefail
          normalized="$(bash private-repo/.github/scripts/assert-sync-scope.sh \
            --normalize-only "$ADDITIONAL_PATHS")"
          echo "additional_paths=$normalized" >> "$GITHUB_OUTPUT"

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          owner: ${{ steps.config.outputs.owner }}
          repositories: ${{ steps.config.outputs.repo }}

      - name: Checkout public repo
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.config.outputs.owner }}/${{ steps.config.outputs.repo }}
          token: ${{ steps.app-token.outputs.token }}
          path: public-repo
          fetch-depth: 0

      - name: Compute marks cache key
        id: cache-key
        working-directory: private-repo
        run: |
          ROOT_SHA=$(git rev-list --max-parents=0 HEAD | head -1)
          PRIVATE_SHA=$(git rev-parse HEAD)
          echo "root_sha=$ROOT_SHA" >> "$GITHUB_OUTPUT"
          echo "private_sha=$PRIVATE_SHA" >> "$GITHUB_OUTPUT"
          echo "key=sync-marks-${ROOT_SHA}-${PRIVATE_SHA}" >> "$GITHUB_OUTPUT"
          echo "restore_prefix=sync-marks-${ROOT_SHA}-" >> "$GITHUB_OUTPUT"

      - name: Restore marks cache
        id: marks-cache
        uses: actions/cache/restore@v4
        with:
          path: marks-dir
          key: ${{ steps.cache-key.outputs.key }}
          restore-keys: ${{ steps.cache-key.outputs.restore_prefix }}

      - name: Prepare marks directory
        run: mkdir -p marks-dir

      - name: Compute branch name
        id: branch
        run: |
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            BRANCH="sync/dry-run-$(date -u +%Y%m%d-%H%M%S)"
          else
            BRANCH="${{ steps.config.outputs.branch_prefix }}-$(date -u +%Y%m%d-%H%M%S)"
          fi
          echo "name=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Validate bypass inputs
        id: bypass-validate
        env:
          BYPASS_SAMPLES: ${{ inputs.bypass_samples }}
          BYPASS_REASON: ${{ inputs.bypass_reason }}
          BYPASS_GATE: ${{ inputs.bypass_gate }}
        run: |
          set -euo pipefail
          requires_reason=0
          if [[ -n "$BYPASS_SAMPLES" ]]; then requires_reason=1; fi
          if [[ "$BYPASS_GATE" == "true" ]]; then requires_reason=1; fi
          if [[ "$requires_reason" == "1" && -z "$BYPASS_REASON" ]]; then
            echo "::error::bypass_reason is required when bypass_samples is non-empty or bypass_gate is true"
            exit 1
          fi
          if [[ "$BYPASS_GATE" == "true" ]]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
          elif [[ -n "$BYPASS_SAMPLES" ]]; then
            echo "mode=samples" >> "$GITHUB_OUTPUT"
          else
            echo "mode=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute validation block-list
        id: blocklist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BYPASS_SAMPLES: ${{ inputs.bypass_samples }}
          BYPASS_MODE: ${{ steps.bypass-validate.outputs.mode }}
        working-directory: private-repo
        run: |
          set -euo pipefail
          PRIVATE_SHA="$(git rev-parse HEAD)"
          echo "private_sha=$PRIVATE_SHA" >> "$GITHUB_OUTPUT"

          if [[ "$BYPASS_MODE" == "full" ]]; then
            echo "Validation gate fully bypassed by workflow input." >&2
            echo "blocklist=" >> "$GITHUB_OUTPUT"
            echo "tracked_count=0" >> "$GITHUB_OUTPUT"
            echo "blocked_count=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Capture stderr for the run summary and to expose tracked counts.
          stderr_log="$(mktemp)"
          if ! computed="$(bash .github/scripts/compute-blocklist.sh \
              "${{ github.repository }}" "$PRIVATE_SHA" \
              2> "$stderr_log")"; then
            echo "::error::compute-blocklist.sh failed; aborting sync (fail-closed per §8 Q5)"
            cat "$stderr_log" >&2
            exit 1
          fi
          cat "$stderr_log" >&2

          tracked_count="$(grep -oE '[0-9]+ validation status' "$stderr_log" \
            | head -n1 | grep -oE '^[0-9]+' || echo 0)"
          blocked_count="$(grep -oE 'blocked sample\(s\): [0-9]+' "$stderr_log" \
            | head -n1 | grep -oE '[0-9]+$' || echo 0)"

          # Apply per-sample bypass: subtract bypass paths from blocked output.
          # Bypass entries that aren't actually blocked are tolerated (still
          # logged for transparency).
          if [[ "$BYPASS_MODE" == "samples" ]]; then
            declare -A skip_set=()
            IFS=':' read -r -a _bypass <<< "$BYPASS_SAMPLES"
            for b in "${_bypass[@]}"; do
              [[ -z "$b" ]] && continue
              skip_set["$b"]=1
            done
            filtered=""
            IFS=':' read -r -a _blocked <<< "$computed"
            for p in "${_blocked[@]}"; do
              [[ -z "$p" ]] && continue
              [[ -n "${skip_set[$p]:-}" ]] && continue
              if [[ -z "$filtered" ]]; then filtered="$p"; else filtered="$filtered:$p"; fi
            done
            computed="$filtered"
          fi

          {
            echo "blocklist<<EOF"
            echo "$computed"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "tracked_count=$tracked_count" >> "$GITHUB_OUTPUT"
          echo "blocked_count=$blocked_count" >> "$GITHUB_OUTPUT"
          {
            echo "stderr_log<<EOF"
            cat "$stderr_log"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Seed marks from public
        if: ${{ inputs.seed_from_public_sha != '' }}
        env:
          PRIVATE_REPO: ${{ github.workspace }}/private-repo
          PUBLIC_REPO: ${{ github.workspace }}/public-repo
          CONFIG_FILE: ${{ github.workspace }}/private-repo/.github/sync-config.json
          SYNC_ADDITIONAL_PATHS: ${{ steps.scope.outputs.additional_paths }}
          # When recovering from a public SHA produced under a historical
          # block-list that differs from the current one, the operator must
          # supply seed_blocked_paths to make the tree-equivalence check pass.
          # Falls back to the current run's computed block-list otherwise.
          SYNC_BLOCKED_PATHS: ${{ inputs.seed_blocked_paths != '' && inputs.seed_blocked_paths || steps.blocklist.outputs.blocklist }}
        run: |
          if [ -n "${{ inputs.seed_from_private_sha }}" ]; then
            private_sha="${{ inputs.seed_from_private_sha }}"
          else
            private_sha="$(git -C private-repo rev-parse HEAD)"
          fi
          args=(
            --private-sha "$private_sha"
            --public-sha "${{ inputs.seed_from_public_sha }}"
            --marks-dir "${{ github.workspace }}/marks-dir"
          )
          bash private-repo/.github/scripts/seed-marks-from-public.sh "${args[@]}"

      - name: Compute unmapped-email block-list
        id: unmapped-blocklist
        env:
          MAILMAP_FILE: ${{ github.workspace }}/private-repo/.github/sync-mailmap
          PRIVATE_REPO: ${{ github.workspace }}/private-repo
          MARKS_DIR: ${{ github.workspace }}/marks-dir
        run: |
          chmod +x private-repo/.github/scripts/compute-unmapped-blocklist.sh

          # Use last-synced sentinel as the incremental range anchor (if available).
          SINCE_SHA=""
          if [[ -f "$MARKS_DIR/last-synced-private.sha" ]]; then
            SINCE_SHA="$(head -n 1 "$MARKS_DIR/last-synced-private.sha" | tr -d '[:space:]')"
          fi

          ARGS=(--mailmap "$MAILMAP_FILE" --repo "$PRIVATE_REPO")
          if [[ -n "$SINCE_SHA" ]]; then
            ARGS+=(--since-sha "$SINCE_SHA")
          fi

          UNMAPPED_BLOCKED="$(bash private-repo/.github/scripts/compute-unmapped-blocklist.sh "${ARGS[@]}")"

          {
            echo "blocklist<<EOF"
            echo "$UNMAPPED_BLOCKED"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Run sync pipeline
        id: sync
        env:
          PRIVATE_REPO: ${{ github.workspace }}/private-repo
          PUBLIC_REPO: ${{ github.workspace }}/public-repo
          MARKS_DIR: ${{ github.workspace }}/marks-dir
          MAILMAP_FILE: ${{ github.workspace }}/private-repo/.github/sync-mailmap
          CONFIG_FILE: ${{ github.workspace }}/private-repo/.github/sync-config.json
          SYNC_BRANCH: ${{ steps.branch.outputs.name }}
          SOURCE_REF: HEAD
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
          SYNC_BLOCKED_PATHS: ${{ steps.blocklist.outputs.blocklist }}
          SYNC_BLOCKED_UNMAPPED: ${{ steps.unmapped-blocklist.outputs.blocklist }}
          SYNC_ADDITIONAL_PATHS: ${{ steps.scope.outputs.additional_paths }}
        run: |
          # Merge validation blocklist and unmapped-email blocklist.
          if [[ -n "${SYNC_BLOCKED_UNMAPPED:-}" ]]; then
            if [[ -n "${SYNC_BLOCKED_PATHS:-}" ]]; then
              export SYNC_BLOCKED_PATHS="${SYNC_BLOCKED_PATHS}:${SYNC_BLOCKED_UNMAPPED}"
            else
              export SYNC_BLOCKED_PATHS="${SYNC_BLOCKED_UNMAPPED}"
            fi
          fi

          bash private-repo/.github/scripts/sync-core.sh

      - name: Push sync branch
        if: ${{ steps.sync.outputs.has_changes == 'true' }}
        working-directory: public-repo
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git push origin "${{ steps.branch.outputs.name }}"

      - name: Close stale sync PRs
        if: ${{ inputs.dry_run != true && steps.sync.outputs.has_changes == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          REPO="${{ steps.config.outputs.owner }}/${{ steps.config.outputs.repo }}"
          PREFIX="${{ steps.config.outputs.branch_prefix }}"

          # Close any open sync PRs from previous runs. With direct-merge, a
          # successful sync run merges its PR before exiting; an open sync PR
          # here means a previous run timed out or failed. Close and supersede.
          STALE=$(gh pr list --repo "$REPO" --state open \
            --json number,headRefName \
            --jq ".[] | select(.headRefName | startswith(\"${PREFIX}\")) | .number")

          for pr in $STALE; do
            echo "Closing stale sync PR #${pr}"
            gh pr close "$pr" --repo "$REPO" --delete-branch --comment "Superseded by a newer sync."
          done

      - name: Create PR and merge directly as sync app
        if: ${{ inputs.dry_run != true && steps.sync.outputs.has_changes == 'true' }}
        working-directory: public-repo
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # Tunables for wait-and-merge.sh; defaults are 600s timeout / 15s poll.
          MERGE_POLL_TIMEOUT: '600'
          MERGE_POLL_INTERVAL: '15'
          SYNC_SCOPE_ASSERT_SCRIPT: ${{ github.workspace }}/private-repo/.github/scripts/assert-sync-scope.sh
          SYNC_SCOPE_PUBLIC_REPO: ${{ github.workspace }}/public-repo
          SYNC_SCOPE_CONFIG: ${{ github.workspace }}/private-repo/.github/sync-config.json
          SYNC_ADDITIONAL_PATHS: ${{ steps.scope.outputs.additional_paths }}
          SYNC_BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          BRANCH="${{ steps.branch.outputs.name }}"
          REPO="${{ steps.config.outputs.owner }}/${{ steps.config.outputs.repo }}"
          ROLLBACK_SHA="${{ steps.sync.outputs.public_head_before }}"

          PR_BODY="Automated sync from private repo.

          **Synced commits:** ${{ steps.sync.outputs.commit_count }}
          **Authors:** ${{ steps.sync.outputs.authors }}

          **Validation gate:** mode=\`${{ steps.bypass-validate.outputs.mode }}\`; tracked=${{ steps.blocklist.outputs.tracked_count }}; blocked=${{ steps.blocklist.outputs.blocked_count }}.

          **Sync scope:** \`infrastructure/\`, \`samples/\`${{ steps.scope.outputs.additional_paths != '' && format(', plus `{0}`', steps.scope.outputs.additional_paths) || '' }}.

          **Pre-sync public SHA:** \`${ROLLBACK_SHA}\`. Recover through a reviewed private fix plus dry-run and normal incremental sync; do not push directly to public \`main\`.

          Triggered by: \`${{ github.event_name }}\`
          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [[ "${{ steps.bypass-validate.outputs.mode }}" != "none" ]]; then
            PR_BODY="${PR_BODY}

          ---
          ⚠️ **Validation gate bypassed** — mode \`${{ steps.bypass-validate.outputs.mode }}\`.
          Reason: ${{ inputs.bypass_reason }}
          Bypass samples: \`${{ inputs.bypass_samples }}\`"
          fi

          PR_URL=$(gh pr create \
            --repo "$REPO" \
            --base main \
            --head "$BRANCH" \
            --title "Automated sync from private repo ($(date +%Y-%m-%d))" \
            --body "$PR_BODY")

          echo "Created: $PR_URL"

          # Poll and merge within this run so marks are saved only after the
          # public main update succeeds. The App remains subject to the public
          # main ruleset; this is not an admin or bypass merge.
          bash "$GITHUB_WORKSPACE/private-repo/.github/scripts/wait-and-merge.sh" \
            "$PR_URL" "$REPO"

      - name: Save marks cache
        # Keep this after the in-run public merge. GitHub implicitly ANDs this
        # condition with success(), so failed sync or merge steps never persist
        # marks. Seed-only recovery runs may save even when no content changed.
        if: ${{ inputs.dry_run != true && (steps.sync.outputs.has_changes == 'true' || inputs.seed_from_public_sha != '') }}
        uses: actions/cache/save@v4
        with:
          path: marks-dir
          key: ${{ steps.cache-key.outputs.key }}

      - name: Validation gate run summary
        if: always()
        env:
          BYPASS_MODE: ${{ steps.bypass-validate.outputs.mode }}
          BYPASS_REASON: ${{ inputs.bypass_reason }}
          BYPASS_SAMPLES: ${{ inputs.bypass_samples }}
          TRACKED: ${{ steps.blocklist.outputs.tracked_count }}
          BLOCKED: ${{ steps.blocklist.outputs.blocked_count }}
          BLOCKLIST: ${{ steps.blocklist.outputs.blocklist }}
          UNMAPPED_BLOCKLIST: ${{ steps.unmapped-blocklist.outputs.blocklist }}
          STDERR_LOG: ${{ steps.blocklist.outputs.stderr_log }}
          PRIVATE_SHA: ${{ steps.blocklist.outputs.private_sha }}
        run: |
          {
            echo "## 🚦 Validation gate"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Private SHA | \`${PRIVATE_SHA:-unknown}\` |"
            echo "| Bypass mode | \`${BYPASS_MODE:-unknown}\` |"
            echo "| Tracked samples (any reporter) | ${TRACKED:-0} |"
            echo "| Blocked samples (final, post-bypass) | ${BLOCKED:-0} |"
            echo "| Additional paths | \`${{ steps.scope.outputs.additional_paths || '<none>' }}\` |"
            echo ""
            if [[ -n "${BLOCKLIST:-}" ]]; then
              echo "**Blocked paths (validation):**"
              echo ""
              echo '```'
              echo "${BLOCKLIST}" | tr ':' '\n'
              echo '```'
              echo ""
            fi
            if [[ -n "${UNMAPPED_BLOCKLIST:-}" ]]; then
              echo "## 📧 Unmapped email exclusions"
              echo ""
              echo "The following paths are excluded because commits from unmapped"
              echo "internal emails touch them. Add mailmap entries to unblock."
              echo ""
              echo '```'
              echo "${UNMAPPED_BLOCKLIST}" | tr ':' '\n'
              echo '```'
              echo ""
            fi
            if [[ "${BYPASS_MODE:-none}" != "none" ]]; then
              echo "### ⚠️ Bypass active"
              echo ""
              echo "- **Mode:** \`${BYPASS_MODE}\`"
              echo "- **Reason:** ${BYPASS_REASON}"
              if [[ -n "${BYPASS_SAMPLES:-}" ]]; then
                echo "- **Samples bypassed:** \`${BYPASS_SAMPLES}\`"
              fi
              echo ""
            fi
            if [[ -n "${STDERR_LOG:-}" ]]; then
              echo "<details><summary>compute-blocklist.sh stderr</summary>"
              echo ""
              echo '```'
              echo "${STDERR_LOG}"
              echo '```'
              echo ""
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment bypass on tracking issue
        if: ${{ steps.bypass-validate.outputs.mode != 'none' && inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BYPASS_LOG_ISSUE_NUMBER: ${{ vars.BYPASS_LOG_ISSUE_NUMBER }}
          BYPASS_MODE: ${{ steps.bypass-validate.outputs.mode }}
          BYPASS_REASON: ${{ inputs.bypass_reason }}
          BYPASS_SAMPLES: ${{ inputs.bypass_samples }}
          PRIVATE_SHA: ${{ steps.blocklist.outputs.private_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ACTOR: ${{ github.actor }}
        run: |
          if [[ -z "${BYPASS_LOG_ISSUE_NUMBER:-}" ]]; then
            echo "::warning::vars.BYPASS_LOG_ISSUE_NUMBER not set; skipping bypass auto-comment. Create a 'Validation gate bypass log' issue and set the repo variable to enable durable bypass tracking."
            exit 0
          fi
          BODY="$(cat <<EOF
          ⚠️ **Validation gate bypass** — sync-to-public run

          - Mode: \`${BYPASS_MODE}\`
          - Reason: ${BYPASS_REASON}
          - Samples: \`${BYPASS_SAMPLES:-<n/a>}\`
          - Private SHA: \`${PRIVATE_SHA}\`
          - Triggered by: @${ACTOR}
          - Run: ${RUN_URL}
          EOF
          )"
          gh issue comment "$BYPASS_LOG_ISSUE_NUMBER" \
            --repo "${{ github.repository }}" \
            --body "$BODY"

      - name: Dry run summary
        if: ${{ inputs.dry_run == true }}
        run: |
          echo "## Dry Run Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Sync branch: \`${{ steps.branch.outputs.name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Commits synced: ${{ steps.sync.outputs.commit_count }}" >> $GITHUB_STEP_SUMMARY
          echo "- Authors: ${{ steps.sync.outputs.authors }}" >> $GITHUB_STEP_SUMMARY
          echo "- Has changes: ${{ steps.sync.outputs.has_changes }}" >> $GITHUB_STEP_SUMMARY
          echo "- Additional paths: \`${{ steps.scope.outputs.additional_paths || '<none>' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "No PR created and marks cache NOT updated. Branch was pushed for inspection." >> $GITHUB_STEP_SUMMARY
