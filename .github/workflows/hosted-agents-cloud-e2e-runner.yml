# Reusable runner for Hosted Agents Cloud E2E.
#
# This holds the per-sample E2E job body. It is invoked once per language
# shard by the top-level `hosted-agents-cloud-e2e.yml` workflow. Sharding by
# language keeps each invocation's matrix under GitHub Actions' hard limit of
# 256 jobs per job matrix (see docs at Actions limits). The caller passes the
# already-computed per-language matrix JSON via the `matrix` input.
name: Hosted Agents Cloud E2E (runner)

on:
  workflow_call:
    inputs:
      matrix:
        description: 'Sample matrix JSON, e.g. {"include":[...]}'
        required: true
        type: string
      shard:
        description: 'Shard label for logging (e.g. python, csharp)'
        required: false
        type: string
        default: ""
      publish_validation_statuses:
        description: >-
          Whether to publish authoritative validation commit statuses that the
          sync gate consumes. Callers set this false for filtered manual runs
          (sample_filter non-empty), since a single-combo pass could otherwise
          overwrite a previous full-run sample-level failure on the same SHA.
        required: false
        type: boolean
        default: true

permissions:
  id-token: write # OIDC token for az login
  contents: read
  statuses: write # Publish per-sample validation commit statuses (D5; see docs/validation-results-contract.md)

env:
  AZURE_LOCATION: northcentralus

jobs:
  cloud-e2e:
    name: ${{ matrix.deploy_mode == 'code' && format('🐍 code [{0}] · {1}', matrix.dep_resolution, matrix.combo_id) || format('📦 container · {0}', matrix.combo_id) }}
    runs-on: ubuntu-latest
    if: inputs.matrix != '{"include":[]}'
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(inputs.matrix) }}

    env:
      # Unique azd environment name per run/sample to avoid collisions
      AZD_ENV_NAME: ci-e2e-${{ github.run_number }}-${{ matrix.combo_id }}
      # Agent name strategy:
      #   - hosted-agents samples: stable per sample so agent identities are reused across runs.
      #   - toolbox samples: STABLE per (sample, toolbox) — no run_number — so the
      #     ~24 AgentIdentity SPs are reused across runs (no RoleAssignmentLimitExceeded).
      # Invocation below pins the exact version deployed by this cell so parallel
      # workflows can safely publish newer versions to the same stable identity.
      # Suffix with deploy_mode so the container and code arms target
      # DIFFERENT agent objects in Foundry. Without this, both arms push
      # versions onto the same agent name and the "latest" version (which
      # the invoke step routes to) flips depending on which arm publishes
      # last — making one arm appear to load the other arm's image/code.
      AGENT_NAME: ${{ matrix.is_toolbox == 'true' && format('ci-toolbox-{0}-{1}-{2}', matrix.toolbox_label, matrix.name, matrix.deploy_mode) || format('ci-{0}-{1}', matrix.name, matrix.deploy_mode) }}
      # use_westus2 cells deploy into a different Azure subscription —
      # the westus2 toolbox project (sub 921496dc) lives separately from
      # the default ncus CI sub (47f1c914). If we don't flip
      # AZURE_SUBSCRIPTION_ID, azd's ACR lookup fails (registry not found
      # in the wrong sub), falls back to local Docker build, and Foundry's
      # package service then returns "failed retrieving package result
      # details" at publish.
      AZURE_SUBSCRIPTION_ID: ${{ matrix.use_westus2 == 'true' && vars.TOOLBOX_SUBSCRIPTION_ID_WESTUS2 || vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      PLAYWRIGHT_SERVICE_ACCESS_TOKEN: ${{ vars.PLAYWRIGHT_SERVICE_ACCESS_TOKEN }}
      # Per-cell toolbox lifecycle state. Toolboxes declared in azure.yaml are
      # renamed into the reserved ci-e2e-tb-* namespace before deployment and
      # deleted after all invoke/monitor checks finish.
      CI_TOOLBOX_STATE_FILE: /tmp/ci-toolboxes-${{ matrix.combo_id }}.json
      CI_TOOLBOX_DEPLOY_RESULT: /tmp/ci-toolbox-deploy-${{ matrix.combo_id }}.json
      CI_TOOLBOX_CLEANUP_RESULT: /tmp/ci-toolbox-cleanup-${{ matrix.combo_id }}.json
      # One caller-owned session per cell, unique across shards, runs, and reruns.
      CI_AGENT_SESSION_ID: ci-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.shard }}-${{ strategy.job-index }}
      HOSTED_AGENT_QUOTA_MAX_RETRIES: 5

    steps:
      - uses: actions/checkout@v4

      # ── Validate sample structure ────────────────────────────────────
      - name: Validate sample structure
        run: |
          sample_dir="${{ matrix.path }}"
          errors=()
          if [ ! -f "$sample_dir/azure.yaml" ]; then
            errors+=("missing azure.yaml")
          else
            proj=$(yq '(.services[] | select(.host == "azure.ai.agent") | .project) // ""' "$sample_dir/azure.yaml")
            if [ -z "$proj" ]; then
              errors+=("azure.yaml has no 'project: src/<agent>' entry")
            elif [ ! -d "$sample_dir/$proj" ]; then
              errors+=("missing source directory '$proj'")
            fi
          fi
          if [ ${#errors[@]} -gt 0 ]; then
            for err in "${errors[@]}"; do
              echo "::error::$sample_dir: $err"
            done
            exit 1
          fi
          echo "✅ $sample_dir has azure.yaml with a matching src/<agent> directory"

      # ── Truncate env names to 63-char Azure limit ─────────────────
      - name: Truncate environment names
        run: |
          truncate() { echo "${1:0:63}" | sed 's/[-_.]*$//'; }
          AZD_TRUNCATED=$(truncate "$AZD_ENV_NAME")
          echo "AZD_ENV_NAME=$AZD_TRUNCATED" >> "$GITHUB_ENV"
          echo "AZD_ENV_NAME: $AZD_TRUNCATED (${#AZD_TRUNCATED} chars)"
          # Keep agent names stable but unique. Some samples share the same
          # manifest name, so append a stable hash of matrix.combo_id and
          # preserve that suffix when enforcing the 63-character limit.
          AGENT_HASH=$(printf '%s' "${{ matrix.combo_id }}" | sha256sum | cut -c1-8)
          AGENT_PREFIX_MAX=$((63 - ${#AGENT_HASH} - 1))
          AGENT_PREFIX=$(printf '%s' "$AGENT_NAME" | cut -c1-"$AGENT_PREFIX_MAX" | sed 's/[-_.]*$//')
          AGENT_TRUNCATED="${AGENT_PREFIX}-${AGENT_HASH}"
          echo "AGENT_NAME=$AGENT_TRUNCATED" >> "$GITHUB_ENV"
          echo "AGENT_NAME: $AGENT_TRUNCATED (${#AGENT_TRUNCATED} chars)"

      # ── Validate required secrets/variables ─────────────────────────
      - name: Validate required secrets and variables
        run: |
          missing=()
          for var in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            eval "val=\$$var"
            if [ -z "$val" ]; then
              missing+=("$var")
            fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing required secrets/variables: ${missing[*]}"
            echo "Configure these in Settings → Secrets and variables → Actions"
            exit 1
          fi
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # ── Tool setup ───────────────────────────────────────────────────
      - name: Install Azure Developer CLI (azd)
        uses: Azure/setup-azd@v2

      - name: Install azd Foundry extension
        # Install the latest unified Foundry CLI extension. The Verify step
        # below fails fast if the installed build doesn't expose the
        # `--deploy-mode`/`--runtime`/`--entry-point` flags the DCD code arm
        # depends on.
        # The unified azure.yaml declares `requiredVersions.extensions:
        # microsoft.foundry`, matching the sample READMEs (`azd ext install
        # microsoft.foundry`). Install that extension so `azd ai agent init -m
        # azure.yaml` adopts the project manifest.
        run: azd ext install microsoft.foundry
        # Sanity-check: fail fast if the installed build doesn't expose
        # the flags the workflow assumes are present.
      - name: Verify azd ext supports --deploy-mode
        run: |
          set -euo pipefail

          echo "::group::Installed azd toolchain"
          # These commands are diagnostic only and must not create a new gate.
          set +e
          echo "azd path: $(command -v azd)"
          sha256sum "$(command -v azd)"
          azd version
          azd ext list
          azd ext show microsoft.foundry
          azd ext show azure.ai.agents
          azd ext show azure.ai.toolboxes
          for extension_id in azure.ai.agents azure.ai.toolboxes; do
            extension_dir="$HOME/.azd/extensions/$extension_id"
            if [ -d "$extension_dir" ]; then
              echo "Installed files for $extension_id:"
              find "$extension_dir" -maxdepth 1 -type f -printf '  %f (%s bytes)\n' | sort
              find "$extension_dir" -maxdepth 1 -type f -perm /111 -exec sha256sum {} +
            else
              echo "::warning::Expected extension directory is missing: $extension_dir"
            fi
          done
          set -e
          echo "::endgroup::"

          PREFLIGHT_DIR=$(mktemp -d "/tmp/azd-preflight-XXXXXX")
          trap 'rm -rf "$PREFLIGHT_DIR"' EXIT

          # This step intentionally runs before Azure login. Keep it pre-auth so
          # unrestricted --debug output cannot expose live Azure credentials.
          # A debug invocation is evidence only: it is bounded, never replaces
          # the first result, and cannot turn a failed preflight into a pass.
          debug_failed_preflight() {
            local label="$1"
            shift
            local executable="$1"
            shift
            local debug_output debug_status
            debug_output=$(mktemp "$PREFLIGHT_DIR/debug-XXXXXX.log")

            echo "::group::Secondary debug invocation: $label"
            printf 'Command: AZD_EXT_DEBUG=true timeout 30s %q --debug' "$executable"
            printf ' %q' "$@"
            printf '\n'
            set +e
            AZD_EXT_DEBUG=true timeout 30s "$executable" --debug "$@" >"$debug_output" 2>&1
            debug_status=$?
            set -e
            echo "Exit code: $debug_status"
            echo "--- combined stdout/stderr ---"
            cat "$debug_output"
            echo "--- end combined stdout/stderr ---"
            echo "::endgroup::"
          }

          # Capture each command outside command substitution so `set -e` cannot
          # discard its output before the failure is diagnosed. The output path
          # is explicit, avoiding hidden global state between helper calls.
          run_preflight() {
            local label="$1"
            local output_file="$2"
            shift 2
            local started_at finished_at status
            started_at=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)

            echo "::group::Preflight: $label"
            printf 'Command:'
            printf ' %q' "$@"
            printf '\nStarted: %s\n' "$started_at"

            set +e
            "$@" >"$output_file" 2>&1
            status=$?
            set -e

            finished_at=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)
            echo "Finished: $finished_at"
            echo "Exit code: $status"
            echo "Captured bytes: $(wc -c < "$output_file")"
            if [ "$status" -ne 0 ]; then
              echo "--- combined stdout/stderr ---"
              cat "$output_file"
              echo "--- end combined stdout/stderr ---"
            fi
            echo "::endgroup::"

            if [ "$status" -ne 0 ]; then
              echo "::error::$label failed with exit code $status"
              debug_failed_preflight "$label" "$@"
              exit "$status"
            fi
          }

          agent_help="$PREFLIGHT_DIR/agent-init-help.log"
          run_preflight "azd ai agent init --help" "$agent_help" azd ai agent init --help
          for flag in -- "--deploy-mode" "--runtime" "--entry-point"; do
            if ! grep -q -- "$flag" "$agent_help"; then
              echo "::error::azd ai agent init does not expose '$flag' — extension is too old"
              echo "--- combined stdout/stderr ---"
              cat "$agent_help"
              echo "--- end combined stdout/stderr ---"
              exit 1
            fi
          done
          echo "✅ azd ai agent init exposes --deploy-mode / --runtime / --entry-point"

          toolbox_delete_help="$PREFLIGHT_DIR/toolbox-delete-help.log"
          run_preflight "azd ai toolbox delete --help" "$toolbox_delete_help" azd ai toolbox delete --help
          for flag in "--project-endpoint" "--force"; do
            if ! grep -q -- "$flag" "$toolbox_delete_help"; then
              echo "::error::azd ai toolbox delete does not expose '$flag' — extension is too old"
              echo "--- combined stdout/stderr ---"
              cat "$toolbox_delete_help"
              echo "--- end combined stdout/stderr ---"
              exit 1
            fi
          done

          run_preflight "azd ai toolbox list --help" \
            "$PREFLIGHT_DIR/toolbox-list-help.log" azd ai toolbox list --help
          run_preflight "azd ai toolbox versions list --help" \
            "$PREFLIGHT_DIR/toolbox-versions-list-help.log" azd ai toolbox versions list --help
          echo "✅ azd ai toolbox supports list/version verification and project-scoped cleanup"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ matrix.use_westus2 == 'true' && vars.TOOLBOX_SUBSCRIPTION_ID_WESTUS2 || vars.AZURE_SUBSCRIPTION_ID }}

      - name: Configure azd to use az CLI auth
        run: |
          azd config set auth.useAzCliAuth true
          azd config set defaults.subscription "${{ vars.AZURE_SUBSCRIPTION_ID }}"

      - name: Verify Azure auth
        run: |
          echo "Client ID:       ${{ vars.AZURE_CLIENT_ID }}"
          echo "Tenant ID:       ${{ vars.AZURE_TENANT_ID }}"
          echo "Subscription ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}"
          echo "--- az account show ---"
          az account show --query "{subscriptionId:id, tenantId:tenantId, state:state}" -o table
          echo "--- ARM test: list locations ---"
          az rest --method GET --url "https://management.azure.com/subscriptions/${{ vars.AZURE_SUBSCRIPTION_ID }}/locations?api-version=2022-01-01" --query "value[0].name" -o tsv

      # ── Scaffold agent ──────────────────────────────────────────
      - name: Scaffold ${{ matrix.name }} agent project
        env:
          # Provide the GitHub PAT for `azd ai agent init --no-prompt`. Toolbox
          # samples template it into an azure.ai.connection credential via a
          # {{ gh_pat }} placeholder; azd resolves it from an env var named
          # after the placeholder, UPPERCASED (gh_pat -> GH_PAT). GH_PAT (not
          # GITHUB_PAT) because GitHub forbids user-defined secret names that
          # start with GITHUB_. (Do not also add a lowercase `gh_pat` here —
          # GitHub rejects env keys that differ only by case.)
          # Use a stored GH_PAT secret if available; fall back to GITHUB_TOKEN.
          GH_PAT: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          github_pat: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          # Provide the Browser Automation secret for `azd ai agent init --no-prompt`
          # (templated into the azure.ai.connection credential via a
          # {{PLAYWRIGHT_SERVICE_ACCESS_TOKEN}} placeholder).
          PLAYWRIGHT_SERVICE_ACCESS_TOKEN: ${{ vars.PLAYWRIGHT_SERVICE_ACCESS_TOKEN }}
          # Real RAI policy ARM ID for the content-safety guardrail sample. The
          # committed sample carries a documented PLACEHOLDER ARM ID (no real
          # resource details); CI swaps that exact placeholder for this value so
          # the live deploy passes RAI validation. Unused by every other sample.
          RAI_POLICY_ID: ${{ vars.AZURE_AI_RAI_POLICY_ID }}
          # Code-deploy arm: tell azd's provision flow to skip creating an ACR
          # since the code path doesn't build/push a container image. No-op
          # in the container arm.
          SKIP_ACR_CREATION: ${{ matrix.deploy_mode == 'code' && 'true' || 'false' }}
        run: |
          WORK_DIR="/tmp/ci-${{ matrix.combo_id }}"
          mkdir -p "$WORK_DIR" && cd "$WORK_DIR"
          # Toolbox samples target a dedicated Foundry project (TOOLBOX_PROJECT_ID).
          # Samples flagged use_westus2 (currently only the agent-framework
          # foundry-toolbox-server-side variants) deploy to the westus2 project
          # where the MCP tool-name namespace fix is live.
          if [ "${{ matrix.use_westus2 }}" = "true" ]; then
            PROJECT_ID="${{ vars.TOOLBOX_PROJECT_ID_WESTUS2 }}"
          elif [ "${{ matrix.is_toolbox }}" = "true" ]; then
            PROJECT_ID="${{ vars.TOOLBOX_PROJECT_ID }}"
          else
            PROJECT_ID="${{ vars.AZURE_AI_PROJECT_ID }}"
          fi
          # Force a fresh agent definition hash on every CI attempt by
          # rewriting the agent's description to a unique CI string. This
          # prevents Foundry from short-circuiting to a cached version on
          # job re-runs (where run_number stays the same but run_attempt
          # increments) and provides an audit trail — every deployed agent
          # self-identifies its CI provenance in the Foundry portal.
          # NOTE: The description lives on the azure.ai.agent service inside
          # azure.yaml (indented under the service key). We target the service
          # whose `host:` is azure.ai.agent and set (or insert) its
          # `description:` specifically — other services (e.g. azure.ai.toolbox)
          # may carry their own `description:`, so we must not edit the wrong
          # mapping. yq parses the YAML structurally and preserves comments.
          MANIFEST_SRC="${{ github.workspace }}/${{ matrix.path }}/azure.yaml"
          CI_DESC="CI run #${{ github.run_number }} attempt ${{ github.run_attempt }} ${{ matrix.combo_id }} ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          if [ "$(yq '[.services[] | select(.host == "azure.ai.agent")] | length' "$MANIFEST_SRC")" = "0" ]; then
            echo "No azure.ai.agent service found; leaving azure.yaml unchanged."
          else
            CI_DESC="$CI_DESC" yq -i '(.services[] | select(.host == "azure.ai.agent") | .description) = strenv(CI_DESC)' "$MANIFEST_SRC"
            echo "Set agent description -> $CI_DESC"
          fi
          # Inject the real RAI policy ARM ID into azure.yaml before init.
          # `azd ai agent init` adopts azure.yaml as the project manifest, so
          # the injected policy flows straight through to the deploy. Targets
          # only the agent service's rai_policy entry that still carries a
          # documented placeholder, so it is a no-op for every sample that lacks
          # it. Two placeholder forms are recognized: the canonical ARM-ID
          # placeholder (content-safety sample) and the ${RAI_POLICY_ID} azd
          # variable used by layered samples whose egress policy is normally
          # provisioned by a Bicep layer — since CI runs with SKIP_PROVISION,
          # that layer output never materializes, so we inject the real policy
          # here instead. Fails fast if a placeholder is present but
          # RAI_POLICY_ID is unset/invalid, rather than letting the deploy fail.
          RAI_PLACEHOLDER="/subscriptions/<subscription-id>/resourceGroups/<resource-group>/providers/Microsoft.CognitiveServices/accounts/<account>/raiPolicies/<policy-name>"
          RAI_PLACEHOLDER_VAR='${RAI_POLICY_ID}'
          if [ "$(RAI_PLACEHOLDER="$RAI_PLACEHOLDER" RAI_PLACEHOLDER_VAR="$RAI_PLACEHOLDER_VAR" yq '[.services[] | select(.host == "azure.ai.agent") | .policies[]? | select(.type == "rai_policy") | select(.raiPolicyName == strenv(RAI_PLACEHOLDER) or .raiPolicyName == strenv(RAI_PLACEHOLDER_VAR))] | length' "$MANIFEST_SRC")" = "0" ]; then
            echo "No RAI policy placeholder in azure.yaml; skipping policy injection."
          else
            RAI_POLICY_ID="${RAI_POLICY_ID:-}"
            if [ -z "$RAI_POLICY_ID" ]; then
              echo "::error::azure.yaml has an RAI policy placeholder but the AZURE_AI_RAI_POLICY_ID repo variable is not set."
              exit 1
            fi
            if ! printf '%s' "$RAI_POLICY_ID" | grep -qiE '^/subscriptions/[^/]+/resourceGroups/[^/]+/providers/Microsoft\.CognitiveServices/accounts/[^/]+/raiPolicies/[^/]+$'; then
              echo "::error::AZURE_AI_RAI_POLICY_ID must be the full ARM ID of a Microsoft.CognitiveServices raiPolicies resource."
              exit 1
            fi
            RAI_POLICY_ID="$RAI_POLICY_ID" yq -i '(.services[] | select(.host == "azure.ai.agent") | .policies[]? | select(.type == "rai_policy") | .raiPolicyName) = strenv(RAI_POLICY_ID)' "$MANIFEST_SRC"
            echo "Injected RAI policy into azure.yaml (policy: ${RAI_POLICY_ID##*/})."
          fi
          # Validate the Browser Automation secret is present when the sample
          # templates it into a connection credential (no-prompt init requires
          # every secret placeholder to be resolvable from the environment).
          if grep -q 'PLAYWRIGHT_SERVICE_ACCESS_TOKEN' "${{ github.workspace }}/${{ matrix.path }}/azure.yaml"; then
            missing=()
            [ -z "${PLAYWRIGHT_SERVICE_ACCESS_TOKEN:-}" ] && missing+=("PLAYWRIGHT_SERVICE_ACCESS_TOKEN")
            if [ ${#missing[@]} -gt 0 ]; then
              echo "::error::Missing Browser Automation secret for no-prompt init: ${missing[*]}"
              exit 1
            fi
          fi
          # Build the `azd ai agent init` command in a single array so we can
          # echo the exact invocation before running it — useful when
          # debugging from the Actions log (especially the code-deploy arm
          # where the flag set varies per row).
          AZD_ARGS=(
            ai agent init
            -m "${{ github.workspace }}/${{ matrix.path }}/azure.yaml"
            --project-id "$PROJECT_ID"
            --no-prompt
            --environment "$AZD_ENV_NAME"
          )
          if [ "${{ matrix.deploy_mode }}" = "code" ]; then
            AZD_ARGS+=(
              --deploy-mode code
              --runtime "${{ matrix.runtime }}"
              --entry-point "${{ matrix.entry_point }}"
              --dep-resolution "${{ matrix.dep_resolution }}"
            )
          else
            AZD_ARGS+=(
              --deploy-mode container
            )
          fi
          # Pretty-print the resolved command (each arg on its own line)
          # so reviewers can copy/paste it locally to reproduce.
          echo "── Resolved azd command ───────────────────────────────"
          printf '  azd'
          for a in "${AZD_ARGS[@]}"; do
            # Quote args containing whitespace for copy/paste fidelity.
            case "$a" in *[[:space:]]*) printf " \\\\\n    %q" "$a" ;; *) printf " \\\\\n    %s" "$a" ;; esac
          done
          printf '\n──────────────────────────────────────────────────────\n'
          # Also surface the matrix row inputs so failures can be traced back.
          echo "matrix.deploy_mode     = ${{ matrix.deploy_mode }}"
          echo "matrix.runtime         = ${{ matrix.runtime }}"
          echo "matrix.entry_point     = ${{ matrix.entry_point }}"
          echo "matrix.dep_resolution  = ${{ matrix.dep_resolution }}"
          echo "matrix.language        = ${{ matrix.language }}"
          echo
          # Run with `set -x` so the literal exec is also in the trace.
          ( set -x; azd "${AZD_ARGS[@]}" )

          if [ ! -f azure.yaml ] && [ -f "${{ matrix.name }}/azure.yaml" ]; then
            shopt -s dotglob nullglob
            mv "${{ matrix.name }}"/* .
            shopt -u dotglob nullglob
            rmdir "${{ matrix.name }}"
          fi
          [ -f azure.yaml ] || { echo "::error::azd ai agent init did not create azure.yaml"; exit 1; }

          # `azd ai agent init` adopts azure.yaml as the project manifest and
          # scaffolds the agent source under src/<agent>/. Some flows only
          # scaffold the manifest (not the application source); when the
          # scaffolded service directory has no source files, copy them from the
          # sample's src/<agent>/ directory in the repo.
          SERVICE_SRC="src/${{ matrix.name }}"
          if [ ! -d "$SERVICE_SRC" ] && [ -d "${{ matrix.name }}" ]; then
            SERVICE_SRC="${{ matrix.name }}"
          fi
          # Sample source now lives under <sample>/src/<agent>/ (PR 601 layout).
          SAMPLE_SRC="${{ github.workspace }}/${{ matrix.path }}/src/${{ matrix.name }}"
          if [ ! -d "$SAMPLE_SRC" ]; then
            # Fall back to the sample root for any sample not yet migrated.
            SAMPLE_SRC="${{ github.workspace }}/${{ matrix.path }}"
          fi
          if [ ! -f "$SERVICE_SRC/main.py" ] && [ ! -f "$SERVICE_SRC/Program.cs" ]; then
            echo "Scaffolded service has no source — copying from sample directory: $SAMPLE_SRC"
            mkdir -p "$SERVICE_SRC"
            # Copy all sample source files (including subdirectories like app/)
            cp -a "$SAMPLE_SRC"/. "$SERVICE_SRC/"
            # Remove non-source files that shouldn't be in the Docker build context
            rm -f "$SERVICE_SRC/azure.yaml" "$SERVICE_SRC/.env" \
                  "$SERVICE_SRC/.env.example" "$SERVICE_SRC/README.md" \
                  "$SERVICE_SRC/.foundry-agent-build.log" "$SERVICE_SRC/.ci-skip" \
                  "$SERVICE_SRC/test-payload.txt" "$SERVICE_SRC/test-payload.json"
          else
            echo "Scaffolded service already has source — skipping source copy"
          fi
          echo "Contents of $SERVICE_SRC:" && ls -la $SERVICE_SRC

          # Rename the agent so each matrix job deploys to a UNIQUE Foundry
          # agent. Without this, the bare sample name (e.g.
          # `langgraph-chat-invocations` or `toolbox-maf`) is used, and:
          #   - container + code arms of the same sample collide on one agent
          #     (each arm pushes a version; "latest" flips by publish order,
          #     so the invoke routes to the wrong image/code)
          #   - parallel toolbox matrix jobs all collapse onto one agent and
          #     `azd ai agent invoke` hits whichever container deployed last
          # In the unified azure.yaml the agent identity is inline on the
          # azure.ai.agent service: the 2-space service key, the top-level
          # project `name:`, and the service's own `name:` field all carry the
          # sample name. The azure.ai.agents postdeploy handler reads
          # AGENT_<service-key>_VERSION and then fetches the agent version using
          # that same key as the agent name, so the service key and the agent
          # `name:` must both become AGENT_NAME or postdeploy 404s.
          if [ -f azure.yaml ]; then
            # yq parses the YAML structurally and preserves comments. Rename the
            # azure.ai.agent service key, its own `name:` field, and the
            # top-level project `name:` all to AGENT_NAME in a single pass, and
            # flip any azd-scaffolded `remoteBuild: true` to false.
            # ACR Tasks remote build frequently fails to expose rawtext.log in
            # time for azd's log streamer, then azd falls back to a local publish
            # path without a local package artifact. CI runners have Docker, so
            # use local build/push directly and avoid the flaky remote-build path.
            AGENT_NAME="$AGENT_NAME" yq -i '
              .name = strenv(AGENT_NAME) |
              (.services[] | select(.host == "azure.ai.agent") | .name) = strenv(AGENT_NAME) |
              (.. | select(has("remoteBuild")) | .remoteBuild) = false |
              .services = (.services | to_entries | map(select(.value.host == "azure.ai.agent").key = strenv(AGENT_NAME)) | from_entries)
            ' azure.yaml
            if [ "$(AGENT_NAME="$AGENT_NAME" yq '.services | has(strenv(AGENT_NAME))' azure.yaml)" != "true" ]; then
              echo "::error::Failed to update azure.yaml agent service key to $AGENT_NAME"
              exit 1
            fi
            echo "Renamed agent → $AGENT_NAME"
            # Structural summary of the rewritten identity (indentation-agnostic).
            AGENT_NAME="$AGENT_NAME" yq '{"name": .name, "agentServiceKey": (.services | to_entries | map(select(.value.host == "azure.ai.agent")) | .[0].key), "agentName": (.services[] | select(.host == "azure.ai.agent") | .name)}' azure.yaml

            # A toolbox service creates a new immutable version on every deploy.
            # Give each matrix cell its own toolbox resource so container/code,
            # toolbox combinations, retries, and concurrent PRs cannot race on
            # one shared default/version list. Only this temporary azure.yaml is
            # rewritten; committed sample manifests are untouched.
            "${{ github.workspace }}/.github/scripts/prepare-hosted-agent-ci-toolboxes.sh" \
              azure.yaml \
              "$CI_TOOLBOX_STATE_FILE" \
              "${{ github.run_id }}" \
              "${{ github.run_attempt }}" \
              "${{ matrix.combo_id }}"
          fi
          # Fail fast if the RAI policy placeholder survived into azure.yaml
          # (e.g. azd dropped the policies block at init). This keeps the
          # guardrail sample from silently deploying without its guardrail.
          if [ -f azure.yaml ] && grep -Fq "raiPolicies/<policy-name>" azure.yaml; then
            echo "::error::RAI policy placeholder survived into azure.yaml — policy injection/propagation failed."
            exit 1
          fi
          # Some templates scaffold the azd project in ./<agent-name>/.
          # Normalize to the step working directory so all subsequent azd
          # commands (env/deploy/invoke/monitor) resolve azure.yaml correctly.
          if [ ! -f azure.yaml ] && [ -f "${{ matrix.name }}/azure.yaml" ]; then
            echo "Flattening nested azd project directory: ${{ matrix.name }}"
            shopt -s dotglob nullglob
            mv "${{ matrix.name }}"/* .
            rmdir "${{ matrix.name }}"
          fi
        timeout-minutes: 5

      # ── Configure azd environment ────────────────────────────────────
      - name: Configure azd environment
        working-directory: /tmp/ci-${{ matrix.combo_id }}
        run: |
          azd env set AZURE_SUBSCRIPTION_ID "${{ vars.AZURE_SUBSCRIPTION_ID }}"
          azd env set AZURE_LOCATION "$AZURE_LOCATION"
          azd env set enableHostedAgentVNext true

          SKIP_PROVISION="${{ vars.SKIP_PROVISION || 'true' }}"

          # Helper: strip BOM and leading/trailing whitespace from variable values
          # Strip BOM/CR and trim leading/trailing whitespace. Uses sed (not
          # xargs) so values containing quotes/apostrophes are preserved verbatim
          # — xargs treats single/double quotes specially and aborts with
          # "unmatched single quote" on values like "don't", which would fail the
          # whole step under `bash -e`.
          sanitize() { printf '%s' "$1" | sed -e 's/^\xEF\xBB\xBF//' -e 's/\r//g' -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }

          # Dump all repo/environment vars as JSON and iterate,
          # setting each as an azd env var (skipping empty values).
          # This automatically picks up any variable added to Settings → Actions → Variables
          # without requiring edits to this workflow.
          cat > /tmp/all-vars.json <<'EOF'
          ${{ toJson(vars) }}
          EOF

          echo "Passing through all repo/environment variables to azd:"
          jq -r 'to_entries[] | [.key, .value] | @tsv' /tmp/all-vars.json | \
            while IFS=$'\t' read -r key value; do
              # Skip empty values
              [ -z "$value" ] && continue
              # Skip names already set above (from workflow/job env, not vars)
              case "$key" in
                AZD_ENV_NAME|AZURE_SUBSCRIPTION_ID|AZURE_LOCATION) continue ;;
              esac
              sanitized=$(sanitize "$value")
              azd env set "$key" "$sanitized"
              echo "  • $key"
            done

          # Mirror AZURE_OPENAI_DEPLOYMENT → AZURE_AI_MODEL_DEPLOYMENT_NAME with gpt-4o default.
          # Runs after the loop so the default applies when AZURE_OPENAI_DEPLOYMENT is unset/empty.
          OPENAI_EP="${{ vars.AZURE_OPENAI_ENDPOINT }}"
          OPENAI_DEP="${{ vars.AZURE_OPENAI_DEPLOYMENT }}"
          if [ -n "$OPENAI_EP" ]; then
            # Apply gpt-4o default when AZURE_OPENAI_DEPLOYMENT is unset/empty (loop skips empty values).
            azd env set AZURE_OPENAI_DEPLOYMENT "$(sanitize "${OPENAI_DEP:-gpt-4o}")"
            # Samples read AZURE_AI_MODEL_DEPLOYMENT_NAME (Foundry AIProjectClient) — mirror AZURE_OPENAI_DEPLOYMENT.
            azd env set AZURE_AI_MODEL_DEPLOYMENT_NAME "$(sanitize "${OPENAI_DEP:-gpt-4o}")"
            echo "✅ Azure OpenAI env vars set"
          else
            echo "⚠️  AZURE_OPENAI_ENDPOINT not configured - LLM samples will fail"
          fi

          # GitHub Copilot SDK sample requires a GITHUB_TOKEN (fine-grained PAT).
          # Secrets are not included in the vars context, so this must be set explicitly.
          azd env set GITHUB_TOKEN "${{ secrets.GITHUB_TOKEN }}"

          # Secret manifest parameters must be available at init time and in the azd environment.
          [ -n "${PLAYWRIGHT_SERVICE_ACCESS_TOKEN:-}" ] && azd env set PLAYWRIGHT_SERVICE_ACCESS_TOKEN "$PLAYWRIGHT_SERVICE_ACCESS_TOKEN"

          # For toolbox-consuming samples, derive TOOLBOX_NAME from the per-cell
          # toolbox URL so the agent-framework server-side resolution
          # (`client.get_toolbox(TOOLBOX_NAME)`) picks the same toolbox the
          # matrix cell is targeting. Falls back to the global TOOLBOX_NAME
          # variable for non-toolbox samples that still happen to read it.
          if [ -n "${{ matrix.toolbox_url }}" ]; then
            DERIVED_TOOLBOX_NAME="$(echo "${{ matrix.toolbox_url }}" | sed -n 's@.*/toolboxes/\([^/]*\)/.*@\1@p')"
            azd env set TOOLBOX_NAME "${DERIVED_TOOLBOX_NAME:-${{ vars.TOOLBOX_NAME }}}"
          elif [ -f "$CI_TOOLBOX_STATE_FILE" ] && [ "$(jq '.toolboxes | length' "$CI_TOOLBOX_STATE_FILE")" -gt 0 ]; then
            # Non-cartesian samples such as responses/06-files consume the
            # toolbox declared in their own manifest. Point TOOLBOX_NAME at the
            # cell-owned name generated during scaffold.
            azd env set TOOLBOX_NAME "$(jq -r '.toolboxes[0].name' "$CI_TOOLBOX_STATE_FILE")"
          else
            azd env set TOOLBOX_NAME "${{ vars.TOOLBOX_NAME }}"
          fi

          # ── Per-cell toolbox project overrides ──────────────────────
          # The auto-loop above set every repo var. For toolbox cells we
          # need to re-point project + ACR + model to the dedicated
          # TOOLBOX_PROJECT_*. use_westus2 routes to the westus2 fallback
          # (kept as a hatch in case the ncus path regresses).
          if [ "${{ matrix.use_westus2 }}" = "true" ]; then
            azd env set AZURE_SUBSCRIPTION_ID "$(sanitize "${{ vars.TOOLBOX_SUBSCRIPTION_ID_WESTUS2 }}")"
            azd env set AZURE_LOCATION "westus2"
            azd env set AZURE_RESOURCE_GROUP "$(sanitize "${{ vars.TOOLBOX_RESOURCE_GROUP_WESTUS2 || vars.TOOLBOX_RESOURCE_GROUP || vars.AZURE_RESOURCE_GROUP }}")"
            azd env set AZURE_AI_ACCOUNT_NAME "$(sanitize "${{ vars.TOOLBOX_AI_ACCOUNT_NAME_WESTUS2 || vars.TOOLBOX_AI_ACCOUNT_NAME || vars.AZURE_AI_ACCOUNT_NAME }}")"
            azd env set AZURE_AI_PROJECT_NAME "$(sanitize "${{ vars.TOOLBOX_AI_PROJECT_NAME_WESTUS2 || vars.TOOLBOX_AI_PROJECT_NAME || vars.AZURE_AI_PROJECT_NAME }}")"
            azd env set AZURE_AI_PROJECT_ENDPOINT "$(sanitize "${{ vars.TOOLBOX_PROJECT_ENDPOINT_WESTUS2 }}")"
            azd env set AZURE_AI_PROJECT_ID "$(sanitize "${{ vars.TOOLBOX_PROJECT_ID_WESTUS2 }}")"
            azd env set FOUNDRY_PROJECT_ENDPOINT "$(sanitize "${{ vars.TOOLBOX_PROJECT_ENDPOINT_WESTUS2 }}")"
            azd env set AZURE_CONTAINER_REGISTRY_ENDPOINT "$(sanitize "${{ vars.TOOLBOX_CONTAINER_REGISTRY_ENDPOINT_WESTUS2 || vars.AZURE_CONTAINER_REGISTRY_ENDPOINT }}")"
            azd env set TOOLBOX_ENDPOINT "$(sanitize "${{ matrix.toolbox_url }}")"
            MODEL_NAME="$(sanitize "${{ vars.TOOLBOX_MODEL_DEPLOYMENT_NAME }}")"
            azd env set AZURE_AI_MODEL_DEPLOYMENT_NAME "$MODEL_NAME"
            azd env set MODEL_DEPLOYMENT_NAME "$MODEL_NAME"
          elif [ "${{ matrix.is_toolbox }}" = "true" ]; then
            azd env set AZURE_RESOURCE_GROUP "$(sanitize "${{ vars.TOOLBOX_RESOURCE_GROUP || vars.AZURE_RESOURCE_GROUP }}")"
            azd env set AZURE_AI_ACCOUNT_NAME "$(sanitize "${{ vars.TOOLBOX_AI_ACCOUNT_NAME || vars.AZURE_AI_ACCOUNT_NAME }}")"
            azd env set AZURE_AI_PROJECT_NAME "$(sanitize "${{ vars.TOOLBOX_AI_PROJECT_NAME || vars.AZURE_AI_PROJECT_NAME }}")"
            azd env set AZURE_AI_PROJECT_ENDPOINT "$(sanitize "${{ vars.TOOLBOX_PROJECT_ENDPOINT }}")"
            azd env set AZURE_AI_PROJECT_ID "$(sanitize "${{ vars.TOOLBOX_PROJECT_ID }}")"
            azd env set FOUNDRY_PROJECT_ENDPOINT "$(sanitize "${{ vars.TOOLBOX_PROJECT_ENDPOINT }}")"
            azd env set TOOLBOX_ENDPOINT "$(sanitize "${{ matrix.toolbox_url }}")"
            MODEL_NAME="$(sanitize "${{ vars.TOOLBOX_MODEL_DEPLOYMENT_NAME }}")"
            azd env set AZURE_AI_MODEL_DEPLOYMENT_NAME "$MODEL_NAME"
            azd env set MODEL_DEPLOYMENT_NAME "$MODEL_NAME"
          fi


          # Log configuration for debugging
          echo "══════════════════════════════════════════"
          echo "  Cloud E2E Configuration"
          echo "══════════════════════════════════════════"
          echo "  SKIP_PROVISION:  $SKIP_PROVISION"
          echo "  AZURE_LOCATION:  $AZURE_LOCATION"
          echo "  AZD_ENV_NAME:    $AZD_ENV_NAME"
          echo "  Resource Group:  ${{ vars.AZURE_RESOURCE_GROUP }}"
          echo "  AI Account:      ${{ vars.AZURE_AI_ACCOUNT_NAME }}"
          echo "  AI Project:      ${{ vars.AZURE_AI_PROJECT_NAME }}"
          echo "  Project ID:      ${{ vars.AZURE_AI_PROJECT_ID }}"
          echo "  Project Endpoint:${{ vars.AZURE_AI_PROJECT_ENDPOINT }}"
          echo "  ACR Endpoint:    ${{ vars.AZURE_CONTAINER_REGISTRY_ENDPOINT }}"
          echo "  OpenAI Endpoint: ${OPENAI_EP:-<not set>}"
          echo "  OpenAI Deploy:   ${OPENAI_DEP:-gpt-4o (default)}"
          echo "══════════════════════════════════════════"

          # Show all azd env vars for debugging
          echo ""
          echo "=== azd env get-values ==="
          azd env get-values | grep -E "(AZURE_OPENAI|AZURE_AI_PROJECT)" || echo "(no matching vars)"

      # ── Provision infrastructure (only when not using existing project) ──
      - name: Provision Azure resources
        if: vars.SKIP_PROVISION != 'true'
        working-directory: /tmp/ci-${{ matrix.combo_id }}
        run: azd provision --no-prompt
        timeout-minutes: 15

      # ── Override toolbox env values in azure.yaml (toolbox samples) ─────
      # The committed azure.yaml carries per-sample defaults on the
      # azure.ai.agent service's `env:` map (e.g. `TOOLBOX_NAME: my-toolbox` or
      # `TOOLBOX_ENDPOINT: ${TOOLBOX_ENDPOINT}`). CI fans each toolbox sample
      # across several toolbox endpoints, so we must force the per-cell values
      # onto that env map before deploy — a plain `azd env set` cannot override
      # a value hardcoded in the manifest.
      - name: Override toolbox env in azure.yaml
        if: matrix.is_toolbox == 'true'
        working-directory: /tmp/ci-${{ matrix.combo_id }}
        env:
          REPL_TOOLBOX_ENDPOINT: ${{ matrix.toolbox_url }}
          REPL_MODEL_DEPLOYMENT_NAME: ${{ vars.TOOLBOX_MODEL_DEPLOYMENT_NAME }}
          REPL_AZURE_AI_PROJECT_ENDPOINT: ${{ matrix.use_westus2 == 'true' && vars.TOOLBOX_PROJECT_ENDPOINT_WESTUS2 || vars.TOOLBOX_PROJECT_ENDPOINT }}
          REPL_AZURE_AI_MODEL_DEPLOYMENT_NAME: ${{ vars.TOOLBOX_MODEL_DEPLOYMENT_NAME }}
        run: |
          AZURE_YAML="azure.yaml"
          if [ ! -f "$AZURE_YAML" ]; then
            echo "::warning::$AZURE_YAML not found, skipping toolbox env override"
            exit 0
          fi
          # Derive TOOLBOX_NAME from the matrix toolbox URL slug
          # (e.g. .../toolboxes/file-search/mcp?... -> "file-search") so a
          # server-side `client.get_toolbox(name)` resolves the per-cell toolbox.
          DERIVED_TOOLBOX_NAME=""
          if [ -n "$REPL_TOOLBOX_ENDPOINT" ]; then
            DERIVED_TOOLBOX_NAME=$(printf '%s' "$REPL_TOOLBOX_ENDPOINT" | sed -n 's@.*/toolboxes/\([^/]*\)/.*@\1@p')
            [ -n "$DERIVED_TOOLBOX_NAME" ] && echo "Derived TOOLBOX_NAME from URL: $DERIVED_TOOLBOX_NAME"
          fi
          export DERIVED_TOOLBOX_NAME
          echo "--- azure.yaml agent env BEFORE override ---"
          grep -nE "^[[:space:]]+(env:|[A-Z_][A-Z0-9_]*:)" "$AZURE_YAML" || true
          # Build the override map (skip empty values) and apply each to the
          # azure.ai.agent service's `env:` map with yq, which parses the YAML
          # structurally and preserves comments. FOUNDRY_*/AGENT_* are reserved
          # by the platform and injected at runtime, so none of these keys use
          # those prefixes.
          if [ "$(yq '[.services[] | select(.host == "azure.ai.agent")] | length' "$AZURE_YAML")" = "0" ]; then
            echo "::warning::No azure.ai.agent service found; skipping env override."
          else
            set_agent_env() {
              local key="$1" val="$2"
              [ -z "$val" ] && return 0
              key="$key" val="$val" yq -i \
                '(.services[] | select(.host == "azure.ai.agent") | .env[strenv(key)]) = strenv(val)' \
                "$AZURE_YAML"
              echo "  $key=$val"
            }
            echo "Applied toolbox env overrides:"
            set_agent_env TOOLBOX_ENDPOINT "$REPL_TOOLBOX_ENDPOINT"
            set_agent_env MODEL_DEPLOYMENT_NAME "$REPL_MODEL_DEPLOYMENT_NAME"
            set_agent_env AZURE_AI_MODEL_DEPLOYMENT_NAME "$REPL_AZURE_AI_MODEL_DEPLOYMENT_NAME"
            set_agent_env AZURE_AI_PROJECT_ENDPOINT "$REPL_AZURE_AI_PROJECT_ENDPOINT"
            set_agent_env TOOLBOX_NAME "$DERIVED_TOOLBOX_NAME"
          fi
          echo "--- azure.yaml agent env AFTER override ---"
          grep -nE "^[[:space:]]+(env:|[A-Z_][A-Z0-9_]*:)" "$AZURE_YAML" || true
          # Fail if any unresolved connection-credential mustache placeholder
          # ({{...}}) survived init — those must be resolved before deploy.
          if grep -qE '\{\{[^}]+\}\}' "$AZURE_YAML"; then
            echo "::error::azure.yaml still contains unresolved {{...}} placeholders after init"
            grep -nE '\{\{[^}]+\}\}' "$AZURE_YAML"
            exit 1
          fi

      # ── Pre-pull Docker base images ─────────────────────────────────
      - name: Pre-pull Docker base images
        working-directory: /tmp/ci-${{ matrix.combo_id }}
        run: |
          base_images=$(find src -name Dockerfile \
            -exec awk '/^FROM mcr\.microsoft\.com\// { print $2 }' {} + \
            | sort -u)

          if [ -z "$base_images" ]; then
            echo "No MCR base images found to pre-pull"
            exit 0
          fi

          while IFS= read -r image; do
            [ -z "$image" ] && continue
            echo "Pre-pulling $image"
            for attempt in 1 2 3; do
              if docker pull "$image"; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "::error::Failed to pre-pull $image after 3 attempts"
                exit 1
              fi
              sleep_seconds=$((attempt * 20))
              echo "::warning::docker pull failed for $image (attempt $attempt/3); retrying in ${sleep_seconds}s"
              sleep "$sleep_seconds"
            done
          done <<< "$base_images"

      # ── Deploy agent ─────────────────────────────────────────────────
      - name: Deploy ${{ matrix.name }} agent
        id: deploy_agent
        working-directory: /tmp/ci-${{ matrix.combo_id }}
        env:
          # Code-deploy arm skips ACR provisioning (no container image to push).
          SKIP_ACR_CREATION: ${{ matrix.deploy_mode == 'code' && 'true' || 'false' }}
        run: |
          # Print the azure.yaml from the present directory for debugging.
          echo "─── azure.yaml ($(pwd)) ───"
          cat azure.yaml
          # NOTE: use PIPESTATUS[0] to capture azd exit code, not tee's exit code.
          #
          # Retry on transient container-publish failures. Known flaky
          # patterns in the Foundry hosted-agent package service:
          #   1) "failed retrieving package result details" — rpc Unknown
          #      from the package service when ACR task logs aren't yet
          #      readable.
          #   2) ACR Tasks log blob "BlobNotFound" on the rawtext.log poll.
          #   3) "toomanyrequests" — ACR per-identity rate limit (HTTP 429)
          #      when many container matrix jobs push concurrently under the
          #      shared CI service principal. Back off past the 60s rolling
          #      window with jitter so retries don't re-collide.
          # All are timing races; a retry with backoff clears them.
          attempt=0
          max_attempts=3
          while : ; do
            attempt=$((attempt+1))
            echo "─── Deploy attempt $attempt/$max_attempts ───"
            azd deploy --no-prompt 2>&1 | tee /tmp/azd-deploy.log
            azd_exit=${PIPESTATUS[0]}
            if [ $azd_exit -eq 0 ]; then
              echo "Deploy succeeded"
              break
            fi
            transient=false
            if grep -qE "failed retrieving package result details|BlobNotFound|container publish failed: rpc error" /tmp/azd-deploy.log; then
              transient=true
            fi
            throttled=false
            if grep -qiE "toomanyrequests|exceeded the per-identity rate limit" /tmp/azd-deploy.log; then
              transient=true
              throttled=true
            fi
            if [ "$transient" = "true" ] && [ $attempt -lt $max_attempts ]; then
              if [ "$throttled" = "true" ]; then
                backoff=$((60 + RANDOM % 60))
                echo "::warning::ACR per-identity rate limit hit (attempt $attempt) — backing off ${backoff}s"
              else
                backoff=$((attempt * 30))
                echo "::warning::Transient publish failure (attempt $attempt) — retrying in ${backoff}s"
              fi
              sleep $backoff
              continue
            fi
            echo "Deploy failed"
            exit 1
          done
        timeout-minutes: 30

      # ── Verify cell-owned toolbox deployment ─────────────────────────
      - name: Verify temporary toolbox deployment
        working-directory: /tmp/ci-${{ matrix.combo_id }}
        run: |
          if [ ! -f "$CI_TOOLBOX_STATE_FILE" ] || [ "$(jq '.toolboxes | length' "$CI_TOOLBOX_STATE_FILE")" -eq 0 ]; then
            echo "No azure.ai.toolbox services declared; skipping toolbox verification."
            jq -n '{toolboxes:[]}' > "$CI_TOOLBOX_DEPLOY_RESULT"
            exit 0
          fi

          ENDPOINT="$(azd env get-value AZURE_AI_PROJECT_ENDPOINT)"
          results='[]'
          while IFS= read -r name; do
            versions=$(azd ai toolbox versions list "$name" \
              --project-endpoint "$ENDPOINT" --output json --no-prompt)
            count=$(jq '.versions | length' <<< "$versions")
            if [ "$count" -lt 1 ]; then
              echo "::error::Temporary toolbox $name has no published version"
              exit 1
            fi
            # A transient azd deploy retry can legitimately publish more than
            # one version to this cell-owned resource. Isolation and teardown,
            # not an exact count, are the lifecycle invariants.
            version=$(jq -r '.versions[0].version' <<< "$versions")
            results=$(jq -c --arg name "$name" --arg version "$version" --argjson count "$count" \
              '. + [{name:$name,version:$version,versions_count:$count}]' <<< "$results")
            echo "✅ Temporary toolbox $name exists with $count version(s)"
          done < <(jq -r '.toolboxes[].name' "$CI_TOOLBOX_STATE_FILE")
          jq -n --arg project_endpoint "$ENDPOINT" --argjson toolboxes "$results" \
            '{project_endpoint:$project_endpoint,toolboxes:$toolboxes}' > "$CI_TOOLBOX_DEPLOY_RESULT"
        timeout-minutes: 3

      # ── Verify the deployed agent environment ───────────────────────
      # azd merges several environment shapes from azure.yaml before deploy
      # (`environmentVariables:`, the service `env:` map, the deprecated
      # `config: env:` map) and precedence between them has changed across
      # extension releases. A value that silently arrives empty produces a
      # container that crashes or hangs minutes later with an unrelated-looking
      # `session_not_ready`, so compare the deployed values against the manifest
      # here, where the diagnosis is one line.
      - name: Verify deployed agent environment
        working-directory: /tmp/ci-${{ matrix.combo_id }}
        env:
          MATRIX_TOOLBOX_URL: ${{ matrix.toolbox_url }}
        run: |
          set -euo pipefail
          AGENT_JSON=$(azd ai agent show --no-prompt --output json 2>/dev/null || true)
          DEPLOYED_ENV=$(jq -c '.definition.environment_variables // {}' <<< "$AGENT_JSON" 2>/dev/null || echo '{}')
          if [ -z "$DEPLOYED_ENV" ] || [ "$DEPLOYED_ENV" = "{}" ] || [ "$DEPLOYED_ENV" = "null" ]; then
            echo "::warning::Could not read deployed environment variables from 'azd ai agent show'; skipping check"
            exit 0
          fi
          echo "Deployed environment variables:"
          jq . <<< "$DEPLOYED_ENV"

          # An empty deployed value means something upstream (azd env
          # resolution, an env-shape precedence change, a rewrite that silently
          # matched nothing) dropped it. TOOLBOX_NAME is fatal at container
          # startup, so fail on it; report the rest so they are visible without
          # turning an unset optional secret into a red job.
          blank=$(jq -r 'to_entries | map(select(.value == "")) | map(.key) | join(", ")' <<< "$DEPLOYED_ENV")
          if [ -n "$blank" ]; then
            echo "::warning::Deployed agent has empty environment variable(s): $blank"
          fi
          if jq -e 'has("TOOLBOX_NAME") and .TOOLBOX_NAME == ""' <<< "$DEPLOYED_ENV" >/dev/null; then
            echo "::error::Deployed agent has an empty TOOLBOX_NAME; the agent cannot resolve its toolbox"
            echo "azure.yaml agent env for comparison:"
            yq '.services[] | select(.host == "azure.ai.agent") | {"environmentVariables": .environmentVariables, "env": .env}' azure.yaml || true
            exit 1
          fi

          # When the sample owns a cell-scoped toolbox, the deployed TOOLBOX_NAME
          # must be that toolbox — not a shared one from the committed manifest.
          if [ -f "$CI_TOOLBOX_STATE_FILE" ] && [ "$(jq '.toolboxes | length' "$CI_TOOLBOX_STATE_FILE")" -gt 0 ]; then
            # Mirror azd's precedence: the `env:` map overrides
            # `environmentVariables:` (Azure/azure-dev#9149), which is how the
            # per-cell toolbox override in this workflow takes effect.
            EXPECTED_TOOLBOX=$(yq -r '[.services[] | select(.host == "azure.ai.agent") | select(has("env")) | .env.TOOLBOX_NAME] | .[0] // ""' azure.yaml)
            if [ -z "$EXPECTED_TOOLBOX" ]; then
              EXPECTED_TOOLBOX=$(yq -r '[.services[] | select(.host == "azure.ai.agent") | .environmentVariables[]? | select(.name == "TOOLBOX_NAME") | .value] | .[0] // ""' azure.yaml)
            fi
            DEPLOYED_TOOLBOX=$(jq -r '.TOOLBOX_NAME // ""' <<< "$DEPLOYED_ENV")
            if [ -n "$EXPECTED_TOOLBOX" ] && [ "$EXPECTED_TOOLBOX" != "$DEPLOYED_TOOLBOX" ]; then
              echo "::error::Deployed TOOLBOX_NAME does not match azure.yaml (expected '$EXPECTED_TOOLBOX', deployed '$DEPLOYED_TOOLBOX')"
              exit 1
            fi
            # Cartesian toolbox cells (matrix.toolbox_url) deliberately point at
            # a shared, externally provisioned toolbox, so ownership only applies
            # to samples that declare their own toolbox service.
            if [ -n "$DEPLOYED_TOOLBOX" ] && [ -z "${MATRIX_TOOLBOX_URL:-}" ] && \
               [ "$(jq -r --arg name "$DEPLOYED_TOOLBOX" '[.toolboxes[] | select(.name == $name)] | length' "$CI_TOOLBOX_STATE_FILE")" -eq 0 ]; then
              echo "::error::Deployed TOOLBOX_NAME '$DEPLOYED_TOOLBOX' is not a cell-owned toolbox for this job"
              jq '.toolboxes' "$CI_TOOLBOX_STATE_FILE"
              exit 1
            fi
            echo "✅ Deployed TOOLBOX_NAME: ${DEPLOYED_TOOLBOX:-(not declared)}"
          fi
        timeout-minutes: 3

      # ── Surface Foundry deploy error (best-effort diagnostic) ────────
      # azd's `[CodeError] Exception: For troubleshooting, see ...` line
      # is opaque — the real reason lives in the agent-version GET response
      # body (status_details.error.message). Fetch it directly on failure
      # so CI logs are self-diagnosing. Never fails the job itself.
      - name: Surface Foundry deploy error
        if: failure() && steps.deploy_agent.outcome == 'failure'
        working-directory: /tmp/ci-${{ matrix.combo_id }}
        continue-on-error: true
        run: |
          set +e
          ENDPOINT="$(azd env get-value AZURE_AI_PROJECT_ENDPOINT 2>/dev/null)"
          if [ -z "$ENDPOINT" ]; then
            echo "::warning::AZURE_AI_PROJECT_ENDPOINT not set in azd env — skipping diagnostic"
            exit 0
          fi
          # Strip trailing slash for clean URL composition.
          ENDPOINT="${ENDPOINT%/}"
          TOKEN="$(az account get-access-token --resource https://ai.azure.com --query accessToken -o tsv 2>/dev/null)"
          if [ -z "$TOKEN" ]; then
            echo "::warning::Could not acquire ai.azure.com token — skipping diagnostic"
            exit 0
          fi
          API_VER="2025-11-15-preview"
          FEATURES="CodeAgents=V1Preview,HostedAgents=V1Preview"

          echo "::group::Foundry agent state for $AGENT_NAME"
          AGENT_URL="$ENDPOINT/agents/$AGENT_NAME?api-version=$API_VER"
          echo "GET $AGENT_URL"
          curl -sS -H "Authorization: Bearer $TOKEN" \
               -H "Foundry-Features: $FEATURES" \
               -H "Accept: application/json" \
               "$AGENT_URL" | tee /tmp/agent.json | jq . 2>/dev/null || cat /tmp/agent.json
          echo "::endgroup::"

          VERSION=$(jq -r '.versions.latest.version // empty' /tmp/agent.json 2>/dev/null)
          if [ -z "$VERSION" ]; then
            echo "::warning::Could not read latest version from agent GET — skipping version-level diagnostic"
            exit 0
          fi

          echo "::group::Foundry agent-version $VERSION (full JSON — error payload)"
          VER_URL="$ENDPOINT/agents/$AGENT_NAME/versions/$VERSION?api-version=$API_VER"
          echo "GET $VER_URL"
          curl -sS -H "Authorization: Bearer $TOKEN" \
               -H "Foundry-Features: $FEATURES" \
               -H "Accept: application/json" \
               "$VER_URL" | tee /tmp/agent-version.json | jq . 2>/dev/null || cat /tmp/agent-version.json
          echo "::endgroup::"

          # Try several common error-location shapes; emit whichever has content.
          ERR=$(jq -r '
            .status_details.error.message //
            .status_details.message //
            .error.message //
            .properties.error.message //
            empty' /tmp/agent-version.json 2>/dev/null)
          STATUS=$(jq -r '.status // empty' /tmp/agent-version.json 2>/dev/null)
          if [ -n "$ERR" ]; then
            echo "::error::Foundry deploy error (status=$STATUS): $ERR"
          else
            echo "::warning::No error message field found in agent-version response (status=$STATUS) — see full JSON above"
          fi
        timeout-minutes: 3

      # ── Wait for agent to be active ───────────────────────────────────
      - name: Wait for ${{ matrix.name }} agent to be active
        working-directory: /tmp/ci-${{ matrix.combo_id }}
        run: |
          echo "Waiting for agent to reach active state..."
          for i in $(seq 1 18); do
            STATUS=$(azd ai agent show --no-prompt 2>&1 | grep -i "status" | head -1 || true)
            echo "  Poll $i/18: $STATUS"
            if echo "$STATUS" | grep -qi "active"; then
              echo "✅ Agent is active"
              exit 0
            fi
            sleep 5
          done
          echo "::warning::Agent may not be active yet — proceeding with invoke anyway"
        timeout-minutes: 3

      # ── Create the cell-owned session ───────────────────────────────
      - name: Create agent session
        working-directory: /tmp/ci-${{ matrix.combo_id }}
        run: |
          source "${{ github.workspace }}/.github/scripts/hosted-agent-retry.sh"
          AGENT_JSON=$(azd ai agent show --no-prompt --output json 2>/dev/null || true)
          DEPLOYED_AGENT_VERSION=$(jq -r '.version // empty' <<< "$AGENT_JSON" 2>/dev/null || true)
          if [ -z "$DEPLOYED_AGENT_VERSION" ]; then
            echo "::error::Could not resolve the deployed agent version from 'azd ai agent show'"
            exit 1
          fi

          quota_retries=0
          transient_attempt=1
          max_transient_attempts=4
          backoff=15
          session_create_may_have_succeeded=false
          while :; do
            set +e
            azd ai agent sessions create \
              --session-id "$CI_AGENT_SESSION_ID" \
              --version "$DEPLOYED_AGENT_VERSION" \
              --no-prompt --output json \
              > /tmp/session-create.txt 2>&1
            create_exit=$?
            set -e
            cat /tmp/session-create.txt
            if [ $create_exit -eq 0 ]; then
              break
            fi
            if [ "$session_create_may_have_succeeded" = "true" ] && \
                grep -qiE "session_already_exists|A session with this ID already exists" /tmp/session-create.txt; then
              echo "::warning::The earlier create request created the session; continuing with the existing session"
              break
            fi
            if hosted_agent_is_session_quota_error /tmp/session-create.txt; then
              if [ $quota_retries -ge "$HOSTED_AGENT_QUOTA_MAX_RETRIES" ]; then
                echo "::error::Exhausted $HOSTED_AGENT_QUOTA_MAX_RETRIES session quota retries"
                exit "$create_exit"
              fi
              quota_retries=$((quota_retries + 1))
              quota_delay=$(hosted_agent_quota_retry_delay)
              echo "::warning::Session quota exceeded; retry $quota_retries/$HOSTED_AGENT_QUOTA_MAX_RETRIES in ${quota_delay}s"
              sleep "$quota_delay"
              continue
            fi
            if [ $transient_attempt -lt $max_transient_attempts ] && \
                grep -qiE "session_not_ready|status[ _]?code[: ]+424|HTTP 424|readiness|still being provisioned|version is still being|server_error|internal server error|received from peer|connection reset by peer|EOF while reading response" /tmp/session-create.txt; then
              if grep -qiE "session_not_ready|status[ _]?code[: ]+424|HTTP 424" /tmp/session-create.txt; then
                session_create_may_have_succeeded=true
              fi
              echo "::warning::Session create transient attempt $transient_attempt failed; retrying in ${backoff}s"
              sleep "$backoff"
              backoff=$((backoff * 2))
              transient_attempt=$((transient_attempt + 1))
              continue
            fi
            exit "$create_exit"
          done
        timeout-minutes: 15

      # ── Validate: invoke (unified, multi-turn) ──────────────────────
      # Both protocols use -p <protocol> with a payload file.
      # Payload file (test-payload.txt) lives under
      # internal/tools/samples-hosted-agents/<lang>/<protocol>/<sample-name>/
      # and contains one prompt per line. Each line may be a plain string or a
      # JSON object — the line is passed through to `azd ai agent invoke`
      # verbatim. Each line is treated as a separate turn. If no payload file
      # is present for the sample, a default 3-turn payload is generated
      # automatically.
      - name: Invoke ${{ matrix.name }} agent
        working-directory: /tmp/ci-${{ matrix.combo_id }}
        env:
          TOOLBOX_QUERY: ${{ matrix.toolbox_query }}
        run: |
          set +e  # Capture errors manually so we can log all turns first
          source "${{ github.workspace }}/.github/scripts/hosted-agent-retry.sh"
          PROTOCOL="${{ matrix.protocol }}"
          SAMPLE_DIR="${{ github.workspace }}/${{ matrix.path }}"
          # Priority for the prompt:
          #   1. matrix.toolbox_query (per-toolbox question from TOOLBOX_ENDPOINT) — toolbox jobs only
          #   2. Per-sample payload files in internal/tools/samples-hosted-agents/<lang>/<protocol>/<sample-dir>/test-payload.txt
          #   3. Default 3-turn payload
          
          # Check for per-sample payload file (supports both hosted-agents and toolbox samples)
          SAMPLE_LANG="$(echo "${{ matrix.path }}" | awk -F/ '{print $2}')"
          SAMPLE_DIR_NAME="$(basename "${{ matrix.path }}")"
          PAYLOAD_FILE="${{ github.workspace }}/internal/tools/samples-hosted-agents/$SAMPLE_LANG/$PROTOCOL/$SAMPLE_DIR_NAME/test-payload.txt"
          
          if [ -n "$TOOLBOX_QUERY" ] && [ "${{ matrix.is_toolbox }}" = "true" ]; then
            # Toolbox samples: use the provided query
            echo "Using toolbox-specific query: $TOOLBOX_QUERY"
            if [ "$PROTOCOL" = "invocations" ]; then
              PAYLOAD_FILE="/tmp/toolbox-query-${{ matrix.combo_id }}.json"
              # -c emits compact (single-line) JSON. The invoke loop reads
              # the payload file line-by-line and treats each non-empty line
              # as a separate turn, so multi-line JSON would be split into
              # broken fragments.
              jq -nc --arg q "$TOOLBOX_QUERY" '{query:$q}' > "$PAYLOAD_FILE"
            else
              PAYLOAD_FILE="/tmp/toolbox-query-${{ matrix.combo_id }}.txt"
              echo "$TOOLBOX_QUERY" > "$PAYLOAD_FILE"
            fi
          elif [ ! -f "$PAYLOAD_FILE" ]; then
            # No per-sample payload file and no toolbox query: generate default 3-turn payload
            echo "No payload file found — generating default 3-turn payload"
            PAYLOAD_FILE="/tmp/default-payload-${{ matrix.combo_id }}.txt"
            if [ "$PROTOCOL" = "invocations" ]; then
              for i in 1 2 3; do echo '{"query": "analyze dataset"}' >> "$PAYLOAD_FILE"; done
            else
              for i in 1 2 3; do echo "Hello from CI" >> "$PAYLOAD_FILE"; done
            fi
          fi

          echo "Payload file: $PAYLOAD_FILE"
          echo "Contents:"
          cat "$PAYLOAD_FILE"
          echo ""

          # For the responses protocol we POST directly to the agent's
          # OpenAI-compatible /responses endpoint and extract the assistant
          # text from the JSON response. `azd ai agent invoke` prints only
          # header/footer metadata and never includes the actual response
          # body, so it cannot be used to validate the model's reply.
          # For invocations we still use `azd ai agent invoke` (the payload
          # shape is opaque and validated by exit code only).
          AGENT_JSON=$(azd ai agent show --no-prompt --output json 2>/dev/null)
          DEPLOYED_AGENT_VERSION=$(jq -r '.version // empty' <<< "$AGENT_JSON")
          if [ -z "$DEPLOYED_AGENT_VERSION" ]; then
            echo "::error::Could not resolve the deployed agent version from 'azd ai agent show'"
            exit 1
          fi
          echo "Invoking deployed agent version: $DEPLOYED_AGENT_VERSION"

          AGENT_RESPONSES_URL=""
          AAD_TOKEN=""
          if [ "$PROTOCOL" = "responses" ]; then
            # ``azd ai agent show`` defaults to a human-readable table since the
            # recent CLI release, which makes ``jq`` choke with
            # ``Invalid numeric literal at line 1, column 6``. Force the JSON
            # output format so the agent endpoint can still be parsed (same
            # flag the cleanup step already uses).
            AGENT_RESPONSES_URL=$(jq -r '.agent_endpoints.responses // empty' <<< "$AGENT_JSON")
            if [ -z "$AGENT_RESPONSES_URL" ]; then
              echo "::error::Could not resolve agent responses endpoint from 'azd ai agent show'"
              exit 1
            fi
            AAD_TOKEN=$(az account get-access-token --resource https://ai.azure.com --query accessToken -o tsv)
            echo "Agent responses endpoint: $AGENT_RESPONSES_URL"
          fi

          # Invoke once per non-empty line (= one turn per line).
          turn=0
          overall_exit=0
          quota_retries=0
          while IFS= read -r line || [ -n "$line" ]; do
            [ -z "$line" ] && continue
            turn=$((turn + 1))
            echo "─── Turn $turn ───"
            echo "Prompt: $line"

            TURN_FILE="/tmp/turn-${{ matrix.combo_id }}-${turn}"
            echo "$line" > "$TURN_FILE"

            request_attempt=0
            transient_attempt=1
            max_transient_attempts=4
            backoff=15
            model_throttle_retries=0
            max_model_throttle_retries=3
            model_throttle_backoff=60
            model_throttle_exhausted=false
            turn_exit=1
            while : ; do
              request_attempt=$((request_attempt + 1))
              if [ "$PROTOCOL" = "responses" ]; then
                # Samples opt out of response storage, but all turns and retries
                # intentionally share this cell's caller-owned hosted session.
                jq -n --arg input "$line" --arg session_id "$CI_AGENT_SESSION_ID" \
                  '{input:$input, stream:false, store:false, agent_session_id:$session_id}' \
                  > /tmp/req-${turn}.json
                http_code=$(curl -sS -D /tmp/invoke-headers-${turn}.txt \
                  -o /tmp/invoke-raw-${turn}.json -w "%{http_code}" \
                  -X POST "$AGENT_RESPONSES_URL" \
                  -H "Authorization: Bearer $AAD_TOKEN" \
                  -H "Content-Type: application/json" \
                  -H "x-agent-version-override: $DEPLOYED_AGENT_VERSION" \
                  --max-time 300 \
                  --data @/tmp/req-${turn}.json)
                # Extract assistant text & conversation id; fall back to raw JSON.
                if [ "$http_code" = "200" ] || [ "$http_code" = "201" ]; then
                  ASSISTANT_TEXT=$(jq -r '
                    [.output[]? | select(.type=="message") | .content[]? | select(.type=="output_text") | .text]
                    | join("\n")' /tmp/invoke-raw-${turn}.json 2>/dev/null)
                  {
                    echo "HTTP $http_code"
                    echo "--- Agent response ---"
                    if [ -n "$ASSISTANT_TEXT" ] && [ "$ASSISTANT_TEXT" != "null" ]; then
                      echo "$ASSISTANT_TEXT"
                    else
                      echo "(no assistant text in response — full body:)"
                      cat /tmp/invoke-raw-${turn}.json
                    fi
                    echo "--- end response ---"
                  } > /tmp/invoke-out-${turn}.txt
                  turn_exit=0
                else
                  {
                    echo "HTTP $http_code"
                    cat /tmp/invoke-raw-${turn}.json
                  } > /tmp/invoke-out-${turn}.txt
                  turn_exit=1
                fi
              else
                # The explicit create step already bound this session to the
                # deployed version; azd rejects --version with --session-id.
                azd ai agent invoke -p "$PROTOCOL" -f "$TURN_FILE" \
                  --session-id "$CI_AGENT_SESSION_ID" --no-prompt \
                  > /tmp/invoke-out-${turn}.txt 2>&1
                turn_exit=$?
              fi
              quota_error_files=(/tmp/invoke-out-${turn}.txt)
              if [ "$PROTOCOL" = "responses" ]; then
                quota_error_files+=(/tmp/invoke-headers-${turn}.txt /tmp/invoke-raw-${turn}.json)
              fi
              if [ $turn_exit -ne 0 ] && hosted_agent_is_session_quota_error "${quota_error_files[@]}"; then
                if [ $quota_retries -ge "$HOSTED_AGENT_QUOTA_MAX_RETRIES" ]; then
                  echo "::warning::Turn $turn exhausted $HOSTED_AGENT_QUOTA_MAX_RETRIES session quota retries"
                  turn_exit=1
                  break
                fi
                quota_retries=$((quota_retries + 1))
                quota_delay=$(hosted_agent_quota_retry_delay)
                echo "::warning::Turn $turn request $request_attempt hit session quota; retry $quota_retries/$HOSTED_AGENT_QUOTA_MAX_RETRIES in ${quota_delay}s"
                sleep "$quota_delay"
                continue
              fi
              # Model throttling can surface either as an HTTP 429 or inside a
              # successful transport response, so inspect all captured output.
              if hosted_agent_is_model_throttle_error "${quota_error_files[@]}"; then
                if [ $model_throttle_retries -ge $max_model_throttle_retries ]; then
                  echo "::warning::Turn $turn exhausted $max_model_throttle_retries model-throttle retries"
                  model_throttle_exhausted=true
                  turn_exit=1
                  break
                fi
                model_throttle_retries=$((model_throttle_retries + 1))
                model_throttle_delay=$(hosted_agent_model_retry_delay "$model_throttle_backoff" "${quota_error_files[@]}")
                echo "::warning::Turn $turn request $request_attempt hit model throttling; retry $model_throttle_retries/$max_model_throttle_retries in ${model_throttle_delay}s"
                sleep "$model_throttle_delay"
                model_throttle_backoff=$((model_throttle_backoff * 2))
                continue
              fi
              if [ $turn_exit -eq 0 ]; then
                # Even on HTTP 200, the response may contain a transient
                # platform error (status:failed + error.code:server_error)
                # or a model hallucination (the toolbox tool was not
                # actually called). Both are worth one more invoke attempt
                # before giving up — the model is non-deterministic and the
                # platform sometimes returns a single-shot 500. We re-use
                # the SAME hallucination pattern as the post-loop validator
                # so the per-turn retry decision matches it exactly.
                _retry_reason=""
                if grep -qiE '"status"[[:space:]]*:[[:space:]]*"failed"|"code"[[:space:]]*:[[:space:]]*"server_error"|invalid_payload|internal server error occurred' /tmp/invoke-out-${turn}.txt; then
                  _retry_reason="HTTP 200 body carries a platform error"
                elif [ "${{ matrix.is_toolbox }}" = "true" ] && grep -qiE "(I don.t have access to real|I cannot access|I don.t have real-time|unable to retrieve|couldn.t retrieve|I do not have access to real|wasn.t able to retrieve|was not able to retrieve|temporary issue accessing|appears there was a temporary issue|please upload|if you have a document or file|fictional (company|organization)|is not a real (company|organization)|likely because the repository is private|don.t have permission to view)" /tmp/invoke-out-${turn}.txt; then
                  _retry_reason="model hallucinated instead of calling the toolbox tool"
                fi
                if [ -z "$_retry_reason" ]; then
                  break
                fi
                if [ $transient_attempt -ge $max_transient_attempts ]; then
                  echo "::warning::Turn $turn transient attempt $transient_attempt: $_retry_reason; out of retries"
                  break
                fi
                echo "::warning::Turn $turn transient attempt $transient_attempt: $_retry_reason; retrying in ${backoff}s"
                sleep "$backoff"
                backoff=$((backoff * 2))
                transient_attempt=$((transient_attempt + 1))
                continue
              fi
              if [ $transient_attempt -ge $max_transient_attempts ]; then
                break
              fi
              # Retry transient readiness (424) and AAD role-propagation
              # races (500 + PermissionDenied on storage/history) that can
              # occur right after a fresh role grant on the agent identity.
              # Also retry generic platform 500s ("server_error" / "internal
              # server error") and toolbox-MCP 401s — the latter can occur
              # while a freshly-granted Foundry User role propagates to the
              # MCP gateway's auth cache. The HTTP/2 "stream ... CANCEL"
              # signal is a transient server-side stream reset (observed
              # mid-invoke on the invocations protocol) and is also retried.
              if grep -qiE "session_not_ready|status[ _]?code[: ]+424|HTTP 424|readiness|PermissionDenied|Principal does not have access|still being provisioned|version is still being|\"code\"[[:space:]]*:[[:space:]]*\"server_error\"|internal server error occurred|401 Unauthorized|stream error.*CANCEL|received from peer|connection reset by peer|EOF while reading response" /tmp/invoke-out-${turn}.txt; then
                echo "::warning::Turn $turn transient attempt $transient_attempt hit transient error; retrying in ${backoff}s"
                sleep "$backoff"
                backoff=$((backoff * 2))
                transient_attempt=$((transient_attempt + 1))
                continue
              fi
              break
            done
            cat /tmp/invoke-out-${turn}.txt
            [ $turn_exit -ne 0 ] && overall_exit=$turn_exit
            [ "$model_throttle_exhausted" = "true" ] && break
          done < "$PAYLOAD_FILE"

          echo ""
          echo "┌──────────────────────────────────────────┐"
          echo "│ Turns: $turn  |  Overall exit: $overall_exit"
          echo "└──────────────────────────────────────────┘"

          # Validate using the last turn's output as the representative response.
          response=$(cat /tmp/invoke-out-${turn}.txt 2>/dev/null)

          if [ $overall_exit -ne 0 ]; then
            echo "::error::Agent invocation failed (exit: $overall_exit)"
            exit 1
          fi

          if [ -z "$response" ]; then
            echo "::error::Empty response from agent"
            exit 1
          fi

          # Narrow error pattern — avoids false positives on normal prose.
          #   "error":  / "errors":  → JSON error payloads, but ONLY when
          #                          the value is a string or object —
          #                          "error": null is success, not failure.
          #   Traceback              → Python stack traces
          #   ^ERROR:                → CLI-style error prefixes
          #   ^##[error]             → GitHub Actions error annotations
          #   plus natural-language failure phrases (cancelled / unhandled / retry / etc)
          # Skip for github-copilot sample — its non-deterministic output may legitimately match these.
          if [[ "${{ matrix.path }}" != *"github-copilot"* ]]; then
            # NOTE: '"error"[[:space:]]*:[[:space:]]*("|\{)' catches JSON
            # error objects/strings; ''\''error''\''[[:space:]]*:'
            # catches Python-dict-style payloads embedded inside the
            # invocations protocol's streamed tokens (e.g. 'Error calling
            # model: ... {''error'': {''message'':...}}'), which would
            # otherwise slip past the error filter. The ("|\{) guard is
            # critical: the Responses API returns "error": null on success,
            # which a bare "error"[[:space:]]*: pattern would falsely flag.
            if echo "$response" | grep -qiE '("error"[[:space:]]*:[[:space:]]*("|\{)|"errors"[[:space:]]*:[[:space:]]*\[|'\''error'\''[[:space:]]*:[[:space:]]*["{\[]|\bTraceback\b|^ERROR:|^\#\#\[error\]|Error calling model:|invalid_request_error|I encountered an error|request was cancelled|unhandled errors|Please retry|Failed to process request)'; then
              echo "::error::Agent returned an error response"
              echo "--- response ---"; echo "$response"; echo "--- end response ---"
              exit 1
            fi
          else
            echo "⚠️  Skipping error-pattern check for github-copilot sample (non-deterministic output)"
          fi

          # Toolbox samples: detect tool-call hallucination. When the model
          # answers from training data without invoking the toolbox we get
          # phrases like "I don't have access to real-time". These mean the
          # toolbox tool was not actually called and the job should fail.
          # Note: matches use case-insensitive and accept curly/straight quotes
          # by allowing both `.` and the unicode apostrophe in the patterns.
          if [ "${{ matrix.is_toolbox }}" = "true" ]; then
            if echo "$response" | grep -qiE "(I don.t have access to real|I cannot access|I don.t have real-time|unable to retrieve|couldn.t retrieve|I do not have access to real|wasn.t able to retrieve|was not able to retrieve|temporary issue accessing|appears there was a temporary issue|please upload|if you have a document or file|fictional (company|organization)|is not a real (company|organization)|likely because the repository is private|don.t have permission to view)"; then
              echo "::error::Agent did not call the toolbox tool (hallucinated answer from training data)"
              echo "--- response ---"; echo "$response"; echo "--- end response ---"
              exit 1
            fi
          fi

          # Save raw response into artifact for inspection.
          mkdir -p /tmp/agent-response
          echo "$response" > /tmp/agent-response/response.txt

          # Echo-agent: verify the message was echoed back.
          if [ "${{ matrix.name }}" = "echo-agent" ]; then
            if echo "$response" | grep -qi "hello"; then
              echo "✅ Echo agent responded correctly"
            else
              echo "::error::Echo agent did not echo back the message"
              exit 1
            fi
          fi

          echo "✅ Agent responded successfully ($turn turn(s), protocol: $PROTOCOL)"
        timeout-minutes: 15

      # ── Validate: content-safety guardrail block ────────────────────
      # Genuine guardrail test for the content-safety sample: a benign prompt
      # must succeed (HTTP 200) and a policy-violating prompt must be BLOCKED
      # at the input stage (HTTP 400 + "code":"content_filter"). The violating
      # prompt is NOT committed; it lives in the CONTENT_SAFETY_TEST_PROMPT repo
      # variable so no harmful text enters the repo. The step is a clean no-op
      # when that variable is unset, so the sample's CI stays green until the
      # variable is provisioned. The guardrail is fail-open (a transient AACS
      # outage lets content through), so the violating turn is retried.
      - name: Guardrail block test (${{ matrix.name }})
        if: contains(matrix.path, 'content-safety-guardrail') && matrix.protocol == 'responses'
        working-directory: /tmp/ci-${{ matrix.combo_id }}
        env:
          GUARDRAIL_TRIGGER: ${{ vars.CONTENT_SAFETY_TEST_PROMPT }}
        run: |
          set -uo pipefail
          source "${{ github.workspace }}/.github/scripts/hosted-agent-retry.sh"
          if [ -z "${GUARDRAIL_TRIGGER:-}" ]; then
            echo "CONTENT_SAFETY_TEST_PROMPT repo variable is not set — skipping the"
            echo "guardrail block test. Set it to a policy-violating prompt to enable"
            echo "an end-to-end block assertion for this sample."
            exit 0
          fi
          AGENT_RESPONSES_URL=$(azd ai agent show --no-prompt --output json 2>/dev/null \
            | jq -r '.agent_endpoints.responses // empty')
          if [ -z "$AGENT_RESPONSES_URL" ]; then
            echo "::error::Could not resolve agent responses endpoint from 'azd ai agent show'"
            exit 1
          fi
          AAD_TOKEN=$(az account get-access-token --resource https://ai.azure.com --query accessToken -o tsv)

          # 1) Benign prompt must be allowed through (proves the agent works with
          #    a policy attached and the guardrail does not over-block).
          jq -n --arg session_id "$CI_AGENT_SESSION_ID" \
            '{input:"Write a short friendly hello message.", stream:false, store:false, agent_session_id:$session_id}' \
            > /tmp/gr-benign.json
          quota_retries=0
          while :; do
            benign_code=$(curl -sS -D /tmp/gr-benign-headers.txt \
              -o /tmp/gr-benign-out.json -w '%{http_code}' \
              -X POST "$AGENT_RESPONSES_URL" \
              -H "Authorization: Bearer $AAD_TOKEN" -H 'Content-Type: application/json' \
              --max-time 300 --data @/tmp/gr-benign.json)
            echo "Benign prompt → HTTP $benign_code"
            if [ "$benign_code" = "200" ] || [ "$benign_code" = "201" ]; then
              break
            fi
            if ! hosted_agent_is_session_quota_error /tmp/gr-benign-headers.txt /tmp/gr-benign-out.json \
                || [ $quota_retries -ge "$HOSTED_AGENT_QUOTA_MAX_RETRIES" ]; then
              break
            fi
            quota_retries=$((quota_retries + 1))
            quota_delay=$(hosted_agent_quota_retry_delay)
            echo "::warning::Benign prompt hit session quota; retry $quota_retries/$HOSTED_AGENT_QUOTA_MAX_RETRIES in ${quota_delay}s"
            sleep "$quota_delay"
          done
          if [ "$benign_code" != "200" ] && [ "$benign_code" != "201" ]; then
            echo "::error::Benign prompt was not allowed (HTTP $benign_code) — guardrail over-blocking?"
            cat /tmp/gr-benign-out.json
            exit 1
          fi

          # 2) Violating prompt must be blocked at the input stage. The agents
          #    runtime returns HTTP 400 with {"error":{"code":"content_filter",...}}.
          #    Retry to absorb transient fail-open behavior (AACS unavailable).
          jq -n --arg p "$GUARDRAIL_TRIGGER" --arg session_id "$CI_AGENT_SESSION_ID" \
            '{input:$p, stream:false, store:false, agent_session_id:$session_id}' > /tmp/gr-block.json
          attempt=0; max_attempts=3; backoff=15; blocked=0; quota_retries=0
          while [ $attempt -lt $max_attempts ]; do
            block_code=$(curl -sS -D /tmp/gr-block-headers.txt \
              -o /tmp/gr-block-out.json -w '%{http_code}' \
              -X POST "$AGENT_RESPONSES_URL" \
              -H "Authorization: Bearer $AAD_TOKEN" -H 'Content-Type: application/json' \
              --max-time 300 --data @/tmp/gr-block.json)
            if hosted_agent_is_session_quota_error /tmp/gr-block-headers.txt /tmp/gr-block-out.json; then
              if [ $quota_retries -ge "$HOSTED_AGENT_QUOTA_MAX_RETRIES" ]; then
                echo "::warning::Violating prompt exhausted $HOSTED_AGENT_QUOTA_MAX_RETRIES session quota retries"
                break
              fi
              quota_retries=$((quota_retries + 1))
              quota_delay=$(hosted_agent_quota_retry_delay)
              echo "::warning::Violating prompt hit session quota; retry $quota_retries/$HOSTED_AGENT_QUOTA_MAX_RETRIES in ${quota_delay}s"
              sleep "$quota_delay"
              continue
            fi
            attempt=$((attempt + 1))
            echo "Violating prompt attempt $attempt → HTTP $block_code"
            if [ "$block_code" = "400" ] && grep -q '"code"[[:space:]]*:[[:space:]]*"content_filter"' /tmp/gr-block-out.json; then
              blocked=1; break
            fi
            if [ $attempt -lt $max_attempts ]; then
              echo "::warning::attempt $attempt did not block (HTTP $block_code) — possible fail-open; retrying in ${backoff}s"
              sleep "$backoff"; backoff=$((backoff * 2))
            fi
          done
          if [ "$blocked" != "1" ]; then
            echo "::error::Guardrail did NOT block the violating prompt (last HTTP $block_code)."
            echo "--- response ---"; cat /tmp/gr-block-out.json; echo; echo "--- end response ---"
            echo "Confirm the policy referenced by rai_policy_name blocks the configured"
            echo "category/severity, and that CONTENT_SAFETY_TEST_PROMPT actually violates it."
            exit 1
          fi
          echo "✅ Guardrail blocked the violating prompt at input stage (HTTP 400 content_filter)"
        timeout-minutes: 10

      # ── Validate: Voice Live smoke test ───────────────────────────────
      - name: Voice Live smoke test (${{ matrix.name }})
        if: matrix.voiceLive == true
        working-directory: /tmp/ci-${{ matrix.combo_id }}
        run: |
          echo "══════════════════════════════════════════"
          echo "  Voice Live E2E: ${{ matrix.name }}"
          echo "══════════════════════════════════════════"
          # Wait a bit for the agent to be fully ready before running the smoke test — observed transient failures when the test hits the agent too quickly after deploy.
          echo "Waiting 5s for agent to be fully ready before starting Voice Live smoke test..."
          sleep 5
          # Derive Voice Live endpoint from AZURE_AI_PROJECT_ENDPOINT (scheme + host)
          VOICE_LIVE_ENDPOINT=$(echo "${{ vars.AZURE_AI_PROJECT_ENDPOINT }}" | sed 's|^\(https\?://[^/]*\).*|\1|')
          echo "Voice Live endpoint: $VOICE_LIVE_ENDPOINT"
          pip install -q "azure-ai-voicelive[aiohttp]==1.3.0b1" azure-identity
          set +e
          python "${{ github.workspace }}/internal/tools/voicelive-e2e/voicelive_audio_smoke_test.py" \
            --endpoint "$VOICE_LIVE_ENDPOINT" \
            --agent-name "$AGENT_NAME" \
            --project-name "${{ vars.AZURE_AI_PROJECT_NAME }}" \
            2>&1 | tee /tmp/voicelive-smoke-test.log
          test_exit=${PIPESTATUS[0]}
          echo ""
          if [ $test_exit -eq 0 ]; then
            echo "✅ Voice Live smoke test PASSED"
          else
            echo "::error::Voice Live smoke test FAILED (exit: $test_exit)"
            exit $test_exit
          fi
        timeout-minutes: 20

      # ── Validate: status ─────────────────────────────────────────────
      - name: Check agent status
        if: always()
        working-directory: /tmp/ci-${{ matrix.combo_id }}
        run: |
          azd ai agent show --no-prompt -o json 2>&1 | tee /tmp/agent-status.txt
          echo "✅ Agent status retrieved"
        timeout-minutes: 3

      # ── Validate: monitoring and per-sample assertions ───────────────
      - name: Check agent logs and feature assertions
        if: always()
        working-directory: /tmp/ci-${{ matrix.combo_id }}
        env:
          TOOLBOX_LABEL: ${{ matrix.toolbox_label }}
        run: |
          set -o pipefail
          sample_lang=$(echo "${{ matrix.path }}" | awk -F/ '{print $2}')
          sample_name=$(basename "${{ matrix.path }}")
          assertions_file="${{ github.workspace }}/internal/tools/samples-hosted-agents/$sample_lang/${{ matrix.protocol }}/$sample_name/test-assertions.yml"
          report_file="/tmp/agent-assertions-${{ matrix.combo_id }}.json"
          resolved_file="/tmp/resolved-assertions-${{ matrix.combo_id }}.json"
          console_log="/tmp/agent-console-${{ matrix.combo_id }}.txt"
          system_log="/tmp/agent-system-${{ matrix.combo_id }}.txt"
          evidence_log="/tmp/agent-log-evidence-${{ matrix.combo_id }}.txt"

          has_assertions=false
          if [ -f "$assertions_file" ]; then
            yq -o=json "$assertions_file" > "$resolved_file"
            has_assertions=true
          else
            echo "No test-assertions.yml for this sample; existing smoke validation applies."
          fi

          # The hosted log service can surface application stderr through either
          # monitor stream, and fresh session logs are eventually consistent.
          # Fetch both streams into one evidence snapshot. Retry only when every
          # failed assertion depends on delayed log evidence; response failures
          # are semantic and are never retried.
          collect_session_logs() {
            local attempt="$1"
            echo "Using session: $CI_AGENT_SESSION_ID"
            echo ""
            echo "=== Console Logs (attempt $attempt) ==="
            if ! azd ai agent monitor --type console --session-id "$CI_AGENT_SESSION_ID" --tail 300 --no-prompt 2>&1 \
                | tee "$console_log"; then
              echo "(no console logs available)"
            fi
            echo ""
            echo "=== System Event Logs (attempt $attempt) ==="
            if ! azd ai agent monitor --type system --session-id "$CI_AGENT_SESSION_ID" --tail 300 --no-prompt 2>&1 \
                | tee "$system_log"; then
              echo "(no system logs available)"
            fi
            : > "$evidence_log"
            for log_file in "$console_log" "$system_log"; do
              [ -f "$log_file" ] && cat "$log_file" >> "$evidence_log"
            done
          }

          max_evidence_attempts=3
          backoff=30
          attempt=1
          while [ "$attempt" -le "$max_evidence_attempts" ]; do
            collect_session_logs "$attempt"

            if [ "$has_assertions" != "true" ]; then
              echo "✅ Agent monitoring check completed"
              exit 0
            fi

            validator_args=(
              --assertions-json "$resolved_file"
              --toolbox-label "$TOOLBOX_LABEL"
              --response-template '/tmp/invoke-out-{turn}.txt'
              --console-log "$evidence_log"
              --report "$report_file"
            )
            [ "$attempt" -lt "$max_evidence_attempts" ] && validator_args+=(--no-annotations)

            set +e
            python3 "${{ github.workspace }}/.github/scripts/validate-hosted-agent-assertions.py" \
              "${validator_args[@]}"
            validation_exit=$?
            set -e
            [ "$validation_exit" -eq 0 ] && exit 0

            retryable=$(jq -r '
              .status == "failed" and
              ([.assertions[] | select(.status == "failed")] | length > 0) and
              ([.assertions[] | select(.status == "failed") | .source] | all(. == "console_log"))
            ' "$report_file")
            if [ "$retryable" != "true" ]; then
              # Re-run once with annotations enabled so the semantic/schema
              # failure is visible in the Actions summary.
              python3 "${{ github.workspace }}/.github/scripts/validate-hosted-agent-assertions.py" \
                --assertions-json "$resolved_file" \
                --toolbox-label "$TOOLBOX_LABEL" \
                --response-template '/tmp/invoke-out-{turn}.txt' \
                --console-log "$evidence_log" \
                --report "$report_file"
              exit $?
            fi

            if [ "$attempt" -eq "$max_evidence_attempts" ]; then
              exit "$validation_exit"
            fi

            echo "Console-log evidence is not available yet (attempt $attempt/$max_evidence_attempts)."
            echo "Waiting ${backoff}s before refreshing the bounded log snapshots."
            sleep "$backoff"
            backoff=$((backoff * 2))
            attempt=$((attempt + 1))
          done
        timeout-minutes: 5

      # ── Cleanup: delete session ───────────────────────────────────────────
      - name: Delete agent session
        if: always()
        working-directory: /tmp/ci-${{ matrix.combo_id }}
        continue-on-error: true
        run: |
          echo "Deleting session: $CI_AGENT_SESSION_ID"
          azd ai agent sessions delete "$CI_AGENT_SESSION_ID" --no-prompt 2>&1 \
            || echo "(session was not created or could not be deleted; continuing)"
        timeout-minutes: 3

      # ── Cleanup: delete cell-owned toolboxes ─────────────────────────
      # Cleanup is intentionally gating: a completed cell must not report a
      # passing validation result while leaking a toolbox. The next-run orphan
      # janitor is reserved for hard cancellation or runner loss.
      - name: Delete temporary toolboxes
        if: always()
        run: |
          if [ ! -f "$CI_TOOLBOX_STATE_FILE" ] || [ "$(jq '.toolboxes | length' "$CI_TOOLBOX_STATE_FILE")" -eq 0 ]; then
            echo "No cell-owned toolboxes to delete."
            jq -n '{operation:"cell",results:[]}' > "$CI_TOOLBOX_CLEANUP_RESULT"
            exit 0
          fi
          WORK_DIR="/tmp/ci-${{ matrix.combo_id }}"
          if [ ! -d "$WORK_DIR" ]; then
            echo "::error::Toolbox state exists but azd working directory is missing: $WORK_DIR"
            exit 1
          fi
          cd "$WORK_DIR"
          ENDPOINT="$(azd env get-value AZURE_AI_PROJECT_ENDPOINT)"
          "${{ github.workspace }}/.github/scripts/cleanup-hosted-agent-ci-toolboxes.sh" \
            cell "$CI_TOOLBOX_STATE_FILE" "$ENDPOINT" "$CI_TOOLBOX_CLEANUP_RESULT"
        timeout-minutes: 5

      # ── Write explicit status file ───────────────────────────────────
      - name: Write status file
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "success" > /tmp/result.txt
          else
            echo "failure" > /tmp/result.txt
          fi
          echo "Sample: ${{ matrix.name }}" >> /tmp/result.txt
          echo "Toolbox: ${{ matrix.toolbox_label }}" >> /tmp/result.txt
          echo "ID: ${{ matrix.combo_id }}" >> /tmp/result.txt

      # ── Upload results ───────────────────────────────────────────────
      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-e2e-results-${{ matrix.combo_id }}
          path: |
            /tmp/agent-status.txt
            /tmp/agent-console-${{ matrix.combo_id }}.txt
            /tmp/agent-system-${{ matrix.combo_id }}.txt
            /tmp/agent-log-evidence-${{ matrix.combo_id }}.txt
            /tmp/resolved-assertions-${{ matrix.combo_id }}.json
            /tmp/agent-assertions-${{ matrix.combo_id }}.json
            /tmp/result.txt
            /tmp/agent-response/response.txt
            /tmp/voicelive-smoke-test.log
            ${{ env.CI_TOOLBOX_STATE_FILE }}
            ${{ env.CI_TOOLBOX_DEPLOY_RESULT }}
            ${{ env.CI_TOOLBOX_CLEANUP_RESULT }}
          if-no-files-found: ignore

      # ── Publish validation commit status (D5 canary) ─────────────────
      # Posts a GitHub commit status under the External Validation Contract
      # (docs/validation-results-contract.md). The sync gate consumes these
      # on `main` SHAs; PR/manual posts are advisory.
      #
      # Canary scope: only the single sample below until one clean daily
      # run on `main` posts `success`. Widen by removing the `matrix.path`
      # check.
      - name: Publish validation status
        if: always() && job.status != 'cancelled' && inputs.publish_validation_statuses && matrix.path == 'samples/python/hosted-agents/agent-framework/responses/01-basic'
        uses: actions/github-script@v7
        with:
          script: |
            const samplePath = '${{ matrix.path }}';
            const jobStatus = '${{ job.status }}';
            const state = jobStatus === 'success' ? 'success' : 'failure';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const sha = context.payload.pull_request
              ? context.payload.pull_request.head.sha
              : context.sha;
            const ctx = `validation/hosted-agents-e2e/${samplePath}`;

            core.info(`Posting ${state} to ${ctx} on ${sha}`);
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state,
              context: ctx,
              target_url: runUrl,
              description: state === 'success' ? 'Cloud E2E passed' : 'Cloud E2E failed',
            });

      # ── Teardown (only when provision created resources) ─────────────
      - name: Teardown Azure resources
        if: always() && vars.SKIP_PROVISION != 'true'
        working-directory: /tmp/ci-${{ matrix.combo_id }}
        run: |
          echo "Tearing down azd environment: $AZD_ENV_NAME"
          if ! azd down --force --purge --no-prompt 2>&1; then
            echo "::warning::azd down failed — resources may need manual cleanup"
            echo "::warning::Environment: $AZD_ENV_NAME"
          fi
        timeout-minutes: 10
