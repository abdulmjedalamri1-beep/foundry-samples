# Tier 2: Cloud E2E Tests (azd-based)
#
# Uses Azure Developer CLI (azd) to deploy agents and validate the full
# hosted-agent lifecycle against real Azure resources.
#
# Covers Loop scenarios: S01 (Init/Scaffold), S02 (Deploy), S04 (Remote Invoke),
# S05 (Status), S06 (Logs/Monitoring).
#
# Infrastructure modes:
#   - SKIP_PROVISION=true (default): Uses an existing Foundry project.
#     Requires AZURE_AI_PROJECT_ENDPOINT, AZURE_RESOURCE_GROUP,
#     AZURE_AI_ACCOUNT_NAME, AZURE_AI_PROJECT_NAME, AZURE_CONTAINER_REGISTRY_ENDPOINT.
#   - SKIP_PROVISION=false: azd provision creates all resources from scratch.
#
# Teardown: infrastructure teardown only runs when SKIP_PROVISION=false. Cell-owned
# temporary toolboxes are always deleted after validation; stale CI toolboxes are
# reclaimed at the beginning of a later run.
name: Hosted Agents Cloud E2E

on:
  pull_request:
    branches: [ main ]
    paths:
      - "samples/python/hosted-agents/**"
      - "samples/csharp/hosted-agents/**"
      - ".github/workflows/hosted-agents-cloud-e2e.yml"
      - ".github/workflows/hosted-agents-cloud-e2e-runner.yml"
      - ".github/scripts/prepare-hosted-agent-ci-toolboxes.sh"
      - ".github/scripts/cleanup-hosted-agent-ci-toolboxes.sh"
      - ".github/scripts/hosted-agent-retry.sh"
      - ".github/scripts/retry-azure-oidc-login.sh"
      - ".github/scripts/hosted_agent_fixture.py"
      - ".github/scripts/hosted_agent_test_spec.py"
      - ".github/scripts/invoke_hosted_agent_responses.py"
      - ".github/scripts/collect-hosted-agent-traces.py"
      - ".github/tests/test-hosted-agent-ci-toolboxes.sh"
      - ".github/tests/test-hosted-agent-session-quota.sh"
      - ".github/tests/test-retry-azure-oidc-login.sh"
      - ".github/tests/test_hosted_agent_fixture.py"
      - ".github/tests/test_hosted_agent_test_spec.py"
      - "internal/tools/samples-hosted-agents/**"
  push:
    branches: [ main ]
    paths:
      - "samples/python/hosted-agents/**"
      - "samples/csharp/hosted-agents/**"
      - ".github/workflows/hosted-agents-cloud-e2e.yml"
      - ".github/workflows/hosted-agents-cloud-e2e-runner.yml"
      - ".github/scripts/prepare-hosted-agent-ci-toolboxes.sh"
      - ".github/scripts/cleanup-hosted-agent-ci-toolboxes.sh"
      - ".github/scripts/hosted-agent-retry.sh"
      - ".github/scripts/retry-azure-oidc-login.sh"
      - ".github/scripts/hosted_agent_fixture.py"
      - ".github/scripts/hosted_agent_test_spec.py"
      - ".github/scripts/invoke_hosted_agent_responses.py"
      - ".github/scripts/collect-hosted-agent-traces.py"
      - ".github/tests/test-hosted-agent-ci-toolboxes.sh"
      - ".github/tests/test-hosted-agent-session-quota.sh"
      - ".github/tests/test-retry-azure-oidc-login.sh"
      - ".github/tests/test_hosted_agent_fixture.py"
      - ".github/tests/test_hosted_agent_test_spec.py"
      - "internal/tools/samples-hosted-agents/**"
  schedule:
    # Daily regression run at 08:00 UTC against main.
    # Catches platform-side regressions even when no code changes are made.
    - cron: "0 9 * * *"
  workflow_dispatch:
    inputs:
      sample_filter:
        description: >-
          Substring filter (case-insensitive) matched against
          combo_id/path/name. Comma-separated = OR (match any). Empty = full
          matrix. A full combo_id runs one case; comma-join two combo_ids to
          run just those two; a shared substring (e.g. 'code-interpreter')
          runs every matching combo.
        required: false
        type: string
        default: ""

concurrency:
  group: hosted-agents-cloud-e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  id-token: write # OIDC token for az login
  contents: read
  statuses: write # Publish per-sample validation commit statuses (D5; see docs/validation-results-contract.md)

env:
  AZURE_LOCATION: northcentralus

jobs:
  # ── Discover all samples ──────────────────────────────────────────
  discover-samples:
    name: Discover Samples
    runs-on: ubuntu-latest
    if: >-
      vars.CLOUD_E2E_ENABLED == 'true' && (github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.fork != true)
    outputs:
      # Combined matrix (all languages) — consumed by the summary job to
      # enumerate every sample regardless of shard.
      matrix: ${{ steps.find-samples.outputs.matrix }}
      # Per-language shards. Each is fed to a separate reusable-workflow
      # invocation so no single job matrix exceeds GitHub's 256-job cap.
      matrix_python: ${{ steps.find-samples.outputs.matrix_python }}
      matrix_csharp: ${{ steps.find-samples.outputs.matrix_csharp }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needed to get diff for PRs

      - name: Install hosted-agent test-spec dependency
        run: python3 -m pip install --disable-pip-version-check --quiet "PyYAML==6.0.2"

      - name: Test and validate hosted-agent test specs
        run: |
          python3 .github/tests/test_hosted_agent_fixture.py
          python3 .github/tests/test_hosted_agent_test_spec.py
          while IFS= read -r fixture; do
            sample_dir=$(python3 .github/scripts/hosted_agent_fixture.py sample-dir --fixture "$fixture")
            manifest="$sample_dir/azure.yaml"
            if [ ! -f "$manifest" ]; then
              echo "::error file=$fixture::Hosted-agent fixture does not map to a sample with azure.yaml: $sample_dir"
              exit 1
            fi
            if [ "$(basename "$fixture")" = "test-spec.yml" ]; then
              if [ "$(yq '[.services[] | select(.host == "azure.ai.agent") | .protocols[]?.protocol] | any_c(. == "invocations")' "$manifest")" = "true" ]; then
                protocol="invocations"
              else
                protocol="responses"
              fi
              python3 .github/scripts/hosted_agent_test_spec.py validate --spec "$fixture"
              python3 .github/scripts/hosted_agent_test_spec.py plan \
                --spec "$fixture" --protocol "$protocol" \
                --output /tmp/hosted-agent-test-spec-plan.json
            fi
          done < <(find internal/tools/samples-hosted-agents -type f \
            \( -name test-spec.yml -o -name test-payload.txt \) | sort)
          if find internal/tools/samples-hosted-agents -name test-assertions.yml -type f | grep -q .; then
            echo "::error::Legacy test-assertions.yml files must be migrated to test-spec.yml"
            exit 1
          fi

      - name: Test hosted-agent CI toolbox lifecycle scripts
        run: .github/tests/test-hosted-agent-ci-toolboxes.sh

      - name: Test hosted-agent session quota helpers
        run: .github/tests/test-hosted-agent-session-quota.sh

      - name: Test Azure OIDC login retry
        run: .github/tests/test-retry-azure-oidc-login.sh

      - name: Validate sample structure
        run: |
          # Each sample now carries a single unified azure.yaml (the project
          # manifest) at its root, plus its agent source under src/<agent>/.
          # (PR 601: azure.yaml replaces the legacy agent.yaml + agent.manifest.yaml.)
          echo "Checking all samples have azure.yaml with a matching src/<agent> directory..."
          errors=()
          while IFS= read -r f; do
            dir=$(dirname "$f")
            # Derive the agent service's source path from the azure.ai.agent
            # service's `project:` field (yq parses the YAML structurally).
            proj=$(yq '(.services[] | select(.host == "azure.ai.agent") | .project) // ""' "$f")
            if [ -z "$proj" ]; then
              errors+=("$dir: azure.yaml has no 'project: src/<agent>' entry")
            elif [ ! -d "$dir/$proj" ]; then
              errors+=("$dir: missing source directory '$proj'")
            fi
          done < <(find samples/python/hosted-agents samples/csharp/hosted-agents -name "azure.yaml" -type f 2>/dev/null | sort)
          # Deduplicate and report as warnings (validation enforced per matrix job)
          if [ ${#errors[@]} -gt 0 ]; then
            printf '%s\n' "${errors[@]}" | sort -u | while read -r err; do
              echo "::warning::$err"
            done
          else
            echo "✅ All samples have azure.yaml with a matching src/<agent> directory"
          fi

      - name: Find samples to test
        id: find-samples
        env:
          TOOLBOX_ENDPOINT_LIST: ${{ vars.TOOLBOX_ENDPOINT_NCUS }}
          CODE_DEPLOY_ENABLED: ${{ vars.CLOUD_E2E_CODE_DEPLOY_ENABLED }}
          SAMPLE_FILTER: ${{ inputs.sample_filter }}
        run: |
          # ── Parse TOOLBOX_ENDPOINT_NCUS repo variable into a list ──────
          # Format: one entry per line, "label=https://...|optional query text"
          # Used to expand toolbox samples into a cartesian product.
          toolboxes=()
          tb_index=0
          while IFS= read -r raw || [ -n "$raw" ]; do
            line=$(echo "$raw" | sed 's/^\xEF\xBB\xBF//' | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')
            [ -z "$line" ] && continue
            if echo "$line" | grep -q '|'; then
              urlpart=$(echo "$line" | sed 's/|.*//' | sed 's/[[:space:]]*$//')
              query=$(echo "$line" | sed 's/^[^|]*|//' | sed 's/^[[:space:]]*//')
            else
              urlpart="$line"
              query=""
            fi
            if echo "$urlpart" | grep -q '='; then
              label=$(echo "$urlpart" | cut -d= -f1 | sed 's/[[:space:]]*$//')
              url=$(echo "$urlpart" | cut -d= -f2- | sed 's/^[[:space:]]*//')
            else
              tb_index=$((tb_index + 1))
              if [ $tb_index -eq 1 ] && [ ${#toolboxes[@]} -eq 0 ]; then label="default"; else label="tb$tb_index"; fi
              url="$urlpart"
            fi
            [ -z "$url" ] && continue
            tb_json=$(jq -n --arg l "$label" --arg u "$url" --arg q "$query" '{label:$l, url:$u, query:$q}')
            toolboxes+=("$tb_json")
            echo "Toolbox: $label -> $url${query:+  (query: \"$query\")}"
          done <<< "$TOOLBOX_ENDPOINT_LIST"
          toolboxes_json=$(printf '%s\n' "${toolboxes[@]}" | jq -s -c '.')
          [ "$toolboxes_json" = "" ] && toolboxes_json="[]"

          # Helper: emit one or many matrix entries for a given sample.
          # - hosted-agents samples: single entry (combo_id = id, is_toolbox = false).
          # - toolbox samples: cartesian product over $toolboxes (combo_id = id-label).
          # ── deploy-mode axis ──────────────────────────────────────
          # Every sample is emitted twice — once with deploy_mode='container'
          # (today's path) and once with deploy_mode='code' (azd direct
          # code-deploy via `--deploy-mode code`). To disable the code arm
          # (e.g. azd extension outage), set repo var
          # CLOUD_E2E_CODE_DEPLOY_ENABLED=false. combo_id is suffixed with
          # the mode so artifact / env names stay unique.
          emit_entries() {
            local sample_dir="$1" agent_name="$2" sample_id="$3" protocol="$4"
            local is_toolbox="false"
            # Voice Live compatibility (from azure.yaml metadata or path) —
            # consumed downstream by `if: matrix.voiceLive == true` step. The
            # flag may live at the top level or on the azure.ai.agent service.
            local voice_live="false"
            local yaml_file="$sample_dir/azure.yaml"
            if { [ -f "$yaml_file" ] && [ "$(yq '((.voiceLiveCompatible // false) == true) or ((.services[] | select(.host == "azure.ai.agent") | .voiceLiveCompatible) == true)' "$yaml_file")" = "true" ]; } || echo "$sample_dir" | grep -q '/voicelive/'; then
              voice_live="true"
            fi
            # Toolbox samples now live exclusively under hosted-agents — match
            # any hosted-agents sample whose directory name contains "toolbox".
            case "$sample_dir" in
              samples/python/hosted-agents/*toolbox*|samples/csharp/hosted-agents/*toolbox*) is_toolbox="true" ;;
            esac
            # Toolbox samples use the default ncus project, so the matrix is
            # expanded from the TOOLBOX_ENDPOINT_NCUS repo variable.
            local use_westus2="false"

            # ─── language / runtime / deploy-mode axes ────────────────────────
            # `language`, `runtime`, `entry_point` are only meaningful for the
            # code arm but we emit them on every row so the matrix schema is
            # uniform (GitHub Actions matrix requires consistent keys).
            # entry_point is the file/dll (not the full command) — azd derives
            # the launcher from `runtime` (e.g. python_3_13 -> `python main.py`).
            #
            # Per-language classification (explicit allow-list — fails loudly
            # if a new language gets a hosted-agents/ subdir without us
            # noticing). Discovery `find` calls already only scan python and
            # csharp trees, but this guard prevents future mis-classification
            # if those paths get expanded.
            local language runtime entry_point
            local deploy_modes
            case "$sample_dir" in
              samples/python/hosted-agents/*)
                language="python"
                runtime="python_3_13"
                entry_point="main.py"
                # Python: validate both deployment surfaces (container +
                # code). All python samples run on python_3_13.
                deploy_modes='["container","code"]'
                ;;
              samples/csharp/hosted-agents/*)
                language="csharp"
                runtime="dotnet_10"
                # Prefer the manifest's authoritative code entry point. Fall
                # back to the project assembly only for older manifests.
                entry_point=$(yq -r '
                  .services[] | select(.host == "azure.ai.agent") |
                  .codeConfiguration.entryPoint // ""
                ' "$sample_dir/azure.yaml" | head -1)
                if [ -z "$entry_point" ]; then
                  local csproj asm
                  csproj=$(find "$sample_dir" -name "*.csproj" | head -1)
                  if [ -n "$csproj" ]; then
                    asm=$(grep -oE '<AssemblyName>[^<]+</AssemblyName>' "$csproj" \
                          | head -1 | sed -E 's|</?AssemblyName>||g')
                    [ -z "$asm" ] && asm=$(basename "$csproj" .csproj)
                  else
                    asm=$(basename "$sample_dir")
                  fi
                  entry_point="${asm}.dll"
                fi
                # C#: validate both deployment surfaces (container + code).
                # All hosted-agents csharp samples target net10.0 and ship
                # a Dockerfile based on mcr.microsoft.com/dotnet/{sdk,aspnet}:10.0,
                # which the Foundry container deploy path now supports.
                deploy_modes='["container","code"]'
                ;;
              *)
                echo "::error::emit_entries: unsupported language path '$sample_dir' — only samples/python/hosted-agents/* and samples/csharp/hosted-agents/* are wired into the code-deploy matrix." >&2
                return 1
                ;;
            esac
            # Per-sample code-compat override hook. Flip to "false" to drop the
            # code arm for an individual sample if a runtime/dep issue is
            # discovered. When flipped, the sample falls back to the
            # container-only arm.
            local code_compatible="true"

            # Per-sample code-deploy opt-out: drop a `.code-ci-skip` file in the
            # sample directory to skip just the code deploy arm while keeping
            # the container arm (cf. `.ci-skip`, which excludes the sample
            # entirely). NOTE: emit_entries' stdout is captured into the entries
            # array, so this diagnostic must go to stderr.
            if [ -f "$sample_dir/.code-ci-skip" ]; then
              echo "  - $sample_dir (code deploy skipped via .code-ci-skip — container-only)" >&2
              code_compatible="false"
            fi

            # Opt-out kill-switch: set repo var CLOUD_E2E_CODE_DEPLOY_ENABLED=false
            # to skip the code arm globally (e.g. during an azd extension
            # outage). Both python and csharp fall back to container-only.
            if [ "$CODE_DEPLOY_ENABLED" = "false" ] || [ "$code_compatible" != "true" ]; then
              deploy_modes='["container"]'
            fi
            # Dependency resolution mode for the code arm. Only meaningful when
            # deploy_mode='code'; empty for the container arm. We default to
            # remote_build (Foundry-side install via Oryx) which is what the
            # bug-bash wiki recommends for most samples; switch to 'bundled'
            # in a future matrix expansion if we want to validate that path too.
            local dep_resolution="remote_build"

            # Extract protocol version from azure.yaml (defaults to 1.0.0). Takes
            # the first matching protocol entry's version — same first-match
            # semantics as the previous grep|head -1, since a well-formed sample
            # declares each protocol at most once.
            local protocol_version
            protocol_version=$(protocol="$protocol" yq '[.services[] | select(.host == "azure.ai.agent") | .protocols[] | select(.protocol == strenv(protocol)) | .version] | .[0] // "1.0.0"' "$yaml_file")
            [ -z "$protocol_version" ] && protocol_version="1.0.0"

            if [ "$is_toolbox" = "true" ]; then
              if [ "$toolboxes_json" = "[]" ]; then
                echo "::warning::Skipping toolbox sample $sample_dir — TOOLBOX_ENDPOINT repo variable is empty" >&2
                return 0
              fi
              # Per-sample toolbox exclusions for known-broken combos. The
              # csharp foundry-toolbox-server-side and toolbox-auth-paths
              # samples trigger an 'invalid_payload' on /tools/0/container when
              # they hand a code_interpreter tool to the Responses API — this is
              # a serialization bug in the .NET Agent Framework SDK
              # (Microsoft.Agents.AI.Foundry.Hosting) that cannot be fixed
              # from this repo. Filter the combo out so the matrix doesn't
              # gate on a known upstream defect. TODO(hosted-agents): drop
              # this exclusion once the SDK fix ships.
              local filtered_toolboxes_json="$toolboxes_json"
              case "$sample_dir" in
                samples/csharp/hosted-agents/agent-framework/foundry-toolbox-server-side|samples/csharp/hosted-agents/agent-framework/toolbox-auth-paths)
                  # NOTE: emit_entries' stdout is captured into the entries
                  # array, so any diagnostic must go to stderr — otherwise
                  # the literal "::warning::..." line gets slurped by the
                  # downstream `jq -s '{include: .}'` and crashes parsing.
                  echo "::warning::Excluding csharp $sample_dir × code-interpreter combo: known .NET Agent Framework SDK bug serializes tools[].container as null where the Responses API requires a string. TODO(hosted-agents): drop this exclusion once the SDK fix ships." >&2
                  filtered_toolboxes_json=$(echo "$toolboxes_json" | jq -c 'map(select(.label != "code-interpreter" and .label != "foundry-iq-kb"))')
                  ;;
                samples/python/hosted-agents/agent-framework/responses/17-foundry-iq-toolbox)
                  # Unlike the generic toolbox relays, this sample is grounded on a
                  # specific Foundry IQ knowledge base: main.py instructs the agent to
                  # answer only from the knowledge base and otherwise say it doesn't
                  # know. Fanning it across the generic shared toolboxes (web-search,
                  # ms-learn, …) makes it correctly answer "I don't know" for queries
                  # that aren't in its KB. Pin it to the dedicated knowledge-base
                  # toolbox (label `foundry-iq-kb`, provisioned once via the README's
                  # azd flow) whose paired query matches the KB content, so the test
                  # exercises a real knowledge_base_retrieve call.
                  echo "::warning::Pinning $sample_dir to the foundry-iq-kb knowledge toolbox only (skipping generic toolbox combos)." >&2
                  filtered_toolboxes_json=$(echo "$toolboxes_json" | jq -c 'map(select(.label == "foundry-iq-kb"))')
                  if [ "$filtered_toolboxes_json" = "[]" ]; then
                    echo "::warning::Skipping $sample_dir — no 'foundry-iq-kb' entry found in the TOOLBOX_ENDPOINT_NCUS repo variable. Add 'foundry-iq-kb=<kb-mcp-endpoint>|<query>' to enable this sample's cloud e2e." >&2
                    return 0
                  fi
                  ;;
                *)
                  # The `foundry-iq-kb` toolbox is dedicated to the
                  # 17-foundry-iq-toolbox sample above (its paired query only
                  # matches that knowledge base's content). Exclude it from
                  # every other toolbox sample so adding it to the
                  # TOOLBOX_ENDPOINT_NCUS repo variable doesn't fan a
                  # guaranteed "I don't know" combo onto the generic relays.
                  filtered_toolboxes_json=$(echo "$toolboxes_json" | jq -c 'map(select(.label != "foundry-iq-kb"))')
                  ;;
              esac
              echo "$filtered_toolboxes_json" | jq -c \
                --arg id "$sample_id" --arg path "$sample_dir" --arg name "$agent_name" \
                --arg protocol "$protocol" --arg protocol_version "$protocol_version" \
                --arg use_westus2 "$use_westus2" \
                --arg language "$language" --arg runtime "$runtime" --arg entry_point "$entry_point" \
                --arg dep_resolution "$dep_resolution" \
                --argjson voiceLive "$voice_live" \
                --argjson deploy_modes "$deploy_modes" '
                .[] as $tb | $deploy_modes[] as $mode | {
                  id: $id, path: $path, name: $name, protocol: $protocol,
                  protocol_version: $protocol_version,
                  is_toolbox: "true",
                  toolbox_label: $tb.label, toolbox_url: $tb.url, toolbox_query: $tb.query,
                  use_westus2: $use_westus2,
                  voiceLive: $voiceLive,
                  deploy_mode: $mode,
                  language: $language, runtime: $runtime, entry_point: $entry_point,
                  dep_resolution: (if $mode == "code" then $dep_resolution else "" end),
                  combo_id: (
                    $id + "-" + $tb.label + "-" +
                    (if $mode == "code" then "code-" + $dep_resolution else "container" end)
                  )
                }'
            else
              echo "$deploy_modes" | jq -c \
                --arg id "$sample_id" --arg path "$sample_dir" --arg name "$agent_name" \
                --arg protocol "$protocol" --arg protocol_version "$protocol_version" \
                --arg use_westus2 "$use_westus2" \
                --arg language "$language" --arg runtime "$runtime" --arg entry_point "$entry_point" \
                --arg dep_resolution "$dep_resolution" \
                --argjson voiceLive "$voice_live" '
                .[] | {id: $id, path: $path, name: $name, protocol: $protocol,
                 protocol_version: $protocol_version,
                 is_toolbox: "false",
                 toolbox_label: "", toolbox_url: "", toolbox_query: "",
                 use_westus2: $use_westus2,
                 voiceLive: $voiceLive,
                 deploy_mode: .,
                 language: $language, runtime: $runtime, entry_point: $entry_point,
                 dep_resolution: (if . == "code" then $dep_resolution else "" end),
                 combo_id: ($id + "-" + (if . == "code" then "code-" + $dep_resolution else "container" end))}'
            fi
          }

          # ── Find candidate samples ────────────────────────────────────
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "PR detected - finding changed samples only"
            changed_files=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
            echo "Changed files:"
            echo "$changed_files"

            # Workflow and lifecycle-helper changes must exercise the real
            # matrix. Previously these changes triggered the workflow but the
            # changed-sample filter emitted an empty matrix, so runner changes
            # were never validated before merge.
            test_all="false"
            if echo "$changed_files" | grep -qE '^\.github/(workflows/hosted-agents-cloud-e2e(-runner)?\.yml|scripts/((prepare|cleanup)-hosted-agent-ci-toolboxes|hosted-agent-retry|retry-azure-oidc-login)\.sh|scripts/(hosted_agent_fixture|hosted_agent_test_spec|invoke_hosted_agent_responses|collect-hosted-agent-traces)\.py|tests/(test-hosted-agent-(ci-toolboxes|session-quota)|test-retry-azure-oidc-login)\.sh|tests/test_hosted_agent_(fixture|test_spec)\.py)$'; then
              test_all="true"
              echo "Hosted-agent E2E infrastructure changed — testing the full matrix"
            fi

            entries=()
            while IFS= read -r yaml_file; do
              sample_dir=$(dirname "$yaml_file")
              if [ -f "$sample_dir/.ci-skip" ]; then
                echo "  - $sample_dir (skipped - requires external credentials)"
                continue
              fi
              if [ "$(yq '[.services[] | select(.host == "azure.ai.agent") | .protocols[]?.protocol] | any_c(. == "invocations")' "$yaml_file")" = "true" ]; then
                protocol="invocations"
              else
                protocol="responses"
              fi
              fixture_dir=$(python3 .github/scripts/hosted_agent_fixture.py fixture-dir --sample-dir "$sample_dir")
              if [ "$test_all" = "true" ] || echo "$changed_files" | grep -qE "^(${sample_dir}|${fixture_dir})/"; then
                agent_name=$(yq '.name // ""' "$yaml_file")
                sample_id=$(echo "$sample_dir" | sed 's|samples/||' | tr '/' '-')
                while IFS= read -r entry; do
                  [ -n "$entry" ] && entries+=("$entry")
                done < <(emit_entries "$sample_dir" "$agent_name" "$sample_id" "$protocol")
                echo "  - $sample_dir (changed, protocol=$protocol)"
              fi
            done < <(find samples/python/hosted-agents samples/csharp/hosted-agents -name "azure.yaml" -type f 2>/dev/null | sort)

            if [ ${#entries[@]} -eq 0 ]; then
              echo "No sample changes detected - skipping E2E tests"
              echo "matrix={\"include\":[]}" >> "$GITHUB_OUTPUT"
              echo "matrix_python={\"include\":[]}" >> "$GITHUB_OUTPUT"
              echo "matrix_csharp={\"include\":[]}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          else
            echo "Push/schedule - testing all samples"
            entries=()
            while IFS= read -r yaml_file; do
              sample_dir=$(dirname "$yaml_file")
              if [ -f "$sample_dir/.ci-skip" ]; then
                echo "  - $sample_dir (skipped - requires external credentials)"
                continue
              fi
              agent_name=$(yq '.name // ""' "$yaml_file")
              sample_id=$(echo "$sample_dir" | sed 's|samples/||' | tr '/' '-')
              if [ "$(yq '[.services[] | select(.host == "azure.ai.agent") | .protocols[]?.protocol] | any_c(. == "invocations")' "$yaml_file")" = "true" ]; then
                protocol="invocations"
              else
                protocol="responses"
              fi
              while IFS= read -r entry; do
                [ -n "$entry" ] && entries+=("$entry")
              done < <(emit_entries "$sample_dir" "$agent_name" "$sample_id" "$protocol")
            done < <(find samples/python/hosted-agents samples/csharp/hosted-agents -name "azure.yaml" -type f 2>/dev/null | sort)
          fi

          # ── Optional single-case filter (workflow_dispatch) ───────────
          # When SAMPLE_FILTER is set, keep only matrix entries whose
          # combo_id, path, or name contains any of the comma-separated
          # tokens (case-insensitive, OR-matched). A filter with no comma is
          # a single token — identical to the previous single-substring
          # behavior — so existing one-case runs are unaffected. Comma lets a
          # manual run target several specific cases at once.
          if [ -n "$SAMPLE_FILTER" ]; then
            echo "Applying sample_filter: '$SAMPLE_FILTER'"
            filtered=()
            while IFS= read -r entry; do
              [ -n "$entry" ] && filtered+=("$entry")
            done < <(printf '%s\n' "${entries[@]}" | jq -c --arg f "$SAMPLE_FILTER" '
              ($f | ascii_downcase | split(",")
                 | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))) as $tokens
              | ((.combo_id + " " + .path + " " + .name) | ascii_downcase) as $hay
              | select(any($tokens[]; . as $t | $hay | contains($t)))')
            entries=("${filtered[@]}")
            if [ ${#entries[@]} -eq 0 ]; then
              echo "::warning::sample_filter '$SAMPLE_FILTER' matched no samples — emitting empty matrix"
            else
              echo "sample_filter matched ${#entries[@]} matrix entr(y/ies)"
            fi
          fi

          matrix=$(printf '%s\n' "${entries[@]}" | jq -s -c '{include: .}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          # Shard the matrix by language so each reusable-workflow invocation
          # stays under GitHub Actions' 256-jobs-per-matrix cap. emit_entries
          # only ever tags entries as python or csharp (it errors on anything
          # else), so these two shards are exhaustive.
          matrix_python=$(printf '%s\n' "${entries[@]}" | jq -s -c '{include: [.[] | select(.language == "python")]}')
          matrix_csharp=$(printf '%s\n' "${entries[@]}" | jq -s -c '{include: [.[] | select(.language == "csharp")]}')
          echo "matrix_python=$matrix_python" >> "$GITHUB_OUTPUT"
          echo "matrix_csharp=$matrix_csharp" >> "$GITHUB_OUTPUT"
          echo "Samples to test:"
          echo "$matrix" | jq .
          echo "python shard: $(echo "$matrix_python" | jq '.include | length') · csharp shard: $(echo "$matrix_csharp" | jq '.include | length')"

  # ── Reclaim toolboxes leaked by interrupted runs ──────────────────
  cleanup-orphaned-toolboxes:
    name: Cleanup Orphaned Toolboxes
    needs: discover-samples
    if: >-
      needs.discover-samples.outputs.matrix != '{"include":[]}'
    runs-on: ubuntu-latest
    # This is a safety net for hard cancellation/runner loss. Per-cell cleanup
    # remains strict; a transient janitor failure is visible but must not turn
    # every otherwise-independent matrix cell into a skipped result.
    continue-on-error: true
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: Azure/setup-azd@v2
      - name: Install azd Foundry extension
        run: azd ext install microsoft.foundry
      # Toolbox data-plane commands are scoped by --project-endpoint and use
      # the tenant token, so this login can clean CI projects in either
      # subscription when the service principal has project RBAC.
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Configure azd to use az CLI auth
        run: azd config set auth.useAzCliAuth true
      - name: Delete CI toolboxes older than 24 hours
        env:
          DEFAULT_PROJECT_ENDPOINT: ${{ vars.AZURE_AI_PROJECT_ENDPOINT }}
          TOOLBOX_PROJECT_ENDPOINT: ${{ vars.TOOLBOX_PROJECT_ENDPOINT }}
          TOOLBOX_PROJECT_ENDPOINT_WESTUS2: ${{ vars.TOOLBOX_PROJECT_ENDPOINT_WESTUS2 }}
        run: |
          mkdir -p /tmp/toolbox-orphan-cleanup
          failed=0
          index=0
          declare -A seen=()
          for endpoint in "$DEFAULT_PROJECT_ENDPOINT" "$TOOLBOX_PROJECT_ENDPOINT" "$TOOLBOX_PROJECT_ENDPOINT_WESTUS2"; do
            [ -n "$endpoint" ] || continue
            [ -z "${seen[$endpoint]:-}" ] || continue
            seen[$endpoint]=1
            index=$((index + 1))
            if ! .github/scripts/cleanup-hosted-agent-ci-toolboxes.sh \
              orphans "$endpoint" 86400 "/tmp/toolbox-orphan-cleanup/project-${index}.json"; then
              failed=1
            fi
          done
          exit "$failed"
      - name: Upload orphan-cleanup results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-e2e-toolbox-orphan-cleanup
          path: /tmp/toolbox-orphan-cleanup
          if-no-files-found: ignore

  # ── Run E2E tests, sharded by language ────────────────────────────
  # The matrix is sharded by language into separate reusable-workflow
  # invocations. GitHub Actions caps a single job matrix at 256 jobs per
  # workflow run; the combined python+csharp matrix (code+container +
  # toolbox combos) exceeds that, so each language shard runs its own
  # matrix (each < 256) via the reusable runner workflow.
  cloud-e2e-python:
    name: Cloud E2E (python)
    needs: [ discover-samples, cleanup-orphaned-toolboxes ]
    if: always() && needs.discover-samples.result == 'success' && needs.discover-samples.outputs.matrix_python != '{"include":[]}'
    uses: ./.github/workflows/hosted-agents-cloud-e2e-runner.yml
    with:
      matrix: ${{ needs.discover-samples.outputs.matrix_python }}
      shard: python
      # Filtered manual runs (sample_filter set) run only a subset of a
      # sample's combos, so a targeted pass must not overwrite a prior
      # full-run sample-level failure that the sync gate relies on.
      publish_validation_statuses: ${{ inputs.sample_filter == '' }}
    secrets: inherit

  cloud-e2e-csharp:
    name: Cloud E2E (csharp)
    needs: [ discover-samples, cleanup-orphaned-toolboxes ]
    if: always() && needs.discover-samples.result == 'success' && needs.discover-samples.outputs.matrix_csharp != '{"include":[]}'
    uses: ./.github/workflows/hosted-agents-cloud-e2e-runner.yml
    with:
      matrix: ${{ needs.discover-samples.outputs.matrix_csharp }}
      shard: csharp
      publish_validation_statuses: ${{ inputs.sample_filter == '' }}
    secrets: inherit

  # ── Summary job ───────────────────────────────────────────────────
  summary:
    name: E2E Summary
    needs: [ discover-samples, cloud-e2e-python, cloud-e2e-csharp ]
    runs-on: ubuntu-latest
    if: always() && needs.discover-samples.result == 'success'

    # Scoped permissions for gh-pages deployment (least privilege)
    permissions:
      contents: write
      pages: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all test artifacts
        uses: actions/download-artifact@v4
        with:
          path: /tmp/artifacts
          pattern: cloud-e2e-results-*

      - name: Generate sample status summary
        id: status
        run: |
          echo "## Cloud E2E Sample Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Sample | Toolbox | Deploy | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|---------|--------|--------|" >> $GITHUB_STEP_SUMMARY

          # Parse the matrix to get sample info
          matrix='${{ needs.discover-samples.outputs.matrix }}'

          echo "$matrix" | jq -r '.include[] | "\(.combo_id)|\(.name)|\(.toolbox_label)|\(.path)|\(.deploy_mode)|\(.dep_resolution)"' | while IFS='|' read -r combo_id name toolbox_label path deploy_mode dep_resolution; do
            # Read explicit status from result.txt (not just artifact presence)
            status_file="/tmp/artifacts/cloud-e2e-results-$combo_id/result.txt"
            tb_display="${toolbox_label:--}"
            if [ "$deploy_mode" = "code" ]; then
              deploy_display="🐍 code (${dep_resolution})"
            else
              deploy_display="📦 container"
            fi
            if [ -f "$status_file" ] && grep -q "^success" "$status_file"; then
              echo "| $name | $tb_display | $deploy_display | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| $name | $tb_display | $deploy_display | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
            fi
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Run:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY

      - name: Create status artifact
        run: |
          mkdir -p /tmp/status
          matrix='${{ needs.discover-samples.outputs.matrix }}'

          # Build JSON using jq for proper escaping
          samples_json="[]"
          while IFS='|' read -r combo_id name toolbox_label path deploy_mode dep_resolution; do
            # Read explicit status from result.txt
            status_file="/tmp/artifacts/cloud-e2e-results-$combo_id/result.txt"
            if [ -f "$status_file" ] && grep -q "^success" "$status_file"; then
              status="success"
            else
              status="failure"
            fi
            
            # Use jq to properly escape and build JSON
            samples_json=$(echo "$samples_json" | jq \
              --arg id "$combo_id" --arg name "$name" --arg path "$path" \
              --arg toolbox "$toolbox_label" --arg status "$status" \
              --arg deploy_mode "$deploy_mode" --arg dep_resolution "$dep_resolution" \
              '. + [{id: $id, name: $name, path: $path, toolbox: $toolbox, deploy_mode: $deploy_mode, dep_resolution: $dep_resolution, status: $status}]')
          done < <(echo "$matrix" | jq -r '.include[] | "\(.combo_id)|\(.name)|\(.toolbox_label)|\(.path)|\(.deploy_mode)|\(.dep_resolution)"')

          # Build final JSON
          jq -n \
            --argjson run_id "${{ github.run_id }}" \
            --argjson run_number "${{ github.run_number }}" \
            --arg event "${{ github.event_name }}" \
            --arg timestamp "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson samples "$samples_json" \
            '{run_id: $run_id, run_number: $run_number, event: $event, timestamp: $timestamp, samples: $samples}' \
            > /tmp/status/sample-status.json

          cat /tmp/status/sample-status.json

      - name: Upload status artifact
        uses: actions/upload-artifact@v4
        with:
          name: sample-status
          path: /tmp/status/sample-status.json

      - name: Build status page for GitHub Pages
        # Only publish the status page for full-matrix runs. A filtered manual
        # run (sample_filter set) evaluates just a subset, so skip the Pages
        # build/deploy to avoid clobbering the full status page on gh-pages.
        if: github.ref == 'refs/heads/main' && inputs.sample_filter == ''
        run: |
          mkdir -p /tmp/gh-pages
          matrix='${{ needs.discover-samples.outputs.matrix }}'
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          repo_url="${{ github.server_url }}/${{ github.repository }}"
          timestamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          # HTML escape helper function
          html_escape() {
            echo "$1" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g; s/"/\&quot;/g; s/'"'"'/\&#39;/g'
          }

          # Build sample rows with HTML escaping
          sample_rows=""
          overall_status="passing"
          while IFS='|' read -r combo_id name toolbox_label path deploy_mode dep_resolution; do
            # Read explicit status from result.txt
            status_file="/tmp/artifacts/cloud-e2e-results-$combo_id/result.txt"
            if [ -f "$status_file" ] && grep -q "^success" "$status_file"; then
              status_badge="✅ Passing"
              status_class="passing"
            else
              status_badge="❌ Failing"
              status_class="failing"
              overall_status="failing"
            fi
            
            # HTML escape name and path to prevent XSS
            display_name="$name"
            [ -n "$toolbox_label" ] && display_name="$name (${toolbox_label})"
            escaped_name=$(html_escape "$display_name")
            escaped_path=$(html_escape "$path")
            if [ "$deploy_mode" = "code" ]; then
              deploy_display="🐍 code (${dep_resolution})"
            else
              deploy_display="📦 container"
            fi
            escaped_deploy=$(html_escape "$deploy_display")
            sample_rows="$sample_rows<tr class=\"$status_class\"><td><a href=\"$repo_url/tree/main/$escaped_path\">$escaped_name</a></td><td>$escaped_path</td><td>$escaped_deploy</td><td>$status_badge</td></tr>"
          done < <(echo "$matrix" | jq -r '.include[] | "\(.combo_id)|\(.name)|\(.toolbox_label)|\(.path)|\(.deploy_mode)|\(.dep_resolution)"')

          # Determine overall status text
          if [ "$overall_status" = "passing" ]; then
            status_class="passing"
            status_text="All Samples Passing"
          else
            status_class="failing"
            status_text="Some Samples Failing"
          fi

          # Create HTML status page from template
          cp .github/templates/status-page.html /tmp/gh-pages/index.html
          sed -i "s|{{OVERALL_STATUS_CLASS}}|$status_class|g" /tmp/gh-pages/index.html
          sed -i "s|{{OVERALL_STATUS_TEXT}}|$status_text|g" /tmp/gh-pages/index.html
          sed -i "s|{{SAMPLE_ROWS}}|$sample_rows|g" /tmp/gh-pages/index.html
          sed -i "s|{{TIMESTAMP}}|$timestamp|g" /tmp/gh-pages/index.html
          sed -i "s|{{RUN_URL}}|$run_url|g" /tmp/gh-pages/index.html
          sed -i "s|{{RUN_NUMBER}}|${{ github.run_number }}|g" /tmp/gh-pages/index.html
          sed -i "s|{{REPO_URL}}|$repo_url|g" /tmp/gh-pages/index.html

          # Also save JSON for programmatic access
          cp /tmp/status/sample-status.json /tmp/gh-pages/status.json

          cat /tmp/gh-pages/index.html

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' && inputs.sample_filter == ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: /tmp/gh-pages
          publish_branch: gh-pages
          commit_message: "Update sample status from run #${{ github.run_number }}"
