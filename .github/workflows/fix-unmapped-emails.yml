name: Fix Unmapped Emails

on:
  workflow_dispatch:
    inputs:
      scan_range:
        description: 'Git revision range to scan (default: HEAD — main branch only)'
        required: false
        type: string
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  detect-and-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout default branch (trusted code path)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
        # SECURITY: This workflow has contents/PR write plus a SYNC_APP token.
        # Pinning to the default branch keeps privileged execution on trusted code.
        # (CodeQL: actions/untrusted-checkout/critical)
        #
        # NOTE: `fetch-depth: 0` fetches full history of the default branch but
        # does NOT fetch open PR-branch refs.  The orchestrator therefore scans
        # only commits reachable from HEAD by default (SCAN_RANGE defaults to HEAD).
        # This prevents false-positive bot PRs for emails that are already blocked
        # by the precheck gate on the contributor's own PR.  See
        # fix-unmapped-emails-orchestrate.sh for the SCAN_RANGE default.

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Detect, merge, and append-or-create
        env:
          # Authenticate gh API calls in resolve-mailmap-entry.sh so candidate
          # GitHub users can actually be looked up (without this, /users and
          # /search/users calls fail and every detection produces only
          # comment-only "needs manual lookup" placeholders).
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MAILMAP_FILE: .github/sync-mailmap
          SCAN_RANGE: ${{ inputs.scan_range }}
          # Human-readable trigger label embedded in the auto-generated PR.
          TRIGGER_LABEL: manual dispatch
          # Hard contract per ADO 5356762: auto/fix-unmapped-emails-* branches
          # are append-only. The orchestrator must NOT force-push — when an
          # open auto-fix PR exists, new entries are appended as a new commit
          # plus a PR comment, so operator edits mid-review survive.
        run: |
          chmod +x \
            .github/scripts/detect-unmapped-emails.sh \
            .github/scripts/resolve-mailmap-entry.sh \
            .github/scripts/merge-mailmap-additions.sh \
            .github/scripts/fix-unmapped-emails-orchestrate.sh
          bash .github/scripts/fix-unmapped-emails-orchestrate.sh
