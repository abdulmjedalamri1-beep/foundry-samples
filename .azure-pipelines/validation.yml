# Sample Validation Pipeline
# Validates code samples in the repository by language
# Triggers: PR to main, nightly schedule, manual dispatch

trigger:
  branches:
    include:
      - main
  # Intentionally NO `paths:` filter on main. Every push:main must queue a run
  # so the per-sample fan-out (carry-over from parent SHA) can post a status
  # for every tracked sample on every main commit — even commits that don't
  # touch samples/ (docs, infra, scripts). The sync gate (D4) reads those
  # statuses on the synced SHA; missing statuses grandfather samples through
  # ungated. See docs/validation-story-decisions.md §8 Q4.
  # The `pr:` block below keeps its path filter — PR runs don't feed sync.

pr:
  branches:
    include:
      - main
  paths:
    include:
      - samples/**
      - CONTRIBUTING.md
      - docs/validation-contract.md
      - .azure-pipelines/validation.yml
      - .azure-pipelines/README.md
      - .azure-pipelines/hosted-agent-python-requirements-exceptions.toml
      - .azure-pipelines/scripts/**
    exclude:
      - internal/**

schedules:
  # Run full validation Mon/Wed/Fri to catch drift from SDK updates or 
  # external dependency changes that wouldn't trigger change detection.
  # This balances coverage (detect issues within 2-3 days) vs compute cost.
  - cron: '0 0 * * 1,3,5'
    displayName: 'Scheduled validation (Mon/Wed/Fri)'
    branches:
      include:
        - main
    always: true  # Run even if no changes — validates all samples

parameters:
  - name: validateAll
    displayName: 'Validate all samples (ignore change detection)'
    type: boolean
    default: false

pool:
  vmImage: 'ubuntu-latest'

variables:
  - group: foundry-samples-validation-bot-credentials
  - name: SAMPLES_DIR
    value: 'samples'

stages:
  # Stage 0: Check that all commit author emails are in the sync-mailmap.
  # This catches unmapped contributors at PR time — before they break the
  # nightly sync-to-public workflow.
  - stage: PreChecks
    displayName: 'Run PR and sync prechecks'
    jobs:
      - job: DetectUnmappedEmails
        displayName: 'Detect Unmapped Emails'
        steps:
          - checkout: self
            fetchDepth: 0

          - script: |
              chmod +x .github/scripts/detect-unmapped-emails.sh
              chmod +x .github/scripts/resolve-mailmap-entry.sh

              # For PRs, scan the commit range being introduced.
              # For CI/scheduled, scan recent commits (last 50).
              if [ "$(Build.Reason)" == "PullRequest" ]; then
                git fetch origin $(System.PullRequest.TargetBranch)
                RANGE="origin/$(System.PullRequest.TargetBranch)..HEAD"
              else
                RANGE="HEAD~50..HEAD"
              fi

              echo "Scanning commit range: $RANGE"
              if ! bash .github/scripts/detect-unmapped-emails.sh \
                  --mailmap .github/sync-mailmap \
                  --range "$RANGE" \
                  --resolve; then
                echo "##vso[task.logissue type=error]Unmapped internal emails found. Add them to .github/sync-mailmap before merging."
                echo "##vso[task.logissue type=error]See output above for suggested mailmap entries and lookup links."
                exit 1
              fi
            displayName: 'Check for unmapped @microsoft.com emails'

      - job: CheckHostedAgentPythonRequirements
        displayName: 'Check Python Hosted Agent dependency policy'
        condition: eq(variables['Build.Reason'], 'PullRequest')
        steps:
          - checkout: self
            fetchDepth: 0
            persistCredentials: true

          - task: UsePythonVersion@0
            displayName: 'Setup Python'
            inputs:
              versionSpec: '3.13'

          - script: |
              set -euo pipefail
              python -m pip install --disable-pip-version-check \
                "pip==25.1.1" \
                "packaging==25.0" \
                "PyYAML==6.0.2"
              python -m unittest discover -v \
                -s .azure-pipelines/scripts/tests \
                -p 'test_check_hosted_agent_python_requirements.py'
            displayName: 'Test dependency-policy checker'

          - script: |
              set -euo pipefail
              TARGET_BRANCH="$(System.PullRequest.TargetBranch)"
              TARGET_BRANCH="${TARGET_BRANCH#refs/heads/}"
              git fetch origin "$TARGET_BRANCH"
              MERGE_BASE="$(git merge-base "origin/$TARGET_BRANCH" HEAD)"
              POLICY_URL="https://github.com/microsoft-foundry/foundry-samples-pr/blob/$(Build.SourceVersion)/samples/python/hosted-agents/DEPENDENCY_POLICY.md"

              python .azure-pipelines/scripts/check-hosted-agent-python-requirements.py \
                --base "$MERGE_BASE" \
                --head HEAD \
                --resolve \
                --ado \
                --policy-url "$POLICY_URL"
            displayName: 'Enforce dependency policy'

  # Stage 1: Detect which samples have changed
  - stage: DetectChanges
    displayName: 'Detect Changed Samples'
    dependsOn: PreChecks
    jobs:
      - job: AnalyzeChanges
        displayName: 'Analyze Changed Samples'
        steps:
          - checkout: self
            fetchDepth: 0  # Full history for accurate diff

          - script: |
              echo "Detecting changed samples..."
              
              # For PRs, compare against target branch
              # For CI/scheduled, compare against previous commit
              if [ "$(Build.Reason)" == "PullRequest" ]; then
                # Fetch target branch to ensure we have the ref for comparison
                git fetch origin $(System.PullRequest.TargetBranch)
                BASE_REF="origin/$(System.PullRequest.TargetBranch)"
              else
                BASE_REF="HEAD~1"
              fi
              
              echo "Comparing against: $BASE_REF"
              
              # Get changed files in samples/ directory
              # Fail loud on diff errors: a silent empty diff would make the
              # publish-stage carry-over treat every sample as unchanged and
              # re-post the parent's `success` for samples that actually changed.
              # That's a fail-open into the sync gate. (ADO 5247751)
              if ! git diff --name-only "$BASE_REF" HEAD -- samples/ > changed_files.txt; then
                echo "##vso[task.logissue type=error]git diff against $BASE_REF failed; refusing to continue with empty changed_files.txt"
                exit 1
              fi
              
              mkdir -p $(Build.ArtifactStagingDirectory)/changes
              
              # For each changed file, find the nearest sample.yaml to identify the sample root
              # Then group by language (first directory under samples/)
              > all_changed_samples.txt
              
              while IFS= read -r changed_file; do
                [ -z "$changed_file" ] && continue
                
                # Walk up from the changed file to find sample.yaml
                dir=$(dirname "$changed_file")
                while [ "$dir" != "samples" ] && [ "$dir" != "." ]; do
                  if [ -f "$dir/sample.yaml" ]; then
                    echo "$dir" >> all_changed_samples.txt
                    break
                  fi
                  dir=$(dirname "$dir")
                done
              done < changed_files.txt
              
              # Deduplicate
              sort -u all_changed_samples.txt > unique_changed_samples.txt
              
              # Group by language (extract language from path: samples/<lang>/...)
              for lang in csharp python java typescript go REST cli; do
                grep "^samples/$lang/" unique_changed_samples.txt > "$(Build.ArtifactStagingDirectory)/changes/changed_${lang}.txt" || true
                count=$(wc -l < "$(Build.ArtifactStagingDirectory)/changes/changed_${lang}.txt" 2>/dev/null | tr -d ' ')
                echo "Changed $lang samples: $count"
                
                # Set output variable for each language (true if has changes)
                if [ "$count" -gt 0 ]; then
                  echo "##vso[task.setvariable variable=has_${lang};isOutput=true]true"
                else
                  echo "##vso[task.setvariable variable=has_${lang};isOutput=true]false"
                fi
              done
              
              # Also save full list
              cp changed_files.txt $(Build.ArtifactStagingDirectory)/changes/
              cp unique_changed_samples.txt $(Build.ArtifactStagingDirectory)/changes/
            displayName: 'Detect changed samples'
            name: detectChanges
            condition: and(eq('${{ parameters.validateAll }}', false), ne(variables['Build.Reason'], 'Schedule'))

          - script: |
              echo "Validating ALL samples (scheduled run or validateAll=true)"
              mkdir -p $(Build.ArtifactStagingDirectory)/changes
              
              # Find all sample.yaml files and extract their directories
              find samples -name "sample.yaml" -type f | while read -r yaml_file; do
                dirname "$yaml_file"
              done > all_samples.txt
              
              # Group by language
              for lang in csharp python java typescript go REST cli; do
                grep "^samples/$lang/" all_samples.txt > "$(Build.ArtifactStagingDirectory)/changes/changed_${lang}.txt" || true
                count=$(wc -l < "$(Build.ArtifactStagingDirectory)/changes/changed_${lang}.txt" 2>/dev/null | tr -d ' ')
                echo "Total $lang samples: $count"
                
                # Set output variable for each language (true if has samples)
                if [ "$count" -gt 0 ]; then
                  echo "##vso[task.setvariable variable=has_${lang};isOutput=true]true"
                else
                  echo "##vso[task.setvariable variable=has_${lang};isOutput=true]false"
                fi
              done
            displayName: 'List all samples'
            name: listAllSamples
            condition: or(eq('${{ parameters.validateAll }}', true), eq(variables['Build.Reason'], 'Schedule'))

          - publish: $(Build.ArtifactStagingDirectory)/changes
            artifact: ChangedSamples
            displayName: 'Publish change detection results'

  # Stage 2: Validate samples by language
  - stage: Validate
    displayName: 'Validate Samples'
    dependsOn: DetectChanges
    variables:
      hasCSharp: $[coalesce(stageDependencies.DetectChanges.AnalyzeChanges.outputs['detectChanges.has_csharp'], stageDependencies.DetectChanges.AnalyzeChanges.outputs['listAllSamples.has_csharp'])]
      hasPython: $[coalesce(stageDependencies.DetectChanges.AnalyzeChanges.outputs['detectChanges.has_python'], stageDependencies.DetectChanges.AnalyzeChanges.outputs['listAllSamples.has_python'])]
      hasTypeScript: $[coalesce(stageDependencies.DetectChanges.AnalyzeChanges.outputs['detectChanges.has_typescript'], stageDependencies.DetectChanges.AnalyzeChanges.outputs['listAllSamples.has_typescript'])]
      hasJava: $[coalesce(stageDependencies.DetectChanges.AnalyzeChanges.outputs['detectChanges.has_java'], stageDependencies.DetectChanges.AnalyzeChanges.outputs['listAllSamples.has_java'])]
      hasGo: $[coalesce(stageDependencies.DetectChanges.AnalyzeChanges.outputs['detectChanges.has_go'], stageDependencies.DetectChanges.AnalyzeChanges.outputs['listAllSamples.has_go'])]
    jobs:
      # C# Validation
      - job: ValidateCSharp
        displayName: 'Validate C# Samples'
        condition: eq(variables.hasCSharp, 'true')
        steps:
          - checkout: self

          - download: current
            artifact: ChangedSamples

          - task: UseDotNet@2
            displayName: 'Setup .NET'
            inputs:
              packageType: 'sdk'
              version: '8.x'

          - task: GoTool@0
            displayName: 'Setup Go (for yq installation)'
            inputs:
              version: '1.21'

          - script: |
              go install github.com/mikefarah/yq/v4@latest
              echo "##vso[task.prependpath]$(go env GOPATH)/bin"
            displayName: 'Install yq'

          - script: |
              CHANGED_FILE="$(Pipeline.Workspace)/ChangedSamples/changed_csharp.txt"
              
              # Create results directory
              mkdir -p $(Build.ArtifactStagingDirectory)/results
              > $(Build.ArtifactStagingDirectory)/results/passed_csharp.txt
              > $(Build.ArtifactStagingDirectory)/results/failed_csharp.txt
              
              if [ ! -s "$CHANGED_FILE" ]; then
                echo "No C# samples to validate"
                exit 0
              fi
              
              echo "Validating C# samples..."
              FAILED=0
              
              while IFS= read -r sample_dir; do
                [ -z "$sample_dir" ] && continue
                echo "----------------------------------------"
                echo "Validating: $sample_dir"
                
                SAMPLE_PASSED=true
                HAS_CMD=false
                # Check if sample.yaml exists and parse build/validate/test commands
                if [ -f "$sample_dir/sample.yaml" ]; then
                  echo "Found sample.yaml, parsing commands..."
                  for cmd_type in build validate test; do
                    CMD=$(yq ".$cmd_type // \"\"" "$sample_dir/sample.yaml")
                    if [ -n "$CMD" ] && [ "$CMD" != "null" ]; then
                      echo "Running $cmd_type: $CMD"
                      HAS_CMD=true
                      if ! (cd "$sample_dir" && eval "$CMD"); then
                        echo "❌ FAILED ($cmd_type): $sample_dir"
                        SAMPLE_PASSED=false
                        FAILED=$((FAILED + 1))
                        echo "$sample_dir" >> $(Build.ArtifactStagingDirectory)/results/failed_csharp.txt
                        continue 2
                      fi
                    fi
                  done
                fi
                
                if [ "$HAS_CMD" = "true" ]; then
                  echo "✅ PASSED: $sample_dir"
                  echo "$sample_dir" >> $(Build.ArtifactStagingDirectory)/results/passed_csharp.txt
                  continue
                fi
                
                # Default: find and build .csproj files
                if ls "$sample_dir"/*.csproj 1>/dev/null 2>&1; then
                  for proj in "$sample_dir"/*.csproj; do
                    echo "Building: $proj"
                    if ! dotnet build "$proj" --verbosity minimal; then
                      echo "❌ FAILED: $sample_dir"
                      SAMPLE_PASSED=false
                      FAILED=$((FAILED + 1))
                    else
                      echo "✅ PASSED: $sample_dir"
                    fi
                  done
                else
                  echo "⚠️ No .csproj found in $sample_dir"
                fi
                
                if [ "$SAMPLE_PASSED" = "true" ]; then
                  echo "$sample_dir" >> $(Build.ArtifactStagingDirectory)/results/passed_csharp.txt
                else
                  echo "$sample_dir" >> $(Build.ArtifactStagingDirectory)/results/failed_csharp.txt
                fi
              done < "$CHANGED_FILE"
              
              if [ $FAILED -gt 0 ]; then
                echo "❌ $FAILED sample(s) failed validation"
                exit 1
              fi
              
              echo "✅ All C# samples passed validation"
            displayName: 'Validate C# samples'

          - publish: $(Build.ArtifactStagingDirectory)/results
            artifact: ResultsCSharp
            displayName: 'Publish C# results'
            condition: always()

      # Python Validation
      - job: ValidatePython
        displayName: 'Validate Python Samples'
        condition: eq(variables.hasPython, 'true')
        steps:
          - checkout: self

          - download: current
            artifact: ChangedSamples

          - task: UsePythonVersion@0
            displayName: 'Setup Python'
            inputs:
              versionSpec: '3.11'

          - task: GoTool@0
            displayName: 'Setup Go (for yq installation)'
            inputs:
              version: '1.21'

          - script: |
              go install github.com/mikefarah/yq/v4@latest
              echo "##vso[task.prependpath]$(go env GOPATH)/bin"
            displayName: 'Install yq'

          - script: |
              CHANGED_FILE="$(Pipeline.Workspace)/ChangedSamples/changed_python.txt"
              
              # Create results directory
              mkdir -p $(Build.ArtifactStagingDirectory)/results
              > $(Build.ArtifactStagingDirectory)/results/passed_python.txt
              > $(Build.ArtifactStagingDirectory)/results/failed_python.txt
              
              if [ ! -s "$CHANGED_FILE" ]; then
                echo "No Python samples to validate"
                exit 0
              fi
              
              echo "Validating Python samples..."
              FAILED=0
              
              while IFS= read -r sample_dir; do
                [ -z "$sample_dir" ] && continue
                echo "----------------------------------------"
                echo "Validating: $sample_dir"
                
                SAMPLE_PASSED=true
                
                # Create isolated venv for this sample
                echo "Creating virtual environment..."
                python -m venv "$sample_dir/.venv"
                source "$sample_dir/.venv/bin/activate"
                
                HAS_CMD=false
                # Check if sample.yaml exists and parse build/validate/test commands
                if [ -f "$sample_dir/sample.yaml" ]; then
                  echo "Found sample.yaml, parsing commands..."
                  for cmd_type in build validate test; do
                    CMD=$(yq ".$cmd_type // \"\"" "$sample_dir/sample.yaml")
                    if [ -n "$CMD" ] && [ "$CMD" != "null" ]; then
                      echo "Running $cmd_type: $CMD"
                      HAS_CMD=true
                      if ! (cd "$sample_dir" && source .venv/bin/activate && eval "$CMD"); then
                        echo "❌ FAILED ($cmd_type): $sample_dir"
                        SAMPLE_PASSED=false
                        FAILED=$((FAILED + 1))
                        echo "$sample_dir" >> $(Build.ArtifactStagingDirectory)/results/failed_python.txt
                        deactivate
                        rm -rf "$sample_dir/.venv"
                        continue 2
                      fi
                    fi
                  done
                fi
                
                if [ "$HAS_CMD" = "true" ]; then
                  echo "✅ PASSED: $sample_dir"
                  echo "$sample_dir" >> $(Build.ArtifactStagingDirectory)/results/passed_python.txt
                  deactivate
                  rm -rf "$sample_dir/.venv"
                  continue
                fi
                
                # Default: Install requirements if present
                if [ -f "$sample_dir/requirements.txt" ]; then
                  echo "Installing requirements..."
                  if ! pip install -r "$sample_dir/requirements.txt" -q; then
                    echo "❌ FAILED: pip install for $sample_dir"
                    SAMPLE_PASSED=false
                    FAILED=$((FAILED + 1))
                    echo "$sample_dir" >> $(Build.ArtifactStagingDirectory)/results/failed_python.txt
                    deactivate
                    rm -rf "$sample_dir/.venv"
                    continue
                  fi
                fi
                
                # Syntax check all Python files
                for pyfile in "$sample_dir"/*.py; do
                  [ -f "$pyfile" ] || continue
                  echo "Checking: $pyfile"
                  if ! python -m py_compile "$pyfile"; then
                    echo "❌ FAILED: $pyfile"
                    SAMPLE_PASSED=false
                    FAILED=$((FAILED + 1))
                  else
                    echo "✅ PASSED: $pyfile"
                  fi
                done
                
                # Record result
                if [ "$SAMPLE_PASSED" = "true" ]; then
                  echo "$sample_dir" >> $(Build.ArtifactStagingDirectory)/results/passed_python.txt
                else
                  echo "$sample_dir" >> $(Build.ArtifactStagingDirectory)/results/failed_python.txt
                fi
                
                # Deactivate and cleanup venv
                deactivate
                rm -rf "$sample_dir/.venv"
              done < "$CHANGED_FILE"
              
              if [ $FAILED -gt 0 ]; then
                echo "❌ $FAILED sample(s) failed validation"
                exit 1
              fi
              
              echo "✅ All Python samples passed validation"
            displayName: 'Validate Python samples'

          - publish: $(Build.ArtifactStagingDirectory)/results
            artifact: ResultsPython
            displayName: 'Publish Python results'
            condition: always()

      # TypeScript/JavaScript Validation
      - job: ValidateTypeScript
        displayName: 'Validate TypeScript/JS Samples'
        condition: eq(variables.hasTypeScript, 'true')
        steps:
          - checkout: self

          - download: current
            artifact: ChangedSamples

          - task: NodeTool@0
            displayName: 'Setup Node.js'
            inputs:
              versionSpec: '18.x'

          - task: GoTool@0
            displayName: 'Setup Go (for yq installation)'
            inputs:
              version: '1.21'

          - script: |
              go install github.com/mikefarah/yq/v4@latest
              echo "##vso[task.prependpath]$(go env GOPATH)/bin"
            displayName: 'Install yq'

          - script: |
              CHANGED_FILE="$(Pipeline.Workspace)/ChangedSamples/changed_typescript.txt"
              
              # Create results directory
              mkdir -p $(Build.ArtifactStagingDirectory)/results
              > $(Build.ArtifactStagingDirectory)/results/passed_typescript.txt
              > $(Build.ArtifactStagingDirectory)/results/failed_typescript.txt
              
              if [ ! -s "$CHANGED_FILE" ]; then
                echo "No TypeScript/JS samples to validate"
                exit 0
              fi
              
              echo "Validating TypeScript/JS samples..."
              FAILED=0
              
              while IFS= read -r sample_dir; do
                [ -z "$sample_dir" ] && continue
                echo "----------------------------------------"
                echo "Validating: $sample_dir"
                
                SAMPLE_PASSED=true
                HAS_CMD=false
                # Check if sample.yaml exists and parse build/validate/test commands
                if [ -f "$sample_dir/sample.yaml" ]; then
                  echo "Found sample.yaml, parsing commands..."
                  for cmd_type in build validate test; do
                    CMD=$(yq ".$cmd_type // \"\"" "$sample_dir/sample.yaml")
                    if [ -n "$CMD" ] && [ "$CMD" != "null" ]; then
                      echo "Running $cmd_type: $CMD"
                      HAS_CMD=true
                      if ! (cd "$sample_dir" && eval "$CMD"); then
                        echo "❌ FAILED ($cmd_type): $sample_dir"
                        SAMPLE_PASSED=false
                        FAILED=$((FAILED + 1))
                        echo "$sample_dir" >> $(Build.ArtifactStagingDirectory)/results/failed_typescript.txt
                        continue 2
                      fi
                    fi
                  done
                fi
                
                if [ "$HAS_CMD" = "true" ]; then
                  echo "✅ PASSED: $sample_dir"
                  echo "$sample_dir" >> $(Build.ArtifactStagingDirectory)/results/passed_typescript.txt
                  continue
                fi
                
                # Default validation
                cd "$sample_dir"
                
                # Install dependencies if package.json exists
                if [ -f "package.json" ]; then
                  echo "Installing dependencies..."
                  if ! npm install --silent; then
                    echo "❌ FAILED: npm install for $sample_dir"
                    SAMPLE_PASSED=false
                    FAILED=$((FAILED + 1))
                    echo "$sample_dir" >> $(Build.ArtifactStagingDirectory)/results/failed_typescript.txt
                    cd - > /dev/null
                    continue
                  fi
                  
                  # Run build if script exists
                  if npm run build --if-present; then
                    echo "✅ PASSED: $sample_dir"
                  else
                    echo "❌ FAILED: $sample_dir"
                    SAMPLE_PASSED=false
                    FAILED=$((FAILED + 1))
                  fi
                else
                  # No package.json - check syntax of JS files only (node --check doesn't work for TS)
                  for jsfile in *.js; do
                    [ -f "$jsfile" ] || continue
                    echo "Checking: $jsfile"
                    if ! node --check "$jsfile"; then
                      echo "❌ FAILED: $jsfile"
                      SAMPLE_PASSED=false
                      FAILED=$((FAILED + 1))
                    else
                      echo "✅ PASSED: $jsfile"
                    fi
                  done
                  # For TypeScript without package.json, warn (can't compile without tsconfig)
                  for tsfile in *.ts; do
                    [ -f "$tsfile" ] || continue
                    echo "⚠️ TypeScript file without package.json, skipping: $tsfile"
                  done
                fi
                
                # Record result
                if [ "$SAMPLE_PASSED" = "true" ]; then
                  echo "$sample_dir" >> $(Build.ArtifactStagingDirectory)/results/passed_typescript.txt
                else
                  echo "$sample_dir" >> $(Build.ArtifactStagingDirectory)/results/failed_typescript.txt
                fi
                
                cd - > /dev/null
              done < "$CHANGED_FILE"
              
              if [ $FAILED -gt 0 ]; then
                echo "❌ $FAILED sample(s) failed validation"
                exit 1
              fi
              
              echo "✅ All TypeScript/JS samples passed validation"
            displayName: 'Validate TypeScript/JS samples'

          - publish: $(Build.ArtifactStagingDirectory)/results
            artifact: ResultsTypeScript
            displayName: 'Publish TypeScript results'
            condition: always()

      # Java Validation
      - job: ValidateJava
        displayName: 'Validate Java Samples'
        condition: eq(variables.hasJava, 'true')
        steps:
          - checkout: self

          - download: current
            artifact: ChangedSamples

          - task: JavaToolInstaller@0
            displayName: 'Setup Java'
            inputs:
              versionSpec: '17'
              jdkArchitectureOption: 'x64'
              jdkSourceOption: 'PreInstalled'

          - task: GoTool@0
            displayName: 'Setup Go (for yq installation)'
            inputs:
              version: '1.21'

          - script: |
              go install github.com/mikefarah/yq/v4@latest
              echo "##vso[task.prependpath]$(go env GOPATH)/bin"
            displayName: 'Install yq'

          - script: |
              CHANGED_FILE="$(Pipeline.Workspace)/ChangedSamples/changed_java.txt"
              
              # Create results directory
              mkdir -p $(Build.ArtifactStagingDirectory)/results
              > $(Build.ArtifactStagingDirectory)/results/passed_java.txt
              > $(Build.ArtifactStagingDirectory)/results/failed_java.txt
              
              if [ ! -s "$CHANGED_FILE" ]; then
                echo "No Java samples to validate"
                exit 0
              fi
              
              echo "Validating Java samples..."
              FAILED=0
              
              while IFS= read -r sample_dir; do
                [ -z "$sample_dir" ] && continue
                echo "----------------------------------------"
                echo "Validating: $sample_dir"
                
                SAMPLE_PASSED=true
                HAS_CMD=false
                # Check if sample.yaml exists and parse build/validate/test commands
                if [ -f "$sample_dir/sample.yaml" ]; then
                  echo "Found sample.yaml, parsing commands..."
                  for cmd_type in build validate test; do
                    CMD=$(yq ".$cmd_type // \"\"" "$sample_dir/sample.yaml")
                    if [ -n "$CMD" ] && [ "$CMD" != "null" ]; then
                      echo "Running $cmd_type: $CMD"
                      HAS_CMD=true
                      if ! (cd "$sample_dir" && eval "$CMD"); then
                        echo "❌ FAILED ($cmd_type): $sample_dir"
                        SAMPLE_PASSED=false
                        FAILED=$((FAILED + 1))
                        echo "$sample_dir" >> $(Build.ArtifactStagingDirectory)/results/failed_java.txt
                        continue 2
                      fi
                    fi
                  done
                fi
                
                if [ "$HAS_CMD" = "true" ]; then
                  echo "✅ PASSED: $sample_dir"
                  echo "$sample_dir" >> $(Build.ArtifactStagingDirectory)/results/passed_java.txt
                  continue
                fi
                
                # Default validation
                cd "$sample_dir"
                
                # Maven build
                if [ -f "pom.xml" ]; then
                  echo "Building with Maven..."
                  if mvn compile -q; then
                    echo "✅ PASSED: $sample_dir"
                  else
                    echo "❌ FAILED: $sample_dir"
                    SAMPLE_PASSED=false
                    FAILED=$((FAILED + 1))
                  fi
                # Gradle build
                elif [ -f "build.gradle" ] || [ -f "build.gradle.kts" ]; then
                  echo "Building with Gradle..."
                  if ./gradlew build -q 2>/dev/null || gradle build -q; then
                    echo "✅ PASSED: $sample_dir"
                  else
                    echo "❌ FAILED: $sample_dir"
                    SAMPLE_PASSED=false
                    FAILED=$((FAILED + 1))
                  fi
                else
                  echo "⚠️ No pom.xml or build.gradle found"
                fi
                
                # Record result
                if [ "$SAMPLE_PASSED" = "true" ]; then
                  echo "$sample_dir" >> $(Build.ArtifactStagingDirectory)/results/passed_java.txt
                else
                  echo "$sample_dir" >> $(Build.ArtifactStagingDirectory)/results/failed_java.txt
                fi
                
                cd - > /dev/null
              done < "$CHANGED_FILE"
              
              if [ $FAILED -gt 0 ]; then
                echo "❌ $FAILED sample(s) failed validation"
                exit 1
              fi
              
              echo "✅ All Java samples passed validation"
            displayName: 'Validate Java samples'

          - publish: $(Build.ArtifactStagingDirectory)/results
            artifact: ResultsJava
            displayName: 'Publish Java results'
            condition: always()

      # Go Validation
      - job: ValidateGo
        displayName: 'Validate Go Samples'
        condition: eq(variables.hasGo, 'true')
        steps:
          - checkout: self

          - download: current
            artifact: ChangedSamples

          - task: GoTool@0
            displayName: 'Setup Go'
            inputs:
              version: '1.21'

          - script: |
              go install github.com/mikefarah/yq/v4@latest
              echo "##vso[task.prependpath]$(go env GOPATH)/bin"
            displayName: 'Install yq'

          - script: |
              CHANGED_FILE="$(Pipeline.Workspace)/ChangedSamples/changed_go.txt"
              
              # Create results directory
              mkdir -p $(Build.ArtifactStagingDirectory)/results
              > $(Build.ArtifactStagingDirectory)/results/passed_go.txt
              > $(Build.ArtifactStagingDirectory)/results/failed_go.txt
              
              if [ ! -s "$CHANGED_FILE" ]; then
                echo "No Go samples to validate"
                exit 0
              fi
              
              echo "Validating Go samples..."
              FAILED=0
              
              while IFS= read -r sample_dir; do
                [ -z "$sample_dir" ] && continue
                echo "----------------------------------------"
                echo "Validating: $sample_dir"
                
                SAMPLE_PASSED=true
                HAS_CMD=false
                # Check if sample.yaml exists and parse build/validate/test commands
                if [ -f "$sample_dir/sample.yaml" ]; then
                  echo "Found sample.yaml, parsing commands..."
                  for cmd_type in build validate test; do
                    CMD=$(yq ".$cmd_type // \"\"" "$sample_dir/sample.yaml")
                    if [ -n "$CMD" ] && [ "$CMD" != "null" ]; then
                      echo "Running $cmd_type: $CMD"
                      HAS_CMD=true
                      if ! (cd "$sample_dir" && eval "$CMD"); then
                        echo "❌ FAILED ($cmd_type): $sample_dir"
                        SAMPLE_PASSED=false
                        FAILED=$((FAILED + 1))
                        echo "$sample_dir" >> $(Build.ArtifactStagingDirectory)/results/failed_go.txt
                        continue 2
                      fi
                    fi
                  done
                fi
                
                if [ "$HAS_CMD" = "true" ]; then
                  echo "✅ PASSED: $sample_dir"
                  echo "$sample_dir" >> $(Build.ArtifactStagingDirectory)/results/passed_go.txt
                  continue
                fi
                
                # Default validation
                cd "$sample_dir"
                
                # Check for go.mod
                if [ -f "go.mod" ]; then
                  echo "Building Go module..."
                  if go build ./...; then
                    echo "✅ PASSED: $sample_dir"
                  else
                    echo "❌ FAILED: $sample_dir"
                    SAMPLE_PASSED=false
                    FAILED=$((FAILED + 1))
                  fi
                else
                  # Try to build individual .go files
                  for gofile in *.go; do
                    [ -f "$gofile" ] || continue
                    echo "Checking: $gofile"
                    if ! go build "$gofile"; then
                      echo "❌ FAILED: $gofile"
                      SAMPLE_PASSED=false
                      FAILED=$((FAILED + 1))
                    fi
                  done
                fi
                
                # Record result
                if [ "$SAMPLE_PASSED" = "true" ]; then
                  echo "$sample_dir" >> $(Build.ArtifactStagingDirectory)/results/passed_go.txt
                else
                  echo "$sample_dir" >> $(Build.ArtifactStagingDirectory)/results/failed_go.txt
                fi
                
                cd - > /dev/null
              done < "$CHANGED_FILE"
              
              if [ $FAILED -gt 0 ]; then
                echo "❌ $FAILED sample(s) failed validation"
                exit 1
              fi
              
              echo "✅ All Go samples passed validation"
            displayName: 'Validate Go samples'

          - publish: $(Build.ArtifactStagingDirectory)/results
            artifact: ResultsGo
            displayName: 'Publish Go results'
            condition: always()

  # Stage 3: Report results
  - stage: Report
    displayName: 'Report Results'
    dependsOn: Validate
    condition: always()
    jobs:
      - job: PublishResults
        displayName: 'Publish Validation Results'
        variables:
          csharpResult: $[stageDependencies.Validate.ValidateCSharp.result]
          pythonResult: $[stageDependencies.Validate.ValidatePython.result]
          typescriptResult: $[stageDependencies.Validate.ValidateTypeScript.result]
          javaResult: $[stageDependencies.Validate.ValidateJava.result]
          goResult: $[stageDependencies.Validate.ValidateGo.result]
        steps:
          - checkout: self
            persistCredentials: true
            fetchDepth: 0
          
          # Download change detection and result artifacts (continue on error if job was skipped)
          - download: current
            artifact: ChangedSamples
            displayName: 'Download changed samples'
            continueOnError: true
          - download: current
            artifact: ResultsCSharp
            displayName: 'Download C# results'
            continueOnError: true
          - download: current
            artifact: ResultsPython
            displayName: 'Download Python results'
            continueOnError: true
          - download: current
            artifact: ResultsTypeScript
            displayName: 'Download TypeScript results'
            continueOnError: true
          - download: current
            artifact: ResultsJava
            displayName: 'Download Java results'
            continueOnError: true
          - download: current
            artifact: ResultsGo
            displayName: 'Download Go results'
            continueOnError: true
            
          - task: Bash@3
            displayName: 'Mint GitHub App installation token'
            condition: always()
            env:
              GH_APP_ID: $(GH_APP_ID)
              GH_APP_INSTALLATION_ID: $(GH_APP_INSTALLATION_ID)
              GH_APP_PRIVATE_KEY: $(GH_APP_PRIVATE_KEY)
            inputs:
              targetType: inline
              script: |
                set -euo pipefail
                is_missing_secret() {
                  [[ -z "${1:-}" || "$1" == \$\(*\) ]]
                }

                # Fail loud if the App credentials aren't wired up. Silent
                # fail-open here would let the publish step skip and the next
                # sync would grandfather the unvalidated samples through.
                if is_missing_secret "$GH_APP_ID" || is_missing_secret "$GH_APP_INSTALLATION_ID" || is_missing_secret "$GH_APP_PRIVATE_KEY"; then
                  echo "##vso[task.logissue type=error]GitHub App credentials are not available; cannot post validation statuses. Verify the foundry-samples-validation-bot-credentials variable group is linked."
                  exit 1
                fi

                # Mint failure is also fatal — same reasoning. Surface the
                # signal so the build is red and the sync gate doesn't quietly
                # let unvalidated samples through.
                if token="$(.azure-pipelines/scripts/mint-installation-token.sh)"; then
                  echo "##vso[task.setvariable variable=GitHubAppToken;issecret=true]$token"
                  echo "Minted GitHub App installation token for validation status posting."
                else
                  echo "##vso[task.logissue type=error]Failed to mint GitHub App installation token; cannot post validation statuses."
                  exit 1
                fi

          - task: Bash@3
            displayName: 'Publish GitHub validation statuses'
            condition: always()
            env:
              GITHUB_TOKEN: $(GitHubAppToken)
              GITHUB_SHA: $(Build.SourceVersion)
              BUILD_URL: $(System.CollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)
              BUILD_REASON: $(Build.Reason)
              BUILD_SOURCE_BRANCH: $(Build.SourceBranch)
              VALIDATE_ALL: ${{ parameters.validateAll }}
            inputs:
              targetType: inline
              script: |
                set -euo pipefail

                # Fail-loud posture: the sync gate grandfathers any sample
                # that has no validation/<pipeline-id>/<sample-path> status on
                # the synced SHA (see docs/validation-story-decisions.md §1).
                # If we silently swallow POST failures here, samples we are
                # supposed to be tracking get demoted to untracked and sync
                # ungated. So: any failure to acquire credentials or to post
                # any status is a build-level error.
                if [[ -z "${GITHUB_TOKEN:-}" || "$GITHUB_TOKEN" == \$\(*\) ]]; then
                  echo "##vso[task.logissue type=error]No GitHub App token available; cannot post validation statuses. Refusing to proceed silently."
                  exit 1
                fi

                # Detect partial-validation push:main mode. On these runs the
                # Validate stage only ran the changed subset, but D4's sync
                # gate inspects every tracked sample on the synced SHA — so we
                # must fan out and post a status for every sample.yaml in the
                # 5 validated languages, carrying over the parent-SHA status
                # for samples whose source didn't change. (ADO 5247751)
                # Logic + truth table extracted to compute-push-main-partial.sh
                # so it's unit-testable (see tests/test-validation-status-helpers.sh
                # cases G1-G5). Includes Manual on main so re-queues during
                # incident response also fan out, not just IndividualCI/BatchedCI.
                IS_PUSH_MAIN_PARTIAL="$(.azure-pipelines/scripts/compute-push-main-partial.sh)"

                PARENT_STATUSES_FILE=""
                NO_PARENT_REASON=""
                if (( IS_PUSH_MAIN_PARTIAL == 1 )); then
                  if PARENT_SHA="$(git rev-parse HEAD~1 2>/dev/null)"; then
                    PARENT_STATUSES_FILE="$(mktemp)"
                    if .azure-pipelines/scripts/fetch-parent-validation-statuses.sh "$PARENT_SHA" > "$PARENT_STATUSES_FILE" 2>/tmp/fetch-parent-stderr; then
                      echo "Fetched $(wc -l < "$PARENT_STATUSES_FILE" | tr -d ' ') parent validation statuses from $PARENT_SHA"
                    else
                      echo "##vso[task.logissue type=warning]Failed to fetch parent statuses from $PARENT_SHA; carry-over samples will be reported as error. stderr: $(cat /tmp/fetch-parent-stderr 2>/dev/null || true)"
                      : > "$PARENT_STATUSES_FILE"
                      NO_PARENT_REASON="failed to fetch parent statuses from $PARENT_SHA"
                    fi
                  else
                    echo "##vso[task.logissue type=warning]No parent commit available (HEAD~1 not resolvable); carry-over samples will be reported as error."
                    NO_PARENT_REASON="no parent commit"
                  fi
                fi

                POST_FAIL_COUNT=0
                POST_TOTAL=0

                post_validation_status() {
                  local sample_path="$1"
                  local state="$2"
                  local description="$3"

                  POST_TOTAL=$((POST_TOTAL + 1))
                  if .azure-pipelines/scripts/post-validation-status.sh "$sample_path" "$state" "$BUILD_URL" "$description"; then
                    echo "Posted $state validation status for $sample_path"
                  else
                    POST_FAIL_COUNT=$((POST_FAIL_COUNT + 1))
                    echo "##vso[task.logissue type=error]Failed to post $state validation status for $sample_path"
                  fi
                }

                for lang in csharp python typescript java go; do
                  case "$lang" in
                    csharp) ARTIFACT_DIR="ResultsCSharp" ;;
                    python) ARTIFACT_DIR="ResultsPython" ;;
                    typescript) ARTIFACT_DIR="ResultsTypeScript" ;;
                    java) ARTIFACT_DIR="ResultsJava" ;;
                    go) ARTIFACT_DIR="ResultsGo" ;;
                  esac

                  CHANGED_FILE="$(Pipeline.Workspace)/ChangedSamples/changed_${lang}.txt"
                  PASSED_FILE="$(Pipeline.Workspace)/$ARTIFACT_DIR/passed_${lang}.txt"
                  FAILED_FILE="$(Pipeline.Workspace)/$ARTIFACT_DIR/failed_${lang}.txt"

                  declare -A REPORTED=()

                  if [[ -f "$PASSED_FILE" && -s "$PASSED_FILE" ]]; then
                    while IFS= read -r sample_path; do
                      [[ -z "$sample_path" ]] && continue
                      REPORTED["$sample_path"]=1
                      post_validation_status "$sample_path" success "L3 load validation passed"
                    done < "$PASSED_FILE"
                  fi

                  if [[ -f "$FAILED_FILE" && -s "$FAILED_FILE" ]]; then
                    while IFS= read -r sample_path; do
                      [[ -z "$sample_path" ]] && continue
                      REPORTED["$sample_path"]=1
                      post_validation_status "$sample_path" failure "L3 load validation failed"
                    done < "$FAILED_FILE"
                  fi

                  # ChangedSamples/changed_${lang}.txt is the per-language
                  # "expected set" for this run. On PR/CI it is the changed
                  # subset; on full-validation runs (validateAll=true OR
                  # Build.Reason=Schedule) the "Validate ALL samples" step
                  # populates it with every sample.yaml directory. Either way,
                  # any sample present in this file but missing from
                  # PASSED/FAILED gets an explicit `error` status so the gate
                  # never grandfathers an unreported sample.
                  if [[ -f "$CHANGED_FILE" && -s "$CHANGED_FILE" ]]; then
                    while IFS= read -r sample_path; do
                      [[ -z "$sample_path" ]] && continue
                      if [[ -z "${REPORTED[$sample_path]+x}" ]]; then
                        post_validation_status "$sample_path" error "L3 load validation did not complete"
                        REPORTED["$sample_path"]=1
                      fi
                    done < "$CHANGED_FILE"
                  fi

                  # Carry-over fan-out: on push:main partial runs, post a
                  # status for every sample.yaml in this language that wasn't
                  # already reported above. Decision matrix lives in
                  # decide-carry-over-state.sh.
                  if (( IS_PUSH_MAIN_PARTIAL == 1 )); then
                    while IFS= read -r yaml_file; do
                      [[ -z "$yaml_file" ]] && continue
                      sample_path="$(dirname "$yaml_file")"
                      [[ -n "${REPORTED[$sample_path]+x}" ]] && continue

                      if [[ -n "$NO_PARENT_REASON" ]]; then
                        post_validation_status "$sample_path" error "No prior successful validation to carry over ($NO_PARENT_REASON)"
                      else
                        decision="$(.azure-pipelines/scripts/decide-carry-over-state.sh "$sample_path" "$PARENT_STATUSES_FILE")"
                        carry_state="${decision%%$'\t'*}"
                        carry_desc="${decision#*$'\t'}"
                        post_validation_status "$sample_path" "$carry_state" "$carry_desc"
                      fi
                      REPORTED["$sample_path"]=1
                    done < <(find "samples/$lang" -name sample.yaml -type f 2>/dev/null)
                  fi
                done

                if [[ -n "$PARENT_STATUSES_FILE" && -f "$PARENT_STATUSES_FILE" ]]; then
                  rm -f "$PARENT_STATUSES_FILE"
                fi

                if (( POST_FAIL_COUNT > 0 )); then
                  echo "##vso[task.logissue type=error]$POST_FAIL_COUNT/$POST_TOTAL validation status posts failed; the sync gate would silently grandfather the affected samples. Failing the build so the failure is operator-visible."
                  exit 1
                fi

                echo "Successfully posted $POST_TOTAL validation statuses."

          - script: |
              PASSED_SAMPLES=0
              FAILED_SAMPLES=0
              FAILED_SAMPLE_LIST=""
              
              # Aggregate results from all language result files
              for lang in csharp python typescript java go; do
                case "$lang" in
                  csharp) ARTIFACT_DIR="ResultsCSharp" ;;
                  python) ARTIFACT_DIR="ResultsPython" ;;
                  typescript) ARTIFACT_DIR="ResultsTypeScript" ;;
                  java) ARTIFACT_DIR="ResultsJava" ;;
                  go) ARTIFACT_DIR="ResultsGo" ;;
                esac
                
                PASSED_FILE="$(Pipeline.Workspace)/$ARTIFACT_DIR/passed_${lang}.txt"
                FAILED_FILE="$(Pipeline.Workspace)/$ARTIFACT_DIR/failed_${lang}.txt"
                
                # Count passed samples
                if [ -f "$PASSED_FILE" ] && [ -s "$PASSED_FILE" ]; then
                  COUNT=$(wc -l < "$PASSED_FILE" | tr -d ' ')
                  PASSED_SAMPLES=$((PASSED_SAMPLES + COUNT))
                fi
                
                # Count and collect failed samples
                if [ -f "$FAILED_FILE" ] && [ -s "$FAILED_FILE" ]; then
                  COUNT=$(wc -l < "$FAILED_FILE" | tr -d ' ')
                  FAILED_SAMPLES=$((FAILED_SAMPLES + COUNT))
                  while IFS= read -r sample; do
                    [ -n "$sample" ] && FAILED_SAMPLE_LIST="$FAILED_SAMPLE_LIST
              - \`$sample\`"
                  done < "$FAILED_FILE"
                fi
              done
              
              if [ $FAILED_SAMPLES -gt 0 ]; then
                OVERALL_TEXT="Sample Validation Failed"
              else
                OVERALL_TEXT="Sample Validation Passed"
              fi
              
              cat > $(Build.ArtifactStagingDirectory)/pr-comment.md << EOF
              ## $OVERALL_TEXT
              
              **Summary:** $PASSED_SAMPLES passed, $FAILED_SAMPLES failed
              
              ### Results
              
              - **C#:** $(csharpResult)
              - **Python:** $(pythonResult)
              - **TypeScript/JS:** $(typescriptResult)
              - **Java:** $(javaResult)
              - **Go:** $(goResult)
              EOF
              
              # Add failed samples section if there are failures
              if [ $FAILED_SAMPLES -gt 0 ] && [ -n "$FAILED_SAMPLE_LIST" ]; then
                cat >> $(Build.ArtifactStagingDirectory)/pr-comment.md << EOF
              
              ### Failed Samples
              
              The following samples failed validation:
              $FAILED_SAMPLE_LIST
              
              > Check the pipeline logs for detailed error messages.
              EOF
              fi
              
              # Add footer
              cat >> $(Build.ArtifactStagingDirectory)/pr-comment.md << EOF
              
              ---
              <details>
              <summary>Pipeline Details</summary>
              
              - **Build:** [#$(Build.BuildId)]($(System.CollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId))
              - **Commit:** \`$(Build.SourceVersion)\`
              - **Branch:** \`$(Build.SourceBranch)\`
              
              </details>
              EOF
              
              # Print to console
              cat $(Build.ArtifactStagingDirectory)/pr-comment.md
              
              # Set multi-line variable by replacing newlines with %0A
              COMMENT_CONTENT=$(cat $(Build.ArtifactStagingDirectory)/pr-comment.md)
              COMMENT_CONTENT="${COMMENT_CONTENT//'%'/'%25'}"
              COMMENT_CONTENT="${COMMENT_CONTENT//$'\n'/'%0A'}"
              COMMENT_CONTENT="${COMMENT_CONTENT//$'\r'/'%0D'}"
              echo "##vso[task.setvariable variable=prCommentBody;isOutput=true]$COMMENT_CONTENT"
              
              echo ""
              echo "Validation complete."
            displayName: 'Generate validation summary'
            name: generateSummary

          - publish: $(Build.ArtifactStagingDirectory)/pr-comment.md
            artifact: ValidationSummary
            displayName: 'Publish validation summary'

          # Post comment to GitHub PR
          - task: GitHubComment@0
            condition: and(always(), eq(variables['Build.Reason'], 'PullRequest'))
            displayName: 'Post PR comment'
            inputs:
              gitHubConnection: 'azure-ai-foundry'
              repositoryName: '$(Build.Repository.Name)'
              comment: '$(generateSummary.prCommentBody)'

          # Generate the validation results manifest (JSON) for sync gating.
          # Collects per-sample pass/fail from language result files, discovers
          # samples without sample.yaml (skipped), and writes the manifest to
          # a well-known location for the sync workflow to consume.
          - script: |
              echo "Generating validation results manifest..."

              MANIFEST="$(Build.ArtifactStagingDirectory)/validation-results.json"
              TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

              TOTAL_PASSED=0
              TOTAL_FAILED=0
              TOTAL_SKIPPED=0
              # NOTE: RESULTS_JSON is built via repeated jq append, which is O(n²)
              # in the number of samples. Acceptable for now but should be refactored
              # to JSONL + jq -s if the sample count grows significantly.
              RESULTS_JSON="[]"

              # Collect passed and failed samples from each language's result files
              for lang in csharp python typescript java go; do
                case "$lang" in
                  csharp) ARTIFACT_DIR="ResultsCSharp" ;;
                  python) ARTIFACT_DIR="ResultsPython" ;;
                  typescript) ARTIFACT_DIR="ResultsTypeScript" ;;
                  java) ARTIFACT_DIR="ResultsJava" ;;
                  go) ARTIFACT_DIR="ResultsGo" ;;
                esac

                PASSED_FILE="$(Pipeline.Workspace)/$ARTIFACT_DIR/passed_${lang}.txt"
                FAILED_FILE="$(Pipeline.Workspace)/$ARTIFACT_DIR/failed_${lang}.txt"

                if [ -f "$PASSED_FILE" ] && [ -s "$PASSED_FILE" ]; then
                  while IFS= read -r sample_path; do
                    [ -z "$sample_path" ] && continue
                    TOTAL_PASSED=$((TOTAL_PASSED + 1))

                    LAST_COMMIT=$(git log -1 --format="%H" -- "$sample_path" 2>/dev/null || echo "unknown")

                    RESULTS_JSON=$(echo "$RESULTS_JSON" | jq \
                      --arg path "$sample_path" \
                      --arg lastCommit "$LAST_COMMIT" \
                      '. + [{
                        "path": $path,
                        "status": "passed",
                        "buildReadinessLevel": 3,
                        "lastModifiedCommit": $lastCommit
                      }]')
                  done < "$PASSED_FILE"
                fi

                if [ -f "$FAILED_FILE" ] && [ -s "$FAILED_FILE" ]; then
                  while IFS= read -r sample_path; do
                    [ -z "$sample_path" ] && continue
                    TOTAL_FAILED=$((TOTAL_FAILED + 1))

                    LAST_COMMIT=$(git log -1 --format="%H" -- "$sample_path" 2>/dev/null || echo "unknown")

                    RESULTS_JSON=$(echo "$RESULTS_JSON" | jq \
                      --arg path "$sample_path" \
                      --arg lastCommit "$LAST_COMMIT" \
                      '. + [{
                        "path": $path,
                        "status": "failed",
                        "buildReadinessLevel": 0,
                        "lastModifiedCommit": $lastCommit
                      }]')
                  done < "$FAILED_FILE"
                fi
              done

              # Discover sample directories without sample.yaml (skipped).
              # Uses process substitution (< <(find ...)) so that variable
              # mutations (RESULTS_JSON, TOTAL_SKIPPED) persist in the
              # current shell — a pipe would run the loop in a subshell.
              # Also builds a set of already-tracked paths for O(1) dedup.
              TRACKED_PATHS=$(echo "$RESULTS_JSON" | jq -r '.[].path')
              declare -A TRACKED_SET
              while IFS= read -r tp; do
                [ -n "$tp" ] && TRACKED_SET["$tp"]=1
              done <<< "$TRACKED_PATHS"

              for lang_dir in samples/*/; do
                [ -d "$lang_dir" ] || continue
                while IFS= read -r dir; do
                  # Skip if this directory has no code-like files or build markers
                  # (search recursively up to depth 4 to catch nested sources)
                  HAS_CODE=false
                  if find "$dir" -maxdepth 4 -type f \( \
                    -name "*.py" -o -name "*.cs" -o -name "*.java" -o \
                    -name "*.ts" -o -name "*.js" -o -name "*.go" -o -name "*.sh" -o \
                    -name "pom.xml" -o -name "package.json" -o -name "go.mod" -o \
                    -name "requirements.txt" \
                  \) -print -quit 2>/dev/null | grep -q .; then
                    HAS_CODE=true
                  fi
                  [ "$HAS_CODE" = "false" ] && continue

                  # Skip if this directory or any parent already has sample.yaml
                  CHECK_DIR="$dir"
                  HAS_YAML=false
                  while [ "$CHECK_DIR" != "samples" ] && [ "$CHECK_DIR" != "." ]; do
                    if [ -f "$CHECK_DIR/sample.yaml" ]; then
                      HAS_YAML=true
                      break
                    fi
                    CHECK_DIR=$(dirname "$CHECK_DIR")
                  done
                  [ "$HAS_YAML" = "true" ] && continue

                  # Skip if already tracked in passed/failed results
                  [ "${TRACKED_SET[$dir]+exists}" ] && continue

                  LAST_COMMIT=$(git log -1 --format="%H" -- "$dir" 2>/dev/null || echo "unknown")

                  TOTAL_SKIPPED=$((TOTAL_SKIPPED + 1))
                  RESULTS_JSON=$(echo "$RESULTS_JSON" | jq \
                    --arg path "$dir" \
                    --arg lastCommit "$LAST_COMMIT" \
                    '. + [{
                      "path": $path,
                      "status": "skipped",
                      "lastModifiedCommit": $lastCommit,
                      "reason": "No sample.yaml found"
                    }]')
                done < <(find "$lang_dir" -mindepth 2 -type d)
              done

              TOTAL=$((TOTAL_PASSED + TOTAL_FAILED + TOTAL_SKIPPED))

              # Assemble the full manifest
              jq -n \
                --arg commitSha "$(Build.SourceVersion)" \
                --arg branch "$(Build.SourceBranch)" \
                --arg timestamp "$TIMESTAMP" \
                --arg ciRunId "$(Build.BuildId)" \
                --argjson total "$TOTAL" \
                --argjson passed "$TOTAL_PASSED" \
                --argjson failed "$TOTAL_FAILED" \
                --argjson skipped "$TOTAL_SKIPPED" \
                --argjson results "$RESULTS_JSON" \
                '{
                  "run": {
                    "commitSha": $commitSha,
                    "branch": $branch,
                    "timestamp": $timestamp,
                    "ciRunId": $ciRunId
                  },
                  "summary": {
                    "total": $total,
                    "passed": $passed,
                    "failed": $failed,
                    "skipped": $skipped
                  },
                  "results": $results
                }' > "$MANIFEST"

              echo "Manifest generated:"
              cat "$MANIFEST" | jq '.summary'
              echo "Total results: $(echo "$RESULTS_JSON" | jq length)"
            displayName: 'Generate validation results manifest'

          - publish: $(Build.ArtifactStagingDirectory)/validation-results.json
            artifact: ValidationManifest
            displayName: 'Publish validation manifest'
            condition: always()

          # Push the manifest to the validation-results branch in GitHub.
          # The sync workflow reads from this branch to make gating decisions.
          - script: |
              set -e
              echo "Pushing validation manifest to validation-results branch..."

              MANIFEST="$(Build.ArtifactStagingDirectory)/validation-results.json"
              if [ ! -f "$MANIFEST" ]; then
                echo "No manifest found, skipping push."
                exit 0
              fi

              # Configure git for the push
              git config user.name "Azure Pipelines"
              git config user.email "azuredevops@microsoft.com"

              # Fetch the validation-results branch if it exists, or create an orphan.
              # Use --force to discard working tree changes left by validation stages
              # (e.g., nuget.config, .npmrc modified during builds).
              if git ls-remote --exit-code origin validation-results >/dev/null 2>&1; then
                git fetch origin validation-results
                git checkout --force -B validation-results origin/validation-results
              else
                echo "Creating new orphan branch: validation-results"
                git checkout --orphan validation-results
                git rm -rf . 2>/dev/null || true
              fi

              # Copy manifest and commit
              cp "$MANIFEST" validation-results.json
              git add validation-results.json
              git commit -m "Update validation results — $(Build.SourceVersion)

              Pipeline: $(Build.BuildId)
              Source branch: $(Build.SourceBranch)
              Timestamp: $(date -u +"%Y-%m-%dT%H:%M:%SZ")" || {
                echo "No changes to commit."
                exit 0
              }

              git push origin validation-results
              echo "Manifest pushed successfully."
            displayName: 'Push manifest to validation-results branch'
            condition: and(succeeded(), ne(variables['Build.Reason'], 'PullRequest'))
